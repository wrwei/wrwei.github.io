<svg xmlns="http://www.w3.org/2000/svg" width="720" height="448" viewBox="0 0 720 448" font-family="DM Sans, Microsoft YaHei, system-ui, sans-serif">
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/></marker></defs>
<text x="360" y="25" font-size="17" fill="#1A2E4A" text-anchor="middle">Ring all-reduce: four GPUs, four equal chunks</text>
<rect x="48" y="50" width="115" height="38" fill="#F0F9FF" stroke="#2563EB" rx="7"/>
<text x="105.5" y="74.0" font-size="13" fill="#1A2E4A" text-anchor="middle">GPU 0</text>
<path d="M 163 69 L 218 69" fill="none" stroke="#475569" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="218" y="50" width="115" height="38" fill="#F0F9FF" stroke="#2563EB" rx="7"/>
<text x="275.5" y="74.0" font-size="13" fill="#1A2E4A" text-anchor="middle">GPU 1</text>
<path d="M 333 69 L 388 69" fill="none" stroke="#475569" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="388" y="50" width="115" height="38" fill="#F0F9FF" stroke="#2563EB" rx="7"/>
<text x="445.5" y="74.0" font-size="13" fill="#1A2E4A" text-anchor="middle">GPU 2</text>
<path d="M 503 69 L 558 69" fill="none" stroke="#475569" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="558" y="50" width="115" height="38" fill="#F0F9FF" stroke="#2563EB" rx="7"/>
<text x="615.5" y="74.0" font-size="13" fill="#1A2E4A" text-anchor="middle">GPU 3</text>
<path d="M 673 69 L 700 69 L 700 104 L 25 104 L 25 69 L 48 69" fill="none" stroke="#475569" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="360" y="137" font-size="13" fill="#1A2E4A" text-anchor="middle">Reduce-scatter: received chunk and contributing ranks after each step</text>
<text x="134" y="161" font-size="13" fill="#1A2E4A" text-anchor="middle">GPU 0</text>
<text x="299" y="161" font-size="13" fill="#1A2E4A" text-anchor="middle">GPU 1</text>
<text x="464" y="161" font-size="13" fill="#1A2E4A" text-anchor="middle">GPU 2</text>
<text x="629" y="161" font-size="13" fill="#1A2E4A" text-anchor="middle">GPU 3</text>
<text x="20" y="194" font-size="13" fill="#1A2E4A" text-anchor="start">1</text>
<text x="134" y="194" font-size="12" fill="#1A2E4A" text-anchor="middle">c3: 0,3</text>
<text x="299" y="194" font-size="12" fill="#1A2E4A" text-anchor="middle">c0: 0,1</text>
<text x="464" y="194" font-size="12" fill="#1A2E4A" text-anchor="middle">c1: 1,2</text>
<text x="629" y="194" font-size="12" fill="#1A2E4A" text-anchor="middle">c2: 2,3</text>
<text x="20" y="224" font-size="13" fill="#1A2E4A" text-anchor="start">2</text>
<text x="134" y="224" font-size="12" fill="#1A2E4A" text-anchor="middle">c2: 0,2,3</text>
<text x="299" y="224" font-size="12" fill="#1A2E4A" text-anchor="middle">c3: 0,1,3</text>
<text x="464" y="224" font-size="12" fill="#1A2E4A" text-anchor="middle">c0: 0,1,2</text>
<text x="629" y="224" font-size="12" fill="#1A2E4A" text-anchor="middle">c1: 1,2,3</text>
<text x="20" y="254" font-size="13" fill="#1A2E4A" text-anchor="start">3</text>
<text x="134" y="254" font-size="12" fill="#1A2E4A" text-anchor="middle">c1: 0,1,2,3</text>
<text x="299" y="254" font-size="12" fill="#1A2E4A" text-anchor="middle">c2: 0,1,2,3</text>
<text x="464" y="254" font-size="12" fill="#1A2E4A" text-anchor="middle">c3: 0,1,2,3</text>
<text x="629" y="254" font-size="12" fill="#1A2E4A" text-anchor="middle">c0: 0,1,2,3</text>
<text x="360" y="287" font-size="13" fill="#1A2E4A" text-anchor="middle">All-gather: known fully summed chunks after each step</text>
<text x="20" y="320" font-size="13" fill="#1A2E4A" text-anchor="start">1</text>
<text x="134" y="320" font-size="12" fill="#1A2E4A" text-anchor="middle">c0,c1</text>
<text x="299" y="320" font-size="12" fill="#1A2E4A" text-anchor="middle">c1,c2</text>
<text x="464" y="320" font-size="12" fill="#1A2E4A" text-anchor="middle">c2,c3</text>
<text x="629" y="320" font-size="12" fill="#1A2E4A" text-anchor="middle">c0,c3</text>
<text x="20" y="350" font-size="13" fill="#1A2E4A" text-anchor="start">2</text>
<text x="134" y="350" font-size="12" fill="#1A2E4A" text-anchor="middle">c0,c1,c3</text>
<text x="299" y="350" font-size="12" fill="#1A2E4A" text-anchor="middle">c0,c1,c2</text>
<text x="464" y="350" font-size="12" fill="#1A2E4A" text-anchor="middle">c1,c2,c3</text>
<text x="629" y="350" font-size="12" fill="#1A2E4A" text-anchor="middle">c0,c2,c3</text>
<text x="20" y="380" font-size="13" fill="#1A2E4A" text-anchor="start">3</text>
<text x="134" y="380" font-size="12" fill="#1A2E4A" text-anchor="middle">c0,c1,c2,c3</text>
<text x="299" y="380" font-size="12" fill="#1A2E4A" text-anchor="middle">c0,c1,c2,c3</text>
<text x="464" y="380" font-size="12" fill="#1A2E4A" text-anchor="middle">c0,c1,c2,c3</text>
<text x="629" y="380" font-size="12" fill="#1A2E4A" text-anchor="middle">c0,c1,c2,c3</text>
<text x="360" y="421" font-size="13" fill="#475569" text-anchor="middle">Each GPU sends 6 × S/4 = 1.5S bytes; latency and topology are omitted.</text>
</svg>
