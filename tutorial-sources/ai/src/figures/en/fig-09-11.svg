<svg xmlns="http://www.w3.org/2000/svg" width="720" height="375" viewBox="0 0 720 375" font-family="DM Sans, PingFang SC, Microsoft YaHei, Noto Sans SC, system-ui, sans-serif" fill="#1A2E4A"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/></marker></defs><rect x="100" y="12" width="520" height="52" rx="8" fill="#F0F9FF" stroke="#2563EB" stroke-width="1.5"/><text x="360.0" y="43.0" text-anchor="middle" font-size="14" fill="#1A2E4A">KL-regularised objective</text><path d="M360 64 L360 85" fill="none" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="100" y="85" width="520" height="52" rx="8" fill="#F0F9FF" stroke="#2563EB" stroke-width="1.5"/><text x="360.0" y="116.0" text-anchor="middle" font-size="14" fill="#1A2E4A">π* = πref exp(r/β) / Z</text><path d="M360 137 L360 158" fill="none" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="100" y="158" width="520" height="52" rx="8" fill="#F0F9FF" stroke="#2563EB" stroke-width="1.5"/><text x="360.0" y="189.0" text-anchor="middle" font-size="14" fill="#1A2E4A">r = β log(π*/πref) + β log Z</text><path d="M360 210 L360 231" fill="none" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="100" y="231" width="520" height="52" rx="8" fill="#F0F9FF" stroke="#2563EB" stroke-width="1.5"/><text x="360.0" y="262.0" text-anchor="middle" font-size="14" fill="#1A2E4A">Same-prompt pair: log Z cancels</text><path d="M360 283 L360 304" fill="none" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="100" y="304" width="520" height="52" rx="8" fill="#F0F9FF" stroke="#2563EB" stroke-width="1.5"/><text x="360.0" y="335.0" text-anchor="middle" font-size="14" fill="#1A2E4A">LDPO = −log σ(β[log-ratio difference])</text></svg>