<svg font-family="DM Sans, PingFang SC, Microsoft YaHei, Noto Sans SC, system-ui, sans-serif" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 285" width="720" height="285">
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10" fill="#475569"/></marker></defs>
<text x="35" y="30" font-size="14" fill="#1A2E4A" text-anchor="start">每层重复，L = 36</text>
<rect x="50" y="65" width="230" height="100" rx="8" fill="#DBEAFE" stroke="#2563EB" stroke-width="1.5"/>
<text x="165.0" y="120.0" font-size="13" fill="#1A2E4A" text-anchor="middle">K  (B, 8, T, 128)</text>
<rect x="280" y="65" width="35" height="100" rx="8" fill="#F0FDF4" stroke="#15803D" stroke-width="1.5"/>
<text x="297.5" y="120.0" font-size="13" fill="#1A2E4A" text-anchor="middle">+1</text>
<text x="50" y="200" font-size="14" fill="#1A2E4A" text-anchor="start">沿 token 轴追加切片</text>
<rect x="370" y="65" width="230" height="100" rx="8" fill="#DBEAFE" stroke="#2563EB" stroke-width="1.5"/>
<text x="485.0" y="120.0" font-size="13" fill="#1A2E4A" text-anchor="middle">V  (B, 8, T, 128)</text>
<rect x="600" y="65" width="35" height="100" rx="8" fill="#F0FDF4" stroke="#15803D" stroke-width="1.5"/>
<text x="617.5" y="120.0" font-size="13" fill="#1A2E4A" text-anchor="middle">+1</text>
<text x="370" y="200" font-size="14" fill="#1A2E4A" text-anchor="start">沿 token 轴追加切片</text>
<text x="35" y="245" font-size="14" fill="#1A2E4A" text-anchor="start">每个 token：2 × 36 × 8 × 128 × 2 B = 147,456 B</text>
