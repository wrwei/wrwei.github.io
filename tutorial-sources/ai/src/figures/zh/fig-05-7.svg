<text x="62" y="143" font-size="12.5" text-anchor="middle" fill="#1A2E4A">~ <tspan font-style="italic">p</tspan>(<tspan font-weight="700">z</tspan>)</text>
<rect x="142.0" y="108.0" width="56" height="40" rx="8" fill="#FFF7ED" stroke="#C2410C" stroke-width="1.6"/>
<text x="170" y="133.95" font-size="17" text-anchor="middle" fill="#C2410C" font-weight="700"><tspan font-style="italic">G</tspan></text>
<rect x="222.0" y="105.0" width="120" height="46" rx="8" fill="#FFF7ED" stroke="#C2410C" stroke-width="1.6"/>
<text x="282" y="124" font-size="13" text-anchor="middle" fill="#1A2E4A">假样本</text>
<text x="282" y="143" font-size="12.5" text-anchor="middle" fill="#1A2E4A"><tspan font-style="italic">G</tspan>(<tspan font-weight="700">z</tspan>)</text>
<rect x="222.0" y="221.0" width="120" height="46" rx="8" fill="#F0FDF4" stroke="#15803D" stroke-width="1.6"/>
<text x="282" y="240" font-size="13" text-anchor="middle" fill="#1A2E4A">真样本</text>
<text x="282" y="259" font-size="12.5" text-anchor="middle" fill="#1A2E4A"><tspan font-weight="700">x</tspan> ~ <tspan font-style="italic">p</tspan><tspan dy="4" font-size="10">data</tspan><tspan dy="-4">​</tspan></text>
<rect x="382.0" y="166.0" width="56" height="40" rx="8" fill="#FAF5FF" stroke="#7E22CE" stroke-width="1.6"/>
<text x="410" y="191.95" font-size="17" text-anchor="middle" fill="#7E22CE" font-weight="700"><tspan font-style="italic">D</tspan></text>
<rect x="485.0" y="163.0" width="150" height="46" rx="8" fill="#FFFFFF" stroke="#7E22CE" stroke-width="1.6"/>
<text x="560" y="182" font-size="13" text-anchor="middle" fill="#1A2E4A"><tspan font-style="italic">D</tspan>(·) ∈ (0, 1)</text>
<text x="560" y="201" font-size="12.5" text-anchor="middle" fill="#1A2E4A">“为真”的概率</text>
<line x1="110.0" y1="128.0" x2="140.0" y2="128.0" stroke="#475569" stroke-width="1.6" marker-end="url(#ah)"/>
<line x1="198.0" y1="128.0" x2="220.0" y2="128.0" stroke="#475569" stroke-width="1.6" marker-end="url(#ah)"/>
<line x1="342.0" y1="138.0" x2="380.0" y2="174.0" stroke="#475569" stroke-width="1.6" marker-end="url(#ah)"/>
<line x1="342.0" y1="234.0" x2="380.0" y2="198.0" stroke="#475569" stroke-width="1.6" marker-end="url(#ah)"/>
<line x1="438.0" y1="186.0" x2="483.0" y2="186.0" stroke="#475569" stroke-width="1.6" marker-end="url(#ah)"/>
<rect x="430.0" y="23.0" width="260" height="50" rx="8" fill="#FFF7ED" stroke="#C2410C" stroke-width="1.6"/>
<text x="560" y="44" font-size="13" text-anchor="middle" fill="#C2410C" font-weight="700">G 的损失：骗过 <tspan font-style="italic">D</tspan></text>
<text x="560" y="63" font-size="12.5" text-anchor="middle" fill="#1A2E4A">非饱和：最大化 log <tspan font-style="italic">D</tspan>(<tspan font-style="italic">G</tspan>(<tspan font-weight="700">z</tspan>))</text>
<rect x="430.0" y="296.0" width="260" height="44" rx="8" fill="#FAF5FF" stroke="#7E22CE" stroke-width="1.6"/>
<text x="560" y="314" font-size="13" text-anchor="middle" fill="#7E22CE" font-weight="700">D 的损失：区分真与假</text>
<text x="560" y="333" font-size="12.5" text-anchor="middle" fill="#1A2E4A">交叉熵，标签真为 1、假为 0</text>
<line x1="560.0" y1="163.0" x2="560.0" y2="75.0" stroke="#475569" stroke-width="1.6" marker-end="url(#ah)"/>
<line x1="560.0" y1="209.0" x2="560.0" y2="294.0" stroke="#475569" stroke-width="1.6" marker-end="url(#ah)"/>
<path d="M430,40 L170,40 L170,106" fill="none" stroke="#C2410C" stroke-width="1.7" stroke-dasharray="6 4" marker-end="url(#aho)"/>
<text x="290" y="32" font-size="12" text-anchor="middle" fill="#C2410C" font-weight="600">更新 <tspan font-style="italic">G</tspan>（梯度经由 <tspan font-style="italic">D</tspan> 回传）</text>
<path d="M430,318 L410,318 L410,208" fill="none" stroke="#7E22CE" stroke-width="1.7" stroke-dasharray="6 4" marker-end="url(#ahp)"/>
<text x="400" y="300" font-size="12" text-anchor="end" fill="#7E22CE" font-weight="600">更新 <tspan font-style="italic">D</tspan></text>
<text x="16" y="318" font-size="12" text-anchor="start" fill="#475569">交替进行：<tspan font-style="italic">D</tspan> 更新一步，<tspan font-style="italic">G</tspan> 更新一步</text>
</svg>
