<svg font-family="DM Sans, PingFang SC, Microsoft YaHei, Noto Sans SC, system-ui, sans-serif" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" width="720" height="360">
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10" fill="#475569"/></marker></defs>
<text x="35" y="30" font-size="14" fill="#1A2E4A" text-anchor="start">逻辑块表</text>
