<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10" fill="#475569"/></marker></defs>
<text x="35" y="30" font-size="14" fill="#1A2E4A" text-anchor="start">普通解码：四次目标模型步 → 四个 token</text>
<rect x="35" y="50" width="140" height="45" rx="8" fill="#DBEAFE" stroke="#2563EB" stroke-width="1.5"/>
