<rect x="345" y="50" width="140" height="45" rx="8" fill="#DBEAFE" stroke="#2563EB" stroke-width="1.5"/>
<text x="415.0" y="77.5" font-size="13" fill="#1A2E4A" text-anchor="middle">目标模型</text>
<rect x="500" y="50" width="140" height="45" rx="8" fill="#DBEAFE" stroke="#2563EB" stroke-width="1.5"/>
<text x="570.0" y="77.5" font-size="13" fill="#1A2E4A" text-anchor="middle">目标模型</text>
<text x="35" y="140" font-size="14" fill="#1A2E4A" text-anchor="start">投机解码：四次草稿步 + 一次验证</text>
<rect x="35" y="160" width="95" height="35" rx="8" fill="#F0FDF4" stroke="#15803D" stroke-width="1.5"/>
<text x="82.5" y="182.5" font-size="13" fill="#1A2E4A" text-anchor="middle">the ✓</text>
<rect x="140" y="160" width="95" height="35" rx="8" fill="#F0FDF4" stroke="#15803D" stroke-width="1.5"/>
<text x="187.5" y="182.5" font-size="13" fill="#1A2E4A" text-anchor="middle">hazard ✓</text>
<rect x="245" y="160" width="95" height="35" rx="8" fill="#F0FDF4" stroke="#15803D" stroke-width="1.5"/>
<text x="292.5" y="182.5" font-size="13" fill="#1A2E4A" text-anchor="middle">is ✓</text>
<rect x="350" y="160" width="95" height="35" rx="8" fill="#F0FDF4" stroke="#15803D" stroke-width="1.5"/>
<text x="397.5" y="182.5" font-size="13" fill="#1A2E4A" text-anchor="middle">thermal ✗</text>
<rect x="475" y="155" width="205" height="50" rx="8" fill="#DBEAFE" stroke="#2563EB" stroke-width="1.5"/>
<text x="577.5" y="185.0" font-size="13" fill="#1A2E4A" text-anchor="middle">目标模型验证</text>
<text x="35" y="240" font-size="14" fill="#1A2E4A" text-anchor="start">提交 3 个接受 token + 1 个修正 token；丢弃后续状态</text>
<text x="35" y="268" font-size="12" fill="#1A2E4A" text-anchor="start">示例：c = 0.05，v = 1 → 耗时为目标步的 1.2 倍</text>
