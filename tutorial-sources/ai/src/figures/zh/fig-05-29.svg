<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 456" width="740" height="456" font-family="DM Sans, PingFang SC, Microsoft YaHei, Noto Sans SC, system-ui, sans-serif">
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker><marker id="ahr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#DC2626"/></marker><marker id="ahb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563EB"/></marker><marker id="ahg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94A3B8"/></marker></defs>
<rect x="12" y="11.0" width="172" height="42" rx="8" fill="#FFFFFF" stroke="#1A2E4A" stroke-width="1.6"/>
<text x="98.0" y="29.0" font-size="13" text-anchor="middle" fill="#1A2E4A" font-weight="700">数据是图</text>
<text x="98.0" y="45.0" font-size="13" text-anchor="middle" fill="#1A2E4A" font-weight="700">或网格吗？</text>
<line x1="184.0" y1="32.0" x2="228.0" y2="32.0" stroke="#15803D" stroke-width="1.6"/>
<text x="206.0" y="26.0" font-size="12" text-anchor="middle" fill="#15803D" font-weight="600">是</text>
<path d="M236,28.0 L244,32.0 L236,36.0 z" fill="#15803D"/>
<rect x="244" y="12.0" width="484" height="40" rx="8" fill="#F0FDF4" stroke="#15803D" stroke-width="1.5"/>
<text x="256" y="29.0" font-size="13" text-anchor="start" fill="#1A2E4A"><tspan font-weight="700" fill="#15803D">GNN</tspan></text>
<text x="256" y="46.0" font-size="11.5" text-anchor="start" fill="#475569">首个基线：手工图特征，或显而易见的结构规则</text>
<rect x="12" y="87.0" width="172" height="42" rx="8" fill="#FFFFFF" stroke="#1A2E4A" stroke-width="1.6"/>
<text x="98.0" y="105.0" font-size="13" text-anchor="middle" fill="#1A2E4A" font-weight="700">有控制</text>
<text x="98.0" y="121.0" font-size="13" text-anchor="middle" fill="#1A2E4A" font-weight="700">方程吗？</text>
<line x1="42.0" y1="53.0" x2="42.0" y2="86.0" stroke="#475569" stroke-width="1.6" marker-end="url(#ah)"/>
<text x="50" y="74.0" font-size="12" text-anchor="start" fill="#475569">否</text>
<line x1="184.0" y1="108.0" x2="228.0" y2="108.0" stroke="#7E22CE" stroke-width="1.6"/>
<text x="206.0" y="102.0" font-size="12" text-anchor="middle" fill="#7E22CE" font-weight="600">是</text>
<line x1="228.0" y1="86.0" x2="228.0" y2="130.0" stroke="#7E22CE" stroke-width="1.6"/>
<line x1="228.0" y1="86.0" x2="243.0" y2="86.0" stroke="#7E22CE" stroke-width="1.6"/>
<path d="M236,82.0 L244,86.0 L236,90.0 z" fill="#7E22CE"/>
<rect x="244" y="66.0" width="484" height="40" rx="8" fill="#FAF5FF" stroke="#7E22CE" stroke-width="1.5"/>
<text x="256" y="83.0" font-size="13" text-anchor="start" fill="#1A2E4A"><tspan font-weight="700" fill="#7E22CE">PINN</tspan><tspan fill="#1A2E4A">（数据稀疏、反问题）</tspan></text>
<text x="256" y="100.0" font-size="11.5" text-anchor="start" fill="#475569">首个基线：经典求解器加最小二乘拟合</text>
<line x1="228.0" y1="130.0" x2="243.0" y2="130.0" stroke="#7E22CE" stroke-width="1.6"/>
<path d="M236,126.0 L244,130.0 L236,134.0 z" fill="#7E22CE"/>
<rect x="244" y="110.0" width="484" height="40" rx="8" fill="#FAF5FF" stroke="#7E22CE" stroke-width="1.5"/>
<text x="256" y="127.0" font-size="13" text-anchor="start" fill="#1A2E4A"><tspan font-weight="700" fill="#7E22CE">神经算子</tspan><tspan fill="#1A2E4A">（求解器运行多次、查询多次）</tspan></text>
<text x="256" y="144.0" font-size="11.5" text-anchor="start" fill="#475569">首个基线：高斯过程或 POD 代理模型，以及求解器本身</text>
<rect x="12" y="207.0" width="172" height="42" rx="8" fill="#FFFFFF" stroke="#1A2E4A" stroke-width="1.6"/>
<text x="98.0" y="225.0" font-size="13" text-anchor="middle" fill="#1A2E4A" font-weight="700">需要</text>
<text x="98.0" y="241.0" font-size="13" text-anchor="middle" fill="#1A2E4A" font-weight="700">生成吗？</text>
<line x1="42.0" y1="129.0" x2="42.0" y2="206.0" stroke="#475569" stroke-width="1.6" marker-end="url(#ah)"/>
<text x="50" y="172.0" font-size="12" text-anchor="start" fill="#475569">否</text>
<line x1="184.0" y1="228.0" x2="228.0" y2="228.0" stroke="#C2410C" stroke-width="1.6"/>
<text x="206.0" y="222.0" font-size="12" text-anchor="middle" fill="#C2410C" font-weight="600">是</text>
<line x1="228.0" y1="184.0" x2="228.0" y2="272.0" stroke="#C2410C" stroke-width="1.6"/>
<line x1="228.0" y1="184.0" x2="243.0" y2="184.0" stroke="#C2410C" stroke-width="1.6"/>
<path d="M236,180.0 L244,184.0 L236,188.0 z" fill="#C2410C"/>
<rect x="244" y="164.0" width="484" height="40" rx="8" fill="#FFF7ED" stroke="#C2410C" stroke-width="1.5"/>
<text x="256" y="181.0" font-size="13" text-anchor="start" fill="#1A2E4A"><tspan font-weight="700" fill="#C2410C">扩散模型</tspan><tspan fill="#1A2E4A">（质量、条件生成）</tspan></text>
<text x="256" y="198.0" font-size="11.5" text-anchor="start" fill="#475569">首个基线：GAN 或 VAE</text>
<line x1="228.0" y1="228.0" x2="243.0" y2="228.0" stroke="#C2410C" stroke-width="1.6"/>
<path d="M236,224.0 L244,228.0 L236,232.0 z" fill="#C2410C"/>
<rect x="244" y="208.0" width="484" height="40" rx="8" fill="#FFF7ED" stroke="#C2410C" stroke-width="1.5"/>
<text x="256" y="225.0" font-size="13" text-anchor="start" fill="#1A2E4A"><tspan font-weight="700" fill="#C2410C">GAN</tspan><tspan fill="#1A2E4A">（速度）</tspan></text>
<text x="256" y="242.0" font-size="11.5" text-anchor="start" fill="#475569">首个基线：蒸馏到少数几步的扩散模型</text>
<line x1="228.0" y1="272.0" x2="243.0" y2="272.0" stroke="#C2410C" stroke-width="1.6"/>
<path d="M236,268.0 L244,272.0 L236,276.0 z" fill="#C2410C"/>
<rect x="244" y="252.0" width="484" height="40" rx="8" fill="#FFF7ED" stroke="#C2410C" stroke-width="1.5"/>
<text x="256" y="269.0" font-size="13" text-anchor="start" fill="#1A2E4A"><tspan font-weight="700" fill="#C2410C">VAE</tspan><tspan fill="#1A2E4A">（潜在空间）</tspan></text>
<text x="256" y="286.0" font-size="11.5" text-anchor="start" fill="#475569">首个基线：PCA 加高斯分布</text>
<rect x="12" y="327.0" width="172" height="42" rx="8" fill="#FFFFFF" stroke="#1A2E4A" stroke-width="1.6"/>
<text x="98.0" y="345.0" font-size="13" text-anchor="middle" fill="#1A2E4A" font-weight="700">标签</text>
<text x="98.0" y="361.0" font-size="13" text-anchor="middle" fill="#1A2E4A" font-weight="700">稀缺吗？</text>
<line x1="42.0" y1="249.0" x2="42.0" y2="326.0" stroke="#475569" stroke-width="1.6" marker-end="url(#ah)"/>
<text x="50" y="292.0" font-size="12" text-anchor="start" fill="#475569">否</text>
<line x1="184.0" y1="348.0" x2="228.0" y2="348.0" stroke="#2563EB" stroke-width="1.6"/>
<text x="206.0" y="342.0" font-size="12" text-anchor="middle" fill="#2563EB" font-weight="600">是</text>
<line x1="228.0" y1="326.0" x2="228.0" y2="370.0" stroke="#2563EB" stroke-width="1.6"/>
<line x1="228.0" y1="326.0" x2="243.0" y2="326.0" stroke="#2563EB" stroke-width="1.6"/>
<path d="M236,322.0 L244,326.0 L236,330.0 z" fill="#2563EB"/>
<rect x="244" y="306.0" width="484" height="40" rx="8" fill="#F0F9FF" stroke="#2563EB" stroke-width="1.5"/>
<text x="256" y="323.0" font-size="13" text-anchor="start" fill="#1A2E4A"><tspan font-weight="700" fill="#2563EB">对比或掩码预训练</tspan></text>
<text x="256" y="340.0" font-size="11.5" text-anchor="start" fill="#475569">首个基线：频谱或工程特征；PCA</text>
<line x1="228.0" y1="370.0" x2="243.0" y2="370.0" stroke="#2563EB" stroke-width="1.6"/>
<path d="M236,366.0 L244,370.0 L236,374.0 z" fill="#2563EB"/>
<rect x="244" y="350.0" width="484" height="40" rx="8" fill="#F0F9FF" stroke="#2563EB" stroke-width="1.5"/>
<text x="256" y="367.0" font-size="13" text-anchor="start" fill="#1A2E4A"><tspan font-weight="700" fill="#2563EB">自编码器</tspan><tspan fill="#1A2E4A">（压缩、去噪、检测异常）</tspan></text>
<text x="256" y="384.0" font-size="11.5" text-anchor="start" fill="#475569">首个基线：PCA 及其 Q 统计量</text>
<rect x="12" y="403.0" width="172" height="42" rx="8" fill="#FFFFFF" stroke="#1A2E4A" stroke-width="1.6"/>
<text x="98.0" y="421.0" font-size="13" text-anchor="middle" fill="#1A2E4A" font-weight="700">需要在固定计算量下</text>
<text x="98.0" y="437.0" font-size="13" text-anchor="middle" fill="#1A2E4A" font-weight="700">增加容量？</text>
<line x1="42.0" y1="369.0" x2="42.0" y2="402.0" stroke="#475569" stroke-width="1.6" marker-end="url(#ah)"/>
<text x="50" y="390.0" font-size="12" text-anchor="start" fill="#475569">否</text>
<line x1="184.0" y1="424.0" x2="228.0" y2="424.0" stroke="#B45309" stroke-width="1.6"/>
<text x="206.0" y="418.0" font-size="12" text-anchor="middle" fill="#B45309" font-weight="600">是</text>
<path d="M236,420.0 L244,424.0 L236,428.0 z" fill="#B45309"/>
<rect x="244" y="404.0" width="484" height="40" rx="8" fill="#FFFBEB" stroke="#B45309" stroke-width="1.5"/>
<text x="256" y="421.0" font-size="13" text-anchor="start" fill="#1A2E4A"><tspan font-weight="700" fill="#B45309">混合专家</tspan></text>
<text x="256" y="438.0" font-size="11.5" text-anchor="start" fill="#475569">首个基线：激活参数量相同的稠密模型</text>
</svg>
