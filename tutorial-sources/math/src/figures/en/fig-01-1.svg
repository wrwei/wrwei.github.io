<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 340" role="img" aria-label="N is a subset of Z, which is a subset of Q, which is a subset of R. Box sizes do not represent cardinality."><title id="title">Nested number systems</title><desc id="desc">N is a subset of Z, which is a subset of Q, which is a subset of R. Box sizes do not represent cardinality.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker></defs><rect width="760" height="340" fill="white"/><g font-family="system-ui,Segoe UI,Microsoft YaHei,sans-serif"><rect x="20" y="20" width="720" height="300" rx="12" fill="#faf5ff" stroke="#7e22ce"/><text x="35" y="49" text-anchor="start" font-size="17" fill="#1a2e4a">Real numbers R: e.g. √2, π</text><rect x="50" y="70" width="660" height="230" rx="12" fill="#fff7ed" stroke="#c2410c"/><text x="66" y="99" text-anchor="start" font-size="17" fill="#1a2e4a">Rational numbers Q: e.g. 1/3, −7/2</text><rect x="85" y="122" width="590" height="156" rx="12" fill="#f0fdf4" stroke="#15803d"/><text x="101" y="151" text-anchor="start" font-size="17" fill="#1a2e4a">Integers Z: e.g. −3, −1</text><rect x="120" y="174" width="520" height="82" rx="12" fill="#f0f9ff" stroke="#0ea5e9"/><text x="137" y="206" text-anchor="start" font-size="17" fill="#1a2e4a">Natural numbers N: 0, 1, 2, …</text><text x="137" y="232" text-anchor="start" font-size="15" fill="#1a2e4a">This series includes zero</text></g></svg>