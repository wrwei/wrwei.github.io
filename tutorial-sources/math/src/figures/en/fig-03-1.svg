<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 340" role="img" aria-label="Four membership valuations determine union, intersection, and difference; they do not represent region sizes."><title>Membership and set operations</title><desc>Four membership valuations determine union, intersection, and difference; they do not represent region sizes.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#2563eb"/></marker></defs><rect width="760" height="340" fill="white"/><g font-family="system-ui,Segoe UI,Microsoft YaHei,sans-serif"><text x="80" y="40" text-anchor="start" font-size="18" fill="#1a2e4a">x ∈ A</text><text x="210" y="40" text-anchor="start" font-size="18" fill="#1a2e4a">x ∈ B</text><text x="410" y="40" text-anchor="middle" font-size="18" fill="#1a2e4a">A ∪ B</text><text x="555" y="40" text-anchor="middle" font-size="18" fill="#1a2e4a">A ∩ B</text><text x="685" y="40" text-anchor="middle" font-size="18" fill="#1a2e4a">A \ B</text><rect x="30" y="62" width="700" height="44" rx="10" fill="#f0f9ff" stroke="#0ea5e9"/><text x="100" y="90" text-anchor="middle" font-size="20" fill="#1a2e4a">F</text><text x="235" y="90" text-anchor="middle" font-size="20" fill="#1a2e4a">F</text><text x="410" y="90" text-anchor="middle" font-size="20" fill="#1a2e4a">F</text><text x="555" y="90" text-anchor="middle" font-size="20" fill="#1a2e4a">F</text><text x="685" y="90" text-anchor="middle" font-size="20" fill="#1a2e4a">F</text><rect x="30" y="120" width="700" height="44" rx="10" fill="#f0f9ff" stroke="#0ea5e9"/><text x="100" y="148" text-anchor="middle" font-size="20" fill="#1a2e4a">F</text><text x="235" y="148" text-anchor="middle" font-size="20" fill="#1a2e4a">T</text><text x="410" y="148" text-anchor="middle" font-size="20" fill="#1a2e4a">T</text><text x="555" y="148" text-anchor="middle" font-size="20" fill="#1a2e4a">F</text><text x="685" y="148" text-anchor="middle" font-size="20" fill="#1a2e4a">F</text><rect x="30" y="178" width="700" height="44" rx="10" fill="#f0f9ff" stroke="#0ea5e9"/><text x="100" y="206" text-anchor="middle" font-size="20" fill="#1a2e4a">T</text><text x="235" y="206" text-anchor="middle" font-size="20" fill="#1a2e4a">F</text><text x="410" y="206" text-anchor="middle" font-size="20" fill="#1a2e4a">T</text><text x="555" y="206" text-anchor="middle" font-size="20" fill="#1a2e4a">F</text><text x="685" y="206" text-anchor="middle" font-size="20" fill="#1a2e4a">T</text><rect x="30" y="236" width="700" height="44" rx="10" fill="#f0f9ff" stroke="#0ea5e9"/><text x="100" y="264" text-anchor="middle" font-size="20" fill="#1a2e4a">T</text><text x="235" y="264" text-anchor="middle" font-size="20" fill="#1a2e4a">T</text><text x="410" y="264" text-anchor="middle" font-size="20" fill="#1a2e4a">T</text><text x="555" y="264" text-anchor="middle" font-size="20" fill="#1a2e4a">T</text><text x="685" y="264" text-anchor="middle" font-size="20" fill="#1a2e4a">F</text></g></svg>