<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 340" role="img" aria-label="0 maps to 1, 1 maps to 3, and 2 maps to 5. The codomain also contains the unused value 9."><title id="title">Domain codomain and image</title><desc id="desc">0 maps to 1, 1 maps to 3, and 2 maps to 5. The codomain also contains the unused value 9.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker></defs><rect width="760" height="340" fill="white"/><g font-family="system-ui,Segoe UI,Microsoft YaHei,sans-serif"><rect x="70" y="45" width="220" height="245" rx="12" fill="#f0f9ff" stroke="#0ea5e9"/><rect x="465" y="45" width="220" height="245" rx="12" fill="#faf5ff" stroke="#7e22ce"/><text x="180" y="30" text-anchor="middle" font-size="18" fill="#1a2e4a">Domain D</text><text x="575" y="30" text-anchor="middle" font-size="18" fill="#1a2e4a">Codomain C</text><text x="180" y="95" text-anchor="middle" font-size="22" fill="#1a2e4a">0</text><text x="575" y="95" text-anchor="middle" font-size="22" fill="#1a2e4a">1</text><path d="M225,88 L525,88" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arrow)"/><text x="180" y="160" text-anchor="middle" font-size="22" fill="#1a2e4a">1</text><text x="575" y="160" text-anchor="middle" font-size="22" fill="#1a2e4a">3</text><path d="M225,153 L525,153" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arrow)"/><text x="180" y="225" text-anchor="middle" font-size="22" fill="#1a2e4a">2</text><text x="575" y="225" text-anchor="middle" font-size="22" fill="#1a2e4a">5</text><path d="M225,218 L525,218" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arrow)"/><text x="575" y="275" text-anchor="middle" font-size="22" fill="#c2410c">9</text><text x="380" y="317" text-anchor="middle" font-size="17" fill="#1a2e4a">Image = {1, 3, 5}; 9 is not attained</text></g></svg>