<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 350" role="img" aria-label="Declare objective scales, sampling covariance, rate and optimiser state, then budget, validation and frozen testing. Descent on training data alone is not a generalisation guarantee."><title>Mathematical chain for a stochastic training report</title><desc>Declare objective scales, sampling covariance, rate and optimiser state, then budget, validation and frozen testing. Descent on training data alone is not a generalisation guarantee.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#2563eb"/></marker></defs><rect width="760" height="350" fill="white"/><g font-family="system-ui,Segoe UI,Microsoft YaHei,sans-serif"><text x="380" y="30" text-anchor="middle" font-size="23" fill="#1a2e4a">Audit an update and its report</text><rect x="45" y="55" width="670" height="47" rx="10" fill="#f0f9ff" stroke="#0ea5e9"/><text x="380" y="85" text-anchor="middle" font-size="21" fill="#1a2e4a">Objective and penalty scale</text><path d="M380,105L380,114" fill="none" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="45" y="119" width="670" height="47" rx="10" fill="#f0f9ff" stroke="#0ea5e9"/><text x="380" y="149" text-anchor="middle" font-size="21" fill="#1a2e4a">Sampling and conditional covariance</text><path d="M380,169L380,178" fill="none" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="45" y="183" width="670" height="47" rx="10" fill="#f0f9ff" stroke="#0ea5e9"/><text x="380" y="213" text-anchor="middle" font-size="21" fill="#1a2e4a">Rate and state recurrence</text><path d="M380,233L380,242" fill="none" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="45" y="247" width="670" height="47" rx="10" fill="#f0f9ff" stroke="#0ea5e9"/><text x="380" y="277" text-anchor="middle" font-size="21" fill="#1a2e4a">Budget, validation and final test</text><text x="380" y="333" text-anchor="middle" font-size="19" fill="#1a2e4a">Training descent alone does not prove population generalisation.</text></g></svg>