<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 350" role="img" aria-label="Independent replacement has covariance C over b; distinct subsets add the finite-population factor; copied gradients retain C."><title>Batch independence and finite-population correction</title><desc>Independent replacement has covariance C over b; distinct subsets add the finite-population factor; copied gradients retain C.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#2563eb"/></marker></defs><rect width="760" height="350" fill="white"/><g font-family="system-ui,Segoe UI,Microsoft YaHei,sans-serif"><text x="380" y="30" text-anchor="middle" font-size="23" fill="#1a2e4a">Same b, three covariance laws</text><rect x="35" y="55" width="690" height="70" rx="10" fill="#f0f9ff" stroke="#0ea5e9"/><text x="55" y="85" text-anchor="start" font-size="21" fill="#1a2e4a">Independent replacement</text><text x="700" y="111" text-anchor="end" font-size="24" fill="#1a2e4a">C/b</text><rect x="35" y="140" width="690" height="70" rx="10" fill="#f0f9ff" stroke="#0ea5e9"/><text x="55" y="170" text-anchor="start" font-size="21" fill="#1a2e4a">Uniform distinct-index subset</text><text x="700" y="196" text-anchor="end" font-size="24" fill="#1a2e4a">(C/b) (N−b)/(N−1)</text><rect x="35" y="225" width="690" height="70" rx="10" fill="#f0f9ff" stroke="#0ea5e9"/><text x="55" y="255" text-anchor="start" font-size="21" fill="#1a2e4a">One sampled gradient copied b times</text><text x="700" y="281" text-anchor="end" font-size="24" fill="#1a2e4a">C</text><text x="380" y="332" text-anchor="middle" font-size="18" fill="#1a2e4a">Subset formula needs N&gt;1; C uses denominator N.</text></g></svg>