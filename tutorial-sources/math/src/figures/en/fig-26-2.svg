<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 350" role="img" aria-label="Three distinct subjects each contain two methods and related variants; variants stay within subject groups, and independent subject differences are averaged and resampled."><title>Paired subjects and grouped units</title><desc>Three distinct subjects each contain two methods and related variants; variants stay within subject groups, and independent subject differences are averaged and resampled.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#2563eb"/></marker></defs><rect width="760" height="350" fill="white"/><g font-family="system-ui,Segoe UI,Microsoft YaHei,sans-serif"><text x="380" y="30" text-anchor="middle" font-size="23" fill="#1a2e4a">Compare and resample independent subjects</text><rect x="30" y="68" width="215" height="167" rx="10" fill="#f0f9ff" stroke="#0ea5e9"/><text x="137" y="102" text-anchor="middle" font-size="21" fill="#1a2e4a">Subject 1</text><text x="137" y="143" text-anchor="middle" font-size="22" fill="#1a2e4a">A_i, B_i</text><text x="137" y="180" text-anchor="middle" font-size="17" fill="#1a2e4a">Keep variants together</text><text x="137" y="214" text-anchor="middle" font-size="20" fill="#1a2e4a">D_i = A_i − B_i</text><rect x="275" y="68" width="215" height="167" rx="10" fill="#f0f9ff" stroke="#0ea5e9"/><text x="382" y="102" text-anchor="middle" font-size="21" fill="#1a2e4a">Subject 2</text><text x="382" y="143" text-anchor="middle" font-size="22" fill="#1a2e4a">A_i, B_i</text><text x="382" y="180" text-anchor="middle" font-size="17" fill="#1a2e4a">Keep variants together</text><text x="382" y="214" text-anchor="middle" font-size="20" fill="#1a2e4a">D_i = A_i − B_i</text><rect x="520" y="68" width="215" height="167" rx="10" fill="#f0f9ff" stroke="#0ea5e9"/><text x="627" y="102" text-anchor="middle" font-size="21" fill="#1a2e4a">Subject 3</text><text x="627" y="143" text-anchor="middle" font-size="22" fill="#1a2e4a">A_i, B_i</text><text x="627" y="180" text-anchor="middle" font-size="17" fill="#1a2e4a">Keep variants together</text><text x="627" y="214" text-anchor="middle" font-size="20" fill="#1a2e4a">D_i = A_i − B_i</text><text x="380" y="286" text-anchor="middle" font-size="21" fill="#1a2e4a">Var(D̄) = [Var(A)+Var(B)−2Cov(A,B)]/n</text><text x="380" y="329" text-anchor="middle" font-size="18" fill="#1a2e4a">Preserve within-pair dependence; state cross-pair independence.</text></g></svg>