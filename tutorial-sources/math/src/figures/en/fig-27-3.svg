<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 350" role="img" aria-label="Input X passes through Y to Z, with X and Z conditionally independent given Y; information X-Z does not exceed X-Y, without asserting every output entropy decreases."><title>Finite data-processing relation</title><desc>Input X passes through Y to Z, with X and Z conditionally independent given Y; information X-Z does not exceed X-Y, without asserting every output entropy decreases.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#2563eb"/></marker></defs><rect width="760" height="350" fill="white"/><g font-family="system-ui,Segoe UI,Microsoft YaHei,sans-serif"><text x="380" y="30" text-anchor="middle" font-size="23" fill="#1a2e4a">State the processing-chain condition</text><rect x="30" y="85" width="210" height="90" rx="10" fill="#f0f9ff" stroke="#0ea5e9"/><text x="135" y="141" text-anchor="middle" font-size="30" fill="#1a2e4a">X</text><rect x="275" y="85" width="210" height="90" rx="10" fill="#f0f9ff" stroke="#0ea5e9"/><text x="380" y="141" text-anchor="middle" font-size="30" fill="#1a2e4a">Y</text><rect x="520" y="85" width="210" height="90" rx="10" fill="#f0f9ff" stroke="#0ea5e9"/><text x="625" y="141" text-anchor="middle" font-size="30" fill="#1a2e4a">Z</text><path d="M245,130L265,130" fill="none" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M490,130L510,130" fill="none" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arrow)"/><text x="380" y="220" text-anchor="middle" font-size="21" fill="#1a2e4a">X and Z are conditionally independent given Y.</text><text x="380" y="266" text-anchor="middle" font-size="25" fill="#1a2e4a">I(X;Z) ≤ I(X;Y)</text><text x="380" y="319" text-anchor="middle" font-size="18" fill="#1a2e4a">Fresh noise can increase H(Z) without increasing information about X.</text></g></svg>