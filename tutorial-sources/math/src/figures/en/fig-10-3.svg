<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 345" role="img" aria-label="Intersecting lines have one solution, coincident lines infinitely many, distinct parallel lines none; a two-variable geometric example."><title>Three classes of solution sets</title><desc>Intersecting lines have one solution, coincident lines infinitely many, distinct parallel lines none; a two-variable geometric example.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#2563eb"/></marker></defs><rect width="760" height="345" fill="white"/><g font-family="system-ui,Segoe UI,Microsoft YaHei,sans-serif"><text x="380" y="30" text-anchor="middle" font-size="20" fill="#1a2e4a">Two unknowns: three geometric relationships of constraints</text><rect x="20" y="65" width="220" height="215" rx="10" fill="#fff" stroke="#94a3b8"/><path d="M40,260L220,95" stroke="#2563eb" stroke-width="4"/><path d="M40,95L220,260" stroke="#c2410c" stroke-width="4"/><circle cx="130" cy="177.5" r="6" fill="#1a2e4a"/><text x="130" y="315" text-anchor="middle" font-size="21" fill="#1a2e4a">Unique solution</text><rect x="270" y="65" width="220" height="215" rx="10" fill="#fff" stroke="#94a3b8"/><path d="M290,260L470,95" stroke="#2563eb" stroke-width="4"/><path d="M290,260L470,95" stroke="#c2410c" stroke-width="2" stroke-dasharray="8 5"/><text x="380" y="315" text-anchor="middle" font-size="21" fill="#1a2e4a">Infinitely many</text><rect x="520" y="65" width="220" height="215" rx="10" fill="#fff" stroke="#94a3b8"/><path d="M540,260L720,95" stroke="#2563eb" stroke-width="4"/><path d="M540,210L695,68" stroke="#c2410c" stroke-width="4"/><text x="630" y="315" text-anchor="middle" font-size="21" fill="#1a2e4a">No solution</text></g></svg>