<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 365" role="img" aria-label="The ratio-one-half series sums to two. Retaining one, two, four and ten terms leaves tails 1, 1/2, 1/8 and 1/512."><title>Geometric partial sums and exact tails</title><desc>The ratio-one-half series sums to two. Retaining one, two, four and ten terms leaves tails 1, 1/2, 1/8 and 1/512.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#2563eb"/></marker></defs><rect width="760" height="365" fill="white"/><g font-family="system-ui,Segoe UI,Microsoft YaHei,sans-serif"><text x="380" y="30" text-anchor="middle" font-size="23" fill="#1a2e4a">N counts terms: retain exponents 0 through N−1</text><path d="M70,100H695" stroke="#15803d" stroke-width="2" stroke-dasharray="7 4"/><path d="M70,245H695" stroke="#94a3b8"/><text x="700" y="104" text-anchor="start" font-size="18" fill="#1a2e4a">2</text><rect x="106" y="172.5" width="48" height="72.5" fill="#93c5fd"/><path d="M163,172.5V100" stroke="#c2410c" stroke-width="3"/><text x="130" y="272" text-anchor="middle" font-size="18" fill="#1a2e4a">N=1</text><text x="130" y="307" text-anchor="middle" font-size="18" fill="#c2410c">1</text><rect x="261" y="136.25" width="48" height="108.75" fill="#93c5fd"/><path d="M318,136.25V100" stroke="#c2410c" stroke-width="3"/><text x="285" y="272" text-anchor="middle" font-size="18" fill="#1a2e4a">N=2</text><text x="285" y="307" text-anchor="middle" font-size="18" fill="#c2410c">1/2</text><rect x="416" y="109.0625" width="48" height="135.9375" fill="#93c5fd"/><path d="M473,109.0625V100" stroke="#c2410c" stroke-width="3"/><text x="440" y="272" text-anchor="middle" font-size="18" fill="#1a2e4a">N=4</text><text x="440" y="307" text-anchor="middle" font-size="18" fill="#c2410c">1/8</text><rect x="571" y="100.1416015625" width="48" height="144.8583984375" fill="#93c5fd"/><path d="M628,100.1416015625V100" stroke="#c2410c" stroke-width="3"/><text x="595" y="272" text-anchor="middle" font-size="18" fill="#1a2e4a">N=10</text><text x="595" y="307" text-anchor="middle" font-size="18" fill="#c2410c">1/512</text><text x="380" y="340" text-anchor="middle" font-size="17" fill="#1a2e4a">Orange: exact tail 2^{1−N}; blue: partial sum.</text></g></svg>