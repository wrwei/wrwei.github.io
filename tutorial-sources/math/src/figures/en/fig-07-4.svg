<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 465" role="img" aria-label="Send, retry, timeout reach unacknowledged idle. Acknowledgement reaches two acknowledged states; repaired timeout stays in the second waiting state."><title>Product states in the retry protocol</title><desc>Send, retry, timeout reach unacknowledged idle. Acknowledgement reaches two acknowledged states; repaired timeout stays in the second waiting state.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#2563eb"/></marker></defs><rect width="760" height="465" fill="white"/><g font-family="system-ui,Segoe UI,Microsoft YaHei,sans-serif"><text x="380" y="30" text-anchor="middle" font-size="19" fill="#1a2e4a">Complete state = control, send count, acknowledgement flag</text><rect x="35" y="75" width="185" height="55" rx="10" fill="#f0f9ff" stroke="#2563eb"/><text x="127" y="109" text-anchor="middle" font-size="18" fill="#1a2e4a">idle,0,F</text><rect x="285" y="75" width="185" height="55" rx="10" fill="#f0f9ff" stroke="#2563eb"/><text x="377" y="109" text-anchor="middle" font-size="18" fill="#1a2e4a">waiting,1,F</text><rect x="285" y="205" width="185" height="55" rx="10" fill="#f0f9ff" stroke="#2563eb"/><text x="377" y="239" text-anchor="middle" font-size="18" fill="#1a2e4a">waiting,2,F</text><rect x="535" y="75" width="185" height="55" rx="10" fill="#f0f9ff" stroke="#2563eb"/><text x="627" y="109" text-anchor="middle" font-size="18" fill="#1a2e4a">idle,1,T</text><rect x="535" y="205" width="185" height="55" rx="10" fill="#f0f9ff" stroke="#2563eb"/><text x="627" y="239" text-anchor="middle" font-size="18" fill="#1a2e4a">idle,2,T</text><rect x="285" y="345" width="185" height="55" rx="10" fill="#fff1f2" stroke="#be123c"/><text x="377" y="379" text-anchor="middle" font-size="18" fill="#1a2e4a">idle,2,F</text><path d="M225,102L275,102" fill="none" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arrow)"/><text x="250" y="91" text-anchor="middle" font-size="14" fill="#1a2e4a">send</text><path d="M377,135L377,195" fill="none" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arrow)"/><text x="405" y="170" text-anchor="start" font-size="15" fill="#1a2e4a">retry</text><path d="M475,102L525,102" fill="none" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arrow)"/><text x="500" y="90" text-anchor="middle" font-size="14" fill="#1a2e4a">ack</text><path d="M475,232L525,232" fill="none" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arrow)"/><text x="500" y="220" text-anchor="middle" font-size="14" fill="#1a2e4a">ack</text><path d="M377,265L377,335" fill="none" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arrow)"/><text x="405" y="298" text-anchor="start" font-size="15" fill="#1a2e4a">faulty timeout</text><path d="M315,260C200,320 200,190 285,220" fill="none" stroke="#15803d" stroke-width="2.5" marker-end="url(#arrow)"/><text x="50" y="305" text-anchor="start" font-size="15" fill="#1a2e4a">Repair timeout: stay waiting</text><text x="380" y="438" text-anchor="middle" font-size="17" fill="#1a2e4a">Red state is unsafe; a safe self-loop can still wait forever.</text></g></svg>