<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 340" role="img" aria-label="P0 and immediate successor implications cover the naturals. The faulty odd-sum base fails even though its step is consistent."><title>Induction chain and missing base</title><desc>P0 and immediate successor implications cover the naturals. The faulty odd-sum base fails even though its step is consistent.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#2563eb"/></marker></defs><rect width="760" height="340" fill="white"/><g font-family="system-ui,Segoe UI,Microsoft YaHei,sans-serif"><text x="380" y="42" text-anchor="middle" font-size="20" fill="#1a2e4a">Both base and successor step are needed</text><rect x="30" y="95" width="115" height="70" rx="10" fill="#f0fdf4" stroke="#15803d"/><text x="87" y="138" text-anchor="middle" font-size="24" fill="#1a2e4a">P(0)</text><path d="M147,130L169,130" fill="none" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="175" y="95" width="115" height="70" rx="10" fill="#f0f9ff" stroke="#0ea5e9"/><text x="232" y="138" text-anchor="middle" font-size="24" fill="#1a2e4a">P(1)</text><path d="M292,130L314,130" fill="none" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="320" y="95" width="115" height="70" rx="10" fill="#f0f9ff" stroke="#0ea5e9"/><text x="377" y="138" text-anchor="middle" font-size="24" fill="#1a2e4a">P(2)</text><path d="M437,130L459,130" fill="none" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="465" y="95" width="115" height="70" rx="10" fill="#f0f9ff" stroke="#0ea5e9"/><text x="522" y="138" text-anchor="middle" font-size="24" fill="#1a2e4a">P(3)</text><path d="M582,130L604,130" fill="none" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="610" y="95" width="115" height="70" rx="10" fill="#f0f9ff" stroke="#0ea5e9"/><text x="667" y="138" text-anchor="middle" font-size="24" fill="#1a2e4a">…</text><text x="90" y="203" text-anchor="middle" font-size="15" fill="#1a2e4a">Base proved</text><text x="395" y="203" text-anchor="middle" font-size="16" fill="#1a2e4a">Each step: assume P(k), derive P(k+1)</text><text x="380" y="285" text-anchor="middle" font-size="19" fill="#1a2e4a">Faulty n²+1: consistent step, but base 0 ≠ 1</text></g></svg>