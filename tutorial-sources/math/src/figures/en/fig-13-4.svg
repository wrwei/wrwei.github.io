<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 380" role="img" aria-label="For diag(1,100), the condition ratio is 100. Target (0,100) and perturbation (0.01,0) attain relative amplification 100."><title>Directional sensitivity in an SPD inverse</title><desc>For diag(1,100), the condition ratio is 100. Target (0,100) and perturbation (0.01,0) attain relative amplification 100.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#2563eb"/></marker></defs><rect width="760" height="380" fill="white"/><g font-family="system-ui,Segoe UI,Microsoft YaHei,sans-serif"><text x="380" y="30" text-anchor="middle" font-size="20" fill="#1a2e4a">SPD condition ratio: a strong target and a weak inverse disturbance</text><rect x="30" y="70" width="700" height="235" rx="10" fill="#f0f9ff" stroke="#0ea5e9"/><text x="380" y="113" text-anchor="middle" font-size="27" fill="#1a2e4a">A=diag(1,100);    κ₂=100</text><text x="225" y="169" text-anchor="middle" font-size="25" fill="#1a2e4a">b=(0,100)</text><text x="535" y="169" text-anchor="middle" font-size="25" fill="#1a2e4a">x=(0,1)</text><path d="M330,160L420,160" fill="none" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arrow)"/><text x="225" y="226" text-anchor="middle" font-size="25" fill="#1a2e4a">δb=(0.01,0)</text><text x="535" y="226" text-anchor="middle" font-size="25" fill="#1a2e4a">δx=(0.01,0)</text><path d="M330,217L420,217" fill="none" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arrow)"/><text x="380" y="282" text-anchor="middle" font-size="20" fill="#1a2e4a">Relative change 10⁻⁴ → 10⁻²: these directions attain the bound.</text><text x="380" y="347" text-anchor="middle" font-size="18" fill="#1a2e4a">Other directions need not amplify equally; nonsymmetric maps need singular values.</text></g></svg>