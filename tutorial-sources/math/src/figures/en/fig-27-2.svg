<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 350" role="img" aria-label="Source probabilities point five, point three, point two weight prediction surprisal two, one, two; cross-entropy one point seven bits splits into source entropy and forward divergence."><title>Cross-entropy and directional mismatch</title><desc>Source probabilities point five, point three, point two weight prediction surprisal two, one, two; cross-entropy one point seven bits splits into source entropy and forward divergence.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#2563eb"/></marker></defs><rect width="760" height="350" fill="white"/><g font-family="system-ui,Segoe UI,Microsoft YaHei,sans-serif"><text x="380" y="30" text-anchor="middle" font-size="23" fill="#1a2e4a">Source weights multiply predicted surprisal</text><text x="85" y="78" text-anchor="middle" font-size="19" fill="#1a2e4a">Category</text><text x="230" y="78" text-anchor="middle" font-size="19" fill="#1a2e4a">p</text><text x="375" y="78" text-anchor="middle" font-size="19" fill="#1a2e4a">q</text><text x="520" y="78" text-anchor="middle" font-size="19" fill="#1a2e4a">−log₂q</text><text x="665" y="78" text-anchor="middle" font-size="19" fill="#1a2e4a">p(−log₂q)</text><rect x="25" y="98" width="710" height="43" rx="10" fill="#f0f9ff" stroke="#0ea5e9"/><text x="85" y="127" text-anchor="middle" font-size="21" fill="#1a2e4a">a</text><text x="230" y="127" text-anchor="middle" font-size="21" fill="#1a2e4a">.5</text><text x="375" y="127" text-anchor="middle" font-size="21" fill="#1a2e4a">.25</text><text x="520" y="127" text-anchor="middle" font-size="21" fill="#1a2e4a">2</text><text x="665" y="127" text-anchor="middle" font-size="21" fill="#1a2e4a">1</text><rect x="25" y="149" width="710" height="43" rx="10" fill="#f0f9ff" stroke="#0ea5e9"/><text x="85" y="178" text-anchor="middle" font-size="21" fill="#1a2e4a">b</text><text x="230" y="178" text-anchor="middle" font-size="21" fill="#1a2e4a">.3</text><text x="375" y="178" text-anchor="middle" font-size="21" fill="#1a2e4a">.5</text><text x="520" y="178" text-anchor="middle" font-size="21" fill="#1a2e4a">1</text><text x="665" y="178" text-anchor="middle" font-size="21" fill="#1a2e4a">.3</text><rect x="25" y="200" width="710" height="43" rx="10" fill="#f0f9ff" stroke="#0ea5e9"/><text x="85" y="229" text-anchor="middle" font-size="21" fill="#1a2e4a">c</text><text x="230" y="229" text-anchor="middle" font-size="21" fill="#1a2e4a">.2</text><text x="375" y="229" text-anchor="middle" font-size="21" fill="#1a2e4a">.25</text><text x="520" y="229" text-anchor="middle" font-size="21" fill="#1a2e4a">2</text><text x="665" y="229" text-anchor="middle" font-size="21" fill="#1a2e4a">.4</text><text x="380" y="292" text-anchor="middle" font-size="21" fill="#1a2e4a">H₂(p,q) = 1.7 = H₂(p) + D₂(p||q)</text><text x="380" y="331" text-anchor="middle" font-size="21" fill="#1a2e4a">1.7 = 1.485475 + .214525 bits</text></g></svg>