<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 370" role="img" aria-label="Weights (5,2,−1) and (−11,1.1,−0.5) predict −27+0.2C for all records satisfying F=1.8C+32."><title>Parameter equivalence along a null direction</title><desc>Weights (5,2,−1) and (−11,1.1,−0.5) predict −27+0.2C for all records satisfying F=1.8C+32.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#2563eb"/></marker></defs><rect width="760" height="370" fill="white"/><g font-family="system-ui,Segoe UI,Microsoft YaHei,sans-serif"><text x="380" y="30" text-anchor="middle" font-size="21" fill="#1a2e4a">Different weights, identical valid temperature predictions</text><rect x="35" y="90" width="330" height="75" rx="10" fill="#f0f9ff" stroke="#0ea5e9"/><text x="200" y="135" text-anchor="middle" font-size="22" fill="#1a2e4a">w = (5,2,−1)</text><path d="M375,128L470,194" fill="none" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="35" y="225" width="330" height="75" rx="10" fill="#f0f9ff" stroke="#0ea5e9"/><text x="200" y="270" text-anchor="middle" font-size="22" fill="#1a2e4a">w′ = (−11,1.1,−0.5)</text><path d="M375,263L470,194" fill="none" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="480" y="133" width="250" height="120" rx="10" fill="#f0fdf4" stroke="#15803d"/><text x="605" y="178" text-anchor="middle" font-size="20" fill="#1a2e4a">Shared prediction function</text><text x="605" y="220" text-anchor="middle" font-size="25" fill="#1a2e4a">−27 + 0.2C</text><text x="380" y="345" text-anchor="middle" font-size="20" fill="#1a2e4a">w′ − w = 0.5(−32,−1.8,1);   F = 1.8C + 32</text></g></svg>