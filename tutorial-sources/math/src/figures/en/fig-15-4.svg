<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 350" role="img" aria-label="The original residual at zero is ten. Extreme relaxation puts the applied step below tolerance, while the distance to the fixed point one hundred remains almost one hundred."><title>False accuracy from relaxation</title><desc>The original residual at zero is ten. Extreme relaxation puts the applied step below tolerance, while the distance to the fixed point one hundred remains almost one hundred.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#2563eb"/></marker></defs><rect width="760" height="350" fill="white"/><g font-family="system-ui,Segoe UI,Microsoft YaHei,sans-serif"><text x="380" y="30" text-anchor="middle" font-size="22" fill="#1a2e4a">A small applied step does not imply proximity to the solution</text><rect x="35" y="65" width="215" height="160" rx="10" fill="#f0f9ff" stroke="#0ea5e9"/><rect x="275" y="65" width="210" height="160" rx="10" fill="#f0f9ff" stroke="#0ea5e9"/><rect x="510" y="65" width="215" height="160" rx="10" fill="#f0f9ff" stroke="#0ea5e9"/><text x="142" y="100" text-anchor="middle" font-size="21" fill="#1a2e4a">Current x = 0</text><text x="142" y="145" text-anchor="middle" font-size="20" fill="#1a2e4a">Original residual 10</text><text x="142" y="190" text-anchor="middle" font-size="18" fill="#1a2e4a">F(x)=.9x+10</text><text x="380" y="100" text-anchor="middle" font-size="21" fill="#1a2e4a">α = 10⁻¹⁰</text><text x="380" y="145" text-anchor="middle" font-size="20" fill="#1a2e4a">Applied step 10⁻⁹</text><text x="380" y="190" text-anchor="middle" font-size="18" fill="#1a2e4a">10⁻⁹ &lt; tol 10⁻⁶</text><text x="617" y="100" text-anchor="middle" font-size="20" fill="#1a2e4a">Fixed point x* = 100</text><text x="617" y="145" text-anchor="middle" font-size="20" fill="#1a2e4a">Error near 100</text><text x="617" y="190" text-anchor="middle" font-size="18" fill="#1a2e4a">r/(1−.9) ≈ 100</text><path d="M250,145L275,145" fill="none" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M485,145L510,145" fill="none" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arrow)"/><text x="380" y="277" text-anchor="middle" font-size="20" fill="#1a2e4a">Report the original residual and the proved error bound.</text><text x="380" y="322" text-anchor="middle" font-size="18" fill="#1a2e4a">Relaxation changes the meaning of an update threshold.</text></g></svg>