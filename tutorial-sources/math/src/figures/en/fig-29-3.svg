<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 350" role="img" aria-label="Large logits shifted by their maximum give finite probabilities and the original model loss; derivative differences balance truncation and rounding."><title>Stable logits and finite-difference balance</title><desc>Large logits shifted by their maximum give finite probabilities and the original model loss; derivative differences balance truncation and rounding.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#2563eb"/></marker></defs><rect width="760" height="350" fill="white"/><g font-family="system-ui,Segoe UI,Microsoft YaHei,sans-serif"><text x="380" y="30" text-anchor="middle" font-size="22" fill="#1a2e4a">Stabilise evaluation, then check the same derivative</text><rect x="35" y="65" width="690" height="65" rx="10" fill="#f0f9ff" stroke="#0ea5e9"/><text x="55" y="92" text-anchor="start" font-size="20" fill="#1a2e4a">Raw logits</text><text x="55" y="118" text-anchor="start" font-size="22" fill="#1a2e4a">(1000,1001,1002)</text><rect x="35" y="145" width="690" height="65" rx="10" fill="#f0f9ff" stroke="#0ea5e9"/><text x="55" y="172" text-anchor="start" font-size="20" fill="#1a2e4a">Subtract common maximum</text><text x="55" y="198" text-anchor="start" font-size="22" fill="#1a2e4a">(−2,−1,0)</text><rect x="35" y="225" width="690" height="65" rx="10" fill="#f0f9ff" stroke="#0ea5e9"/><text x="55" y="252" text-anchor="start" font-size="20" fill="#1a2e4a">Probabilities and class-0 NLL</text><text x="55" y="278" text-anchor="start" font-size="22" fill="#1a2e4a">(.09003,.24473,.66524); 2.407606</text><text x="380" y="330" text-anchor="middle" font-size="19" fill="#1a2e4a">Difference h too large: truncation; too small: rounding.</text></g></svg>