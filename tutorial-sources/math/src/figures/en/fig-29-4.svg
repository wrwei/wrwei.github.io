<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 350" role="img" aria-label="Connect equation and scale to precision, conditioning and algorithm, then declare error evidence, tolerances and versions."><title>Auditable numerical experiment</title><desc>Connect equation and scale to precision, conditioning and algorithm, then declare error evidence, tolerances and versions.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#2563eb"/></marker></defs><rect width="760" height="350" fill="white"/><g font-family="system-ui,Segoe UI,Microsoft YaHei,sans-serif"><text x="380" y="30" text-anchor="middle" font-size="22" fill="#1a2e4a">Five links in a numerical report</text><rect x="45" y="48" width="670" height="42" rx="10" fill="#f0f9ff" stroke="#0ea5e9"/><text x="380" y="76" text-anchor="middle" font-size="20" fill="#1a2e4a">Equation, input contract and target scale</text><path d="M380,91L380,102" fill="none" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="45" y="104" width="670" height="42" rx="10" fill="#f0f9ff" stroke="#0ea5e9"/><text x="380" y="132" text-anchor="middle" font-size="20" fill="#1a2e4a">Input / accumulation / output precision</text><path d="M380,147L380,158" fill="none" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="45" y="160" width="670" height="42" rx="10" fill="#f0f9ff" stroke="#0ea5e9"/><text x="380" y="188" text-anchor="middle" font-size="20" fill="#1a2e4a">Singular values, condition and rank cutoff</text><path d="M380,203L380,214" fill="none" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="45" y="216" width="670" height="42" rx="10" fill="#f0f9ff" stroke="#0ea5e9"/><text x="380" y="244" text-anchor="middle" font-size="20" fill="#1a2e4a">Algorithm, budget and stopping rule</text><path d="M380,259L380,270" fill="none" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="45" y="272" width="670" height="42" rx="10" fill="#f0f9ff" stroke="#0ea5e9"/><text x="380" y="300" text-anchor="middle" font-size="20" fill="#1a2e4a">Residual, reference, tolerance and versions</text></g></svg>