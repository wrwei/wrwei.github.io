<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 425" role="img" aria-label="Times three mod seven yields 0,3,6,2,5,1,4 once each. Times two mod six yields 0,2,4,0,2,4 and never one."><title>Invertible and noninvertible multiplication maps</title><desc>Times three mod seven yields 0,3,6,2,5,1,4 once each. Times two mod six yields 0,2,4,0,2,4 and never one.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#2563eb"/></marker></defs><rect width="760" height="425" fill="white"/><g font-family="system-ui,Segoe UI,Microsoft YaHei,sans-serif"><text x="380" y="30" text-anchor="middle" font-size="20" fill="#1a2e4a">The gcd determines whether multiplication can be reversed</text><text x="30" y="70" text-anchor="start" font-size="19" fill="#1a2e4a">3 × r mod 7</text><text x="65" y="102" text-anchor="middle" font-size="20" fill="#1a2e4a">0</text><path d="M65,112L65,146" fill="none" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="44" y="155" width="42" height="35" rx="10" fill="#f0f9ff" stroke="#2563eb"/><text x="65" y="179" text-anchor="middle" font-size="21" fill="#1a2e4a">0</text><text x="164" y="102" text-anchor="middle" font-size="20" fill="#1a2e4a">1</text><path d="M164,112L164,146" fill="none" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="143" y="155" width="42" height="35" rx="10" fill="#f0f9ff" stroke="#2563eb"/><text x="164" y="179" text-anchor="middle" font-size="21" fill="#1a2e4a">3</text><text x="263" y="102" text-anchor="middle" font-size="20" fill="#1a2e4a">2</text><path d="M263,112L263,146" fill="none" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="242" y="155" width="42" height="35" rx="10" fill="#f0f9ff" stroke="#2563eb"/><text x="263" y="179" text-anchor="middle" font-size="21" fill="#1a2e4a">6</text><text x="362" y="102" text-anchor="middle" font-size="20" fill="#1a2e4a">3</text><path d="M362,112L362,146" fill="none" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="341" y="155" width="42" height="35" rx="10" fill="#f0f9ff" stroke="#2563eb"/><text x="362" y="179" text-anchor="middle" font-size="21" fill="#1a2e4a">2</text><text x="461" y="102" text-anchor="middle" font-size="20" fill="#1a2e4a">4</text><path d="M461,112L461,146" fill="none" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="440" y="155" width="42" height="35" rx="10" fill="#f0f9ff" stroke="#2563eb"/><text x="461" y="179" text-anchor="middle" font-size="21" fill="#1a2e4a">5</text><text x="560" y="102" text-anchor="middle" font-size="20" fill="#1a2e4a">5</text><path d="M560,112L560,146" fill="none" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="539" y="155" width="42" height="35" rx="10" fill="#f0fdf4" stroke="#15803d"/><text x="560" y="179" text-anchor="middle" font-size="21" fill="#1a2e4a">1</text><text x="659" y="102" text-anchor="middle" font-size="20" fill="#1a2e4a">6</text><path d="M659,112L659,146" fill="none" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="638" y="155" width="42" height="35" rx="10" fill="#f0f9ff" stroke="#2563eb"/><text x="659" y="179" text-anchor="middle" font-size="21" fill="#1a2e4a">4</text><text x="30" y="225" text-anchor="start" font-size="19" fill="#1a2e4a">2 × r mod 6</text><text x="65" y="257" text-anchor="middle" font-size="20" fill="#1a2e4a">0</text><path d="M65,267L65,301" fill="none" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="44" y="310" width="42" height="35" rx="10" fill="#f0f9ff" stroke="#2563eb"/><text x="65" y="334" text-anchor="middle" font-size="21" fill="#1a2e4a">0</text><text x="164" y="257" text-anchor="middle" font-size="20" fill="#1a2e4a">1</text><path d="M164,267L164,301" fill="none" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="143" y="310" width="42" height="35" rx="10" fill="#f0f9ff" stroke="#2563eb"/><text x="164" y="334" text-anchor="middle" font-size="21" fill="#1a2e4a">2</text><text x="263" y="257" text-anchor="middle" font-size="20" fill="#1a2e4a">2</text><path d="M263,267L263,301" fill="none" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="242" y="310" width="42" height="35" rx="10" fill="#f0f9ff" stroke="#2563eb"/><text x="263" y="334" text-anchor="middle" font-size="21" fill="#1a2e4a">4</text><text x="362" y="257" text-anchor="middle" font-size="20" fill="#1a2e4a">3</text><path d="M362,267L362,301" fill="none" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="341" y="310" width="42" height="35" rx="10" fill="#f0f9ff" stroke="#2563eb"/><text x="362" y="334" text-anchor="middle" font-size="21" fill="#1a2e4a">0</text><text x="461" y="257" text-anchor="middle" font-size="20" fill="#1a2e4a">4</text><path d="M461,267L461,301" fill="none" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="440" y="310" width="42" height="35" rx="10" fill="#f0f9ff" stroke="#2563eb"/><text x="461" y="334" text-anchor="middle" font-size="21" fill="#1a2e4a">2</text><text x="560" y="257" text-anchor="middle" font-size="20" fill="#1a2e4a">5</text><path d="M560,267L560,301" fill="none" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="539" y="310" width="42" height="35" rx="10" fill="#f0f9ff" stroke="#2563eb"/><text x="560" y="334" text-anchor="middle" font-size="21" fill="#1a2e4a">4</text><text x="380" y="395" text-anchor="middle" font-size="17" fill="#1a2e4a">Times three mod seven permutes; times two mod six repeats.</text></g></svg>