<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 350" role="img" aria-label="Absolute value has left/right slopes minus one/plus one, ReLU zero/one. Their central differences are respectively zero and one-half despite absent two-sided derivatives."><title>One-sided slopes of absolute value and ReLU</title><desc>Absolute value has left/right slopes minus one/plus one, ReLU zero/one. Their central differences are respectively zero and one-half despite absent two-sided derivatives.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#2563eb"/></marker></defs><rect width="760" height="350" fill="white"/><g font-family="system-ui,Segoe UI,Microsoft YaHei,sans-serif"><text x="380" y="30" text-anchor="middle" font-size="22" fill="#1a2e4a">A central average does not prove differentiability at a kink</text><rect x="35" y="65" width="325" height="245" rx="10" fill="#f0f9ff" stroke="#0ea5e9"/><rect x="395" y="65" width="325" height="245" rx="10" fill="#f0f9ff" stroke="#0ea5e9"/><path d="M80,115L195,190L310,115M440,190H555L670,115" stroke="#2563eb" stroke-width="4"/><text x="195" y="100" text-anchor="middle" font-size="22" fill="#1a2e4a">|x|</text><text x="555" y="100" text-anchor="middle" font-size="22" fill="#1a2e4a">ReLU(x)</text><text x="195" y="230" text-anchor="middle" font-size="20" fill="#1a2e4a">Left −1, right +1</text><text x="555" y="230" text-anchor="middle" font-size="20" fill="#1a2e4a">Left 0, right 1</text><text x="195" y="276" text-anchor="middle" font-size="18" fill="#1a2e4a">Central = 0; no derivative</text><text x="555" y="276" text-anchor="middle" font-size="18" fill="#1a2e4a">Central = 0.5; no derivative</text></g></svg>