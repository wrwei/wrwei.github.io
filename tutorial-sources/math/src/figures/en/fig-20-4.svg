<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 350" role="img" aria-label="Exact projection stays feasible at each step; the scalar squared-penalty minimiser 2/(1+weight) remains nonzero at finite weight and violates the original equality."><title>Projection versus finite squared penalty</title><desc>Exact projection stays feasible at each step; the scalar squared-penalty minimiser 2/(1+weight) remains nonzero at finite weight and violates the original equality.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#2563eb"/></marker></defs><rect width="760" height="350" fill="white"/><g font-family="system-ui,Segoe UI,Microsoft YaHei,sans-serif"><text x="380" y="30" text-anchor="middle" font-size="22" fill="#1a2e4a">Projection enforces feasibility; penalties change the objective</text><rect x="35" y="65" width="330" height="220" rx="10" fill="#f0f9ff" stroke="#0ea5e9"/><rect x="395" y="65" width="330" height="220" rx="10" fill="#f0f9ff" stroke="#0ea5e9"/><text x="200" y="109" text-anchor="middle" font-size="23" fill="#1a2e4a">Projection</text><text x="560" y="109" text-anchor="middle" font-size="23" fill="#1a2e4a">Squared penalty</text><text x="200" y="155" text-anchor="middle" font-size="23" fill="#1a2e4a">x⁺=P_C(x−αg)</text><text x="560" y="155" text-anchor="middle" font-size="23" fill="#1a2e4a">fρ=f+ρx²/2</text><text x="200" y="202" text-anchor="middle" font-size="19" fill="#1a2e4a">Exact projection ⇒ x⁺∈C</text><text x="560" y="202" text-anchor="middle" font-size="23" fill="#1a2e4a">xρ=2/(1+ρ)&gt;0</text><text x="200" y="248" text-anchor="middle" font-size="17" fill="#1a2e4a">Boundary raw g can be nonzero</text><text x="560" y="248" text-anchor="middle" font-size="17" fill="#1a2e4a">Original equality x=0 is violated</text><text x="380" y="327" text-anchor="middle" font-size="17" fill="#1a2e4a">Example f=(x−2)²/2 with x=0; every finite squared weight remains infeasible.</text></g></svg>