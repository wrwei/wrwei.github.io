<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 360" role="img" aria-label="Target positions one through four have probabilities one-half, one-quarter, one-eighth, one-eighth; expected comparisons15/8 differ from the uniform2.5."><title>Weighted search cost</title><desc>Target positions one through four have probabilities one-half, one-quarter, one-eighth, one-eighth; expected comparisons15/8 differ from the uniform2.5.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#2563eb"/></marker></defs><rect width="760" height="360" fill="white"/><g font-family="system-ui,Segoe UI,Microsoft YaHei,sans-serif"><text x="380" y="30" text-anchor="middle" font-size="23" fill="#1a2e4a">Average cost depends on the input-position model</text><text x="100" y="99" text-anchor="middle" font-size="22" fill="#1a2e4a">K=1</text><rect x="170" y="73" width="375" height="34" rx="10" fill="#f0f9ff" stroke="#0ea5e9"/><text x="580" y="99" text-anchor="start" font-size="21" fill="#1a2e4a">p=0.5</text><text x="100" y="148" text-anchor="middle" font-size="22" fill="#1a2e4a">K=2</text><rect x="170" y="122" width="187.5" height="34" rx="10" fill="#f0f9ff" stroke="#0ea5e9"/><text x="580" y="148" text-anchor="start" font-size="21" fill="#1a2e4a">p=0.25</text><text x="100" y="197" text-anchor="middle" font-size="22" fill="#1a2e4a">K=3</text><rect x="170" y="171" width="93.75" height="34" rx="10" fill="#f0f9ff" stroke="#0ea5e9"/><text x="580" y="197" text-anchor="start" font-size="21" fill="#1a2e4a">p=0.125</text><text x="100" y="246" text-anchor="middle" font-size="22" fill="#1a2e4a">K=4</text><rect x="170" y="220" width="93.75" height="34" rx="10" fill="#f0f9ff" stroke="#0ea5e9"/><text x="580" y="246" text-anchor="start" font-size="21" fill="#1a2e4a">p=0.125</text><text x="380" y="307" text-anchor="middle" font-size="20" fill="#1a2e4a">E[K]=Σkp(k)=15/8; ΣP(K≥k)=15/8</text><text x="3