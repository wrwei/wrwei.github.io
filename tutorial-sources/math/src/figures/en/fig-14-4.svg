<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 365" role="img" aria-label="Four combinations of first feature ±100 and second ±1 have labels from the second sign. The first direction explains 99.99% but gives opposite labels identical scores. Vertical scale is magnified for visibility."><title>Variance and label distinctions</title><desc>Four combinations of first feature ±100 and second ±1 have labels from the second sign. The first direction explains 99.99% but gives opposite labels identical scores. Vertical scale is magnified for visibility.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#2563eb"/></marker></defs><rect width="760" height="365" fill="white"/><g font-family="system-ui,Segoe UI,Microsoft YaHei,sans-serif"><text x="380" y="30" text-anchor="middle" font-size="22" fill="#1a2e4a">High energy retention need not retain label information</text><path d="M40,170H380M210,80V265" stroke="#94a3b8"/><circle cx="95" cy="125" r="10" fill="#c2410c"/><text x="112" y="131" text-anchor="start" font-size="23" fill="#1a2e4a">+</text><circle cx="95" cy="215" r="10" fill="#2563eb"/><text x="112" y="221" text-anchor="start" font-size="23" fill="#1a2e4a">−</text><circle cx="325" cy="125" r="10" fill="#c2410c"/><text x="342" y="131" text-anchor="start" font-size="23" fill="#1a2e4a">+</text><circle cx="325" cy="215" r="10" fill="#2563eb"/><text x="342" y="221" text-anchor="start" font-size="23" fill="#1a2e4a">−</text><text x="95" y="289" text-anchor="middle" font-size="19" fill="#1a2e4a">x₁=−100</text><text x="325" y="289" text-anchor="middle" font-size="19" fill="#1a2e4a">x₁=100</text><text x="210" y="329" text-anchor="middle" font-size="16" fill="#1a2e4a">Vertical ±1 (magnified for visibility)</text><rect x="435" y="80" width="290" height="230" rx="10" fill="#f0f9ff" stroke="#0ea5e9"/><text x="580" y="123" text-anchor="middle" font-size="20" fill="#1a2e4a">Scatter=diag(40000,4)</text><text x="580" y="170" text-anchor="middle" font-size="24" fill="#1a2e4a">First direction: 99.99%</text><text x="580" y="215" text-anchor="middle" font-size="21" fill="#1a2e4a">Same score, both labels</text><text x="580" y="262" text-anchor="middle" font-size="21" fill="#1a2e4a">Second direction distinguishes</text></g></svg>