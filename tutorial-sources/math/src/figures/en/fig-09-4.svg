<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 355" role="img" aria-label="Subtracting flat [1,2,3] and column [1,2,4] generates nine differences; paired columns yield only [0,0,−1]. Mean squares are 7/3 and 1/3 respectively."><title>Broadcasting changes the pairing problem</title><desc>Subtracting flat [1,2,3] and column [1,2,4] generates nine differences; paired columns yield only [0,0,−1]. Mean squares are 7/3 and 1/3 respectively.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#2563eb"/></marker></defs><rect width="760" height="355" fill="white"/><g font-family="system-ui,Segoe UI,Microsoft YaHei,sans-serif"><text x="380" y="30" text-anchor="middle" font-size="18" fill="#1a2e4a">Predictions (3,) − observations (3,1): all pairwise differences</text><text x="225" y="70" text-anchor="middle" font-size="22" fill="#1a2e4a">Wrong broadcast (3,3)</text><text x="605" y="70" text-anchor="middle" font-size="22" fill="#1a2e4a">Repaired pairs (3,1)</text><rect x="110" y="100" width="65" height="48" rx="10" fill="#f0f9ff" stroke="#0ea5e9"/><text x="142" y="132" text-anchor="middle" font-size="24" fill="#1a2e4a">0</text><rect x="190" y="100" width="65" height="48" rx="10" fill="#f0f9ff" stroke="#0ea5e9"/><text x="222" y="132" text-anchor="middle" font-size="24" fill="#1a2e4a">1</text><rect x="270" y="100" width="65" height="48" rx="10" fill="#f0f9ff" stroke="#0ea5e9"/><text x="302" y="132" text-anchor="middle" font-size="24" fill="#1a2e4a">2</text><rect x="573" y="100" width="65" height="48" rx="10" fill="#f0fdf4" stroke="#15803d"/><text x="605" y="132" text-anchor="middle" font-size="24" fill="#1a2e4a">0</text><rect x="110" y="165" width="65" height="48" rx="10" fill="#f0f9ff" stroke="#0ea5e9"/><text x="142" y="197" text-anchor="middle" font-size="24" fill="#1a2e4a">-1</text><rect x="190" y="165" width="65" height="48" rx="10" fill="#f0f9ff" stroke="#0ea5e9"/><text x="222" y="197" text-anchor="middle" font-size="24" fill="#1a2e4a">0</text><rect x="270" y="165" width="65" height="48" rx="10" fill="#f0f9ff" stroke="#0ea5e9"/><text x="302" y="197" text-anchor="middle" font-size="24" fill="#1a2e4a">1</text><rect x="573" y="165" width="65" height="48" rx="10" fill="#f0fdf4" stroke="#15803d"/><text x="605" y="197" text-anchor="middle" font-size="24" fill="#1a2e4a">0</text><rect x="110" y="230" width="65" height="48" rx="10" fill="#f0f9ff" stroke="#0ea5e9"/><text x="142" y="262" text-anchor="middle" font-size="24" fill="#1a2e4a">-3</text><rect x="190" y="230" width="65" height="48" rx="10" fill="#f0f9ff" stroke="#0ea5e9"/><text x="222" y="262" text-anchor="middle" font-size="24" fill="#1a2e4a">-2</text><rect x="270" y="230" width="65" height="48" rx="10" fill="#f0f9ff" stroke="#0ea5e9"/><text x="302" y="262" text-anchor="middle" font-size="24" fill="#1a2e4a">-1</text><rect x="573" y="230" width="65" height="48" rx="10" fill="#f0fdf4" stroke="#15803d"/><text x="605" y="262" text-anchor="middle" font-size="24" fill="#1a2e4a">-1</text><text x="225" y="325" text-anchor="middle" font-size="18" fill="#1a2e4a">Nine squared entries: mean 7/3</text><text x="605" y="325" text-anchor="middle" font-size="17" fill="#1a2e4a">Three squared entries: mean 1/3</text></g></svg>