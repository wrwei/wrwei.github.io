<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 360" role="img" aria-label="Full V transpose changes input basis, rectangular Sigma scales nonnegative strengths, and U changes output basis. Positive directions span row/column spaces; unused directions give kernels."><title>Three stages of an SVD</title><desc>Full V transpose changes input basis, rectangular Sigma scales nonnegative strengths, and U changes output basis. Positive directions span row/column spaces; unused directions give kernels.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#2563eb"/></marker></defs><rect width="760" height="360" fill="white"/><g font-family="system-ui,Segoe UI,Microsoft YaHei,sans-serif"><text x="380" y="30" text-anchor="middle" font-size="19" fill="#1a2e4a">Rectangular map: input basis → scaling and lost directions → output basis</text><rect x="20" y="95" width="190" height="130" rx="10" fill="#f0f9ff" stroke="#0ea5e9"/><text x="115" y="145" text-anchor="middle" font-size="30" fill="#1a2e4a">Vᵀ</text><text x="115" y="197" text-anchor="middle" font-size="23" fill="#1a2e4a">n × n</text><rect x="280" y="95" width="200" height="130" rx="10" fill="#f0f9ff" stroke="#0ea5e9"/><text x="380" y="145" text-anchor="middle" font-size="30" fill="#1a2e4a">Σ</text><text x="380" y="197" text-anchor="middle" font-size="23" fill="#1a2e4a">m × n</text><rect x="550" y="95" width="190" height="130" rx="10" fill="#f0f9ff" stroke="#0ea5e9"/><text x="645" y="145" text-anchor="middle" font-size="30" fill="#1a2e4a">U</text><text x="645" y="197" text-anchor="middle" font-size="23" fill="#1a2e4a">m × m</text><path d="M220,158L270,158" fill="none" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M490,158L540,158" fill="none" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arrow)"/><text x="380" y="281" text-anchor="middle" font-size="27" fill="#1a2e4a">Avᵢ=σᵢuᵢ;     Aᵀuᵢ=σᵢvᵢ</text><text x="380" y="329" text-anchor="middle" font-size="18" fill="#1a2e4a">Positive directions: row ↔ column; unused directions: null and left null.</text></g></svg>