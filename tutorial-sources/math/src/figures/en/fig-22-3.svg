<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 350" role="img" aria-label="Stretching a unit uniform doubles width and halves density; squaring a symmetric uniform requires both square-root branches."><title>Density transforms need factors and both branches</title><desc>Stretching a unit uniform doubles width and halves density; squaring a symmetric uniform requires both square-root branches.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#2563eb"/></marker></defs><rect width="760" height="350" fill="white"/><g font-family="system-ui,Segoe UI,Microsoft YaHei,sans-serif"><text x="380" y="30" text-anchor="middle" font-size="24" fill="#1a2e4a">Coordinate stretch and multiple inverse branches</text><rect x="35" y="65" width="330" height="220" rx="10" fill="#f0f9ff" stroke="#0ea5e9"/><rect x="395" y="65" width="330" height="220" rx="10" fill="#f0f9ff" stroke="#0ea5e9"/><text x="200" y="106" text-anchor="middle" font-size="21" fill="#1a2e4a">X∼Uniform(0,1)</text><text x="200" y="155" text-anchor="middle" font-size="24" fill="#1a2e4a">Y=2X</text><text x="200" y="203" text-anchor="middle" font-size="22" fill="#1a2e4a">fY=1/2 on(0,2)</text><text x="200" y="248" text-anchor="middle" font-size="20" fill="#1a2e4a">Width×2, height÷2</text><text x="560" y="106" text-anchor="middle" font-size="20" fill="#1a2e4a">X∼Uniform(−1,1)</text><text x="560" y="155" text-anchor="middle" font-size="24" fill="#1a2e4a">Y=X²</text><text x="560" y="203" text-anchor="middle" font-size="22" fill="#1a2e4a">x=+√y and −√y</text><text x="560" y="248" text-anchor="middle" font-size="20" fill="#1a2e4a">fY=1/(2√y), 0&lt;y&lt;1</text><text x="380" y="329" text-anchor="middle" font-size="18" fill="#1a2e4a">Each inverse branch contributes1/(4√y); total mass1, no atom at0.</text></g></svg>