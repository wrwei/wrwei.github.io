<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 340" role="img" aria-label="A tree with edges AB, AC, CD, CE loses leaf E and edge CE, leaving four vertices and three edges, still connected and acyclic."><title>Induction by leaf deletion</title><desc>A tree with edges AB, AC, CD, CE loses leaf E and edge CE, leaving four vertices and three edges, still connected and acyclic.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#2563eb"/></marker></defs><rect width="760" height="340" fill="white"/><g font-family="system-ui,Segoe UI,Microsoft YaHei,sans-serif"><text x="190" y="30" text-anchor="middle" font-size="19" fill="#1a2e4a">Five vertices, four edges</text><text x="570" y="30" text-anchor="middle" font-size="19" fill="#1a2e4a">Remove E: four vertices, three edges</text><path d="M75,110L175,70" stroke="#2563eb" stroke-width="3"/><path d="M75,110L175,180" stroke="#2563eb" stroke-width="3"/><path d="M175,180L275,145" stroke="#2563eb" stroke-width="3"/><path d="M175,180L275,240" stroke="#2563eb" stroke-width="3"/><circle cx="75" cy="110" r="17" fill="#f0f9ff" stroke="#2563eb"/><text x="75" y="116" text-anchor="middle" font-size="18" fill="#1a2e4a">A</text><circle cx="175" cy="70" r="17" fill="#f0f9ff" stroke="#2563eb"/><text x="175" y="76" text-anchor="middle" font-size="18" fill="#1a2e4a">B</text><circle cx="175" cy="180" r="17" fill="#f0f9ff" stroke="#2563eb"/><text x="175" y="186" text-anchor="middle" font-size="18" fill="#1a2e4a">C</text><circle cx="275" cy="145" r="17" fill="#f0f9ff" stroke="#2563eb"/><text x="275" y="151" text-anchor="middle" font-size="18" fill="#1a2e4a">D</text><circle cx="275" cy="240" r="17" fill="#fff7ed" stroke="#2563eb"/><text x="275" y="246" text-anchor="middle" font-size="18" fill="#1a2e4a">E</text><path d="M455,110L555,70" stroke="#2563eb" stroke-width="3"/><path d="M455,110L555,180" stroke="#2563eb" stroke-width="3"/><path d="M555,180L655,145" stroke="#2563eb" stroke-width="3"/><circle cx="455" cy="110" r="17" fill="#f0f9ff" stroke="#2563eb"/><text x="455" y="116" text-anchor="middle" font-size="18" fill="#1a2e4a">A</text><circle cx="555" cy="70" r="17" fill="#f0f9ff" stroke="#2563eb"/><text x="555" y="76" text-anchor="middle" font-size="18" fill="#1a2e4a">B</text><circle cx="555" cy="180" r="17" fill="#f0f9ff" stroke="#2563eb"/><text x="555" y="186" text-anchor="middle" font-size="18" fill="#1a2e4a">C</text><circle cx="655" cy="145" r="17" fill="#f0f9ff" stroke="#2563eb"/><text x="655" y="151" text-anchor="middle" font-size="18" fill="#1a2e4a">D</text><text x="380" y="309" text-anchor="middle" font-size="17" fill="#1a2e4a">Remaining paths survive; base case: one vertex, zero edges.</text></g></svg>