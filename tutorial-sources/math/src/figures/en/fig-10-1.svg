<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 340" role="img" aria-label="Matrix [[2,1],[0,1]] sends e₁ to (2,0), e₂ to (1,1); input coordinates weight these column images."><title>Column images of a matrix</title><desc>Matrix [[2,1],[0,1]] sends e₁ to (2,0), e₂ to (1,1); input coordinates weight these column images.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#2563eb"/></marker></defs><rect width="760" height="340" fill="white"/><g font-family="system-ui,Segoe UI,Microsoft YaHei,sans-serif"><text x="380" y="30" text-anchor="middle" font-size="21" fill="#1a2e4a">Columns are images of coordinate unit vectors</text><rect x="30" y="70" width="310" height="230" rx="10" fill="#f0f9ff" stroke="#0ea5e9"/><text x="185" y="108" text-anchor="middle" font-size="23" fill="#1a2e4a">A = [[2,1],[0,1]]</text><text x="185" y="157" text-anchor="middle" font-size="23" fill="#15803d">Ae₁ = (2,0)</text><text x="185" y="207" text-anchor="middle" font-size="23" fill="#c2410c">Ae₂ = (1,1)</text><text x="185" y="263" text-anchor="middle" font-size="20" fill="#1a2e4a">Ax = x₁Ae₁ + x₂Ae₂</text><path d="M425,255H700M455,280V65" stroke="#94a3b8"/><path d="M455,255L625,255" fill="none" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M455,255L540,170" fill="none" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arrow)"/><text x="625" y="286" text-anchor="middle" font-size="21" fill="#15803d">Ae₁</text><text x="545" y="148" text-anchor="middle" font-size="21" fill="#c2410c">Ae₂</text><text x="440" y="276" text-anchor="start" font-size="18" fill="#1a2e4a">0</text></g></svg>