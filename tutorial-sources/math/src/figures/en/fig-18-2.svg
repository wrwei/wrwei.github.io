<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 360" role="img" aria-label="An m-by-n Jacobian maps n input tangents to m outputs; its transpose maps m output seeds to n input adjoints."><title>Forward JVP and reverse VJP shapes</title><desc>An m-by-n Jacobian maps n input tangents to m outputs; its transpose maps m output seeds to n input adjoints.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#2563eb"/></marker></defs><rect width="760" height="360" fill="white"/><g font-family="system-ui,Segoe UI,Microsoft YaHei,sans-serif"><text x="380" y="30" text-anchor="middle" font-size="24" fill="#1a2e4a">Two propagation directions through one local linear map</text><rect x="45" y="70" width="260" height="85" rx="10" fill="#f0f9ff" stroke="#0ea5e9"/><rect x="455" y="70" width="260" height="85" rx="10" fill="#f0f9ff" stroke="#0ea5e9"/><text x="175" y="120" text-anchor="middle" font-size="21" fill="#1a2e4a">Input tangent v ∈ Rⁿ</text><text x="585" y="120" text-anchor="middle" font-size="20" fill="#1a2e4a">Output tangent Jv ∈ Rᵐ</text><path d="M305,112L455,112" fill="none" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arrow)"/><text x="380" y="95" text-anchor="middle" font-size="20" fill="#1a2e4a">J: m×n</text><rect x="45" y="205" width="260" height="85" rx="10" fill="#dcfce7" stroke="#15803d"/><rect x="455" y="205" width="260" height="85" rx="10" fill="#dcfce7" stroke="#15803d"/><text x="175" y="255" text-anchor="middle" font-size="19" fill="#1a2e4a">Input adjoint Jᵀq ∈ Rⁿ</text><text x="585" y="255" text-anchor="middle" font-size="20" fill="#1a2e4a">Output seed q ∈ Rᵐ</text><path d="M455,247L305,247" fill="none" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arrow)"/><text x="380" y="230" text-anchor="middle" font-size="20" fill="#1a2e4a">Jᵀ: n×m</text><text x="380" y="335" text-anchor="middle" font-size="17" fill="#1a2e4a">Column convention: df=∇fᵀdx; outputs in rows, inputs in columns.</text></g></svg>