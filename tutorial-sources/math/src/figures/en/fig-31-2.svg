<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 350" role="img" aria-label="Ready indegree proves precedence, earliest-finish induction uses unlimited workers, and maximum-parent tracing certifies a path attaining makespan."><title>Order and finish proof chain</title><desc>Ready indegree proves precedence, earliest-finish induction uses unlimited workers, and maximum-parent tracing certifies a path attaining makespan.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#2563eb"/></marker></defs><rect width="760" height="350" fill="white"/><g font-family="system-ui,Segoe UI,Microsoft YaHei,sans-serif"><text x="380" y="30" text-anchor="middle" font-size="23" fill="#1a2e4a">Two proofs and a certificate</text><rect x="35" y="70" width="690" height="63" rx="10" fill="#f0f9ff" stroke="#0ea5e9"/><text x="380" y="109" text-anchor="middle" font-size="21" fill="#1a2e4a">Remaining indegree=0 ⇒ all predecessors emitted</text><rect x="35" y="160" width="690" height="63" rx="10" fill="#f0f9ff" stroke="#0ea5e9"/><text x="380" y="199" text-anchor="middle" font-size="21" fill="#1a2e4a">F(v)=d(v)+max predecessor finish</text><rect x="35" y="250" width="690" height="63" rx="10" fill="#f0f9ff" stroke="#0ea5e9"/><text x="380" y="289" text-anchor="middle" font-size="21" fill="#1a2e4a">Trace maximum predecessors ⇒ path sum=T</text></g></svg>