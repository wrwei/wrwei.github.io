<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 340" role="img" aria-label="The domain {0,1,2,3,4,5} is partitioned into disjoint nonempty even and odd blocks."><title>Parity equivalence classes</title><desc>The domain {0,1,2,3,4,5} is partitioned into disjoint nonempty even and odd blocks.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#2563eb"/></marker></defs><rect width="760" height="340" fill="white"/><g font-family="system-ui,Segoe UI,Microsoft YaHei,sans-serif"><rect x="35" y="35" width="310" height="210" rx="10" fill="#f0fdf4" stroke="#15803d"/><text x="190" y="77" text-anchor="middle" font-size="21" fill="#1a2e4a">Even class [0]</text><text x="190" y="150" text-anchor="middle" font-size="29" fill="#1a2e4a">0, 2, 4</text><rect x="415" y="35" width="310" height="210" rx="10" fill="#faf5ff" stroke="#7e22ce"/><text x="570" y="77" text-anchor="middle" font-size="21" fill="#1a2e4a">Odd class [1]</text><text x="570" y="150" text-anchor="middle" font-size="29" fill="#1a2e4a">1, 3, 5</text><text x="380" y="295" text-anchor="middle" font-size="18" fill="#1a2e4a">The quotient has the two blocks as elements</text></g></svg>