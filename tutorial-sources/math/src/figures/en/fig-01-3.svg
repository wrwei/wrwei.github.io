<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 340" role="img" aria-label="Starting at 3, square then double and add one to obtain 19; reversing the rules obtains 49."><title id="title">Two composition orders</title><desc id="desc">Starting at 3, square then double and add one to obtain 19; reversing the rules obtains 49.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker></defs><rect width="760" height="340" fill="white"/><g font-family="system-ui,Segoe UI,Microsoft YaHei,sans-serif"><text x="35" y="38" text-anchor="start" font-size="18" fill="#1a2e4a">g first, then f: f(g(3))</text><text x="35" y="195" text-anchor="start" font-size="18" fill="#1a2e4a">f first, then g: g(f(3))</text><rect x="35" y="70" width="100" height="70" rx="12" fill="#f0f9ff" stroke="#0ea5e9"/><text x="85" y="113" text-anchor="middle" font-size="24" fill="#1a2e4a">3</text><path d="M140,105 L245,105" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arrow)"/><text x="190" y="62" text-anchor="middle" font-size="15" fill="#1a2e4a">g(t) = t²</text><rect x="250" y="70" width="100" height="70" rx="12" fill="#f0f9ff" stroke="#0ea5e9"/><text x="300" y="113" text-anchor="middle" font-size="24" fill="#1a2e4a">9</text><path d="M355,105 L515,105" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arrow)"/><text x="435" y="62" text-anchor="middle" font-size="15" fill="#1a2e4a">f(t) = 2t+1</text><rect x="520" y="70" width="180" height="70" rx="12" fill="#f0fdf4" stroke="#15803d"/><text x="610" y="113" text-anchor="middle" font-size="24" fill="#1a2e4a">19</text><rect x="35" y="225" width="100" height="70" rx="12" fill="#f0f9ff" stroke="#0ea5e9"/><text x="85" y="268" text-anchor="middle" font-size="24" fill="#1a2e4a">3</text><path d="M140,260 L245,260" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arrow)"/><text x="190" y="217" text-anchor="middle" font-size="15" fill="#1a2e4a">f(t) = 2t+1</text><rect x="250" y="225" width="100" height="70" rx="12" fill="#f0f9ff" stroke="#0ea5e9"/><text x="300" y="268" text-anchor="middle" font-size="24" fill="#1a2e4a">7</text><path d="M355,260 L515,260" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arrow)"/><text x="435" y="217" text-anchor="middle" font-size="15" fill="#1a2e4a">g(t) = t²</text><rect x="520" y="225" width="180" height="70" rx="12" fill="#f0fdf4" stroke="#15803d"/><text x="610" y="268" text-anchor="middle" font-size="24" fill="#1a2e4a">49</text></g></svg>