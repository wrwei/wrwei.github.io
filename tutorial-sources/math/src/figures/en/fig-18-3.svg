<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 355" role="img" aria-label="For x²y+exp(y) at (0.7,-0.4), the gradient is (-0.56,1.16032) and the Hessian has mixed entries 1.4, recording coordinate coupling."><title>Gradient and coupled Hessian</title><desc>For x²y+exp(y) at (0.7,-0.4), the gradient is (-0.56,1.16032) and the Hessian has mixed entries 1.4, recording coordinate coupling.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#2563eb"/></marker></defs><rect width="760" height="355" fill="white"/><g font-family="system-ui,Segoe UI,Microsoft YaHei,sans-serif"><text x="380" y="30" text-anchor="middle" font-size="23" fill="#1a2e4a">First-order coefficients and second-order coupling differ</text><rect x="35" y="75" width="245" height="220" rx="10" fill="#f0f9ff" stroke="#0ea5e9"/><rect x="310" y="75" width="415" height="220" rx="10" fill="#f0f9ff" stroke="#0ea5e9"/><text x="158" y="112" text-anchor="middle" font-size="24" fill="#1a2e4a">∇f: 2×1</text><text x="158" y="171" text-anchor="middle" font-size="27" fill="#1a2e4a">−0.56</text><text x="158" y="226" text-anchor="middle" font-size="27" fill="#1a2e4a">1.16032</text><text x="518" y="112" text-anchor="middle" font-size="24" fill="#1a2e4a">H: 2×2</text><text x="428" y="174" text-anchor="middle" font-size="27" fill="#1a2e4a">−0.8</text><text x="620" y="174" text-anchor="middle" font-size="27" fill="#c2410c">1.4</text><text x="428" y="230" text-anchor="middle" font-size="27" fill="#c2410c">1.4</text><text x="620" y="230" text-anchor="middle" font-size="27" fill="#1a2e4a">0.67032</text><text x="380" y="333" text-anchor="middle" font-size="21" fill="#1a2e4a">f=x²y+exp(y); a=(0.7,−0.4)</text></g></svg>