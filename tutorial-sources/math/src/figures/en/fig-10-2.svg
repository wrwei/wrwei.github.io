<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 360" role="img" aria-label="At (1,1), shear then scaling gives (4,1), scaling then shear gives (3,1). SH and HS differ."><title>Shear and scaling composition order</title><desc>At (1,1), shear then scaling gives (4,1), scaling then shear gives (3,1). SH and HS differ.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#2563eb"/></marker></defs><rect width="760" height="360" fill="white"/><g font-family="system-ui,Segoe UI,Microsoft YaHei,sans-serif"><text x="380" y="30" text-anchor="middle" font-size="20" fill="#1a2e4a">The right factor acts first: two orders give different results</text><rect x="25" y="75" width="180" height="70" rx="10" fill="#f0f9ff" stroke="#0ea5e9"/><text x="115" y="117" text-anchor="middle" font-size="25" fill="#1a2e4a">(1,1)</text><path d="M215,110L270,110" fill="none" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="280" y="75" width="210" height="70" rx="10" fill="#f0f9ff" stroke="#0ea5e9"/><text x="385" y="117" text-anchor="middle" font-size="23" fill="#1a2e4a">H → (2,1)</text><path d="M500,110L545,110" fill="none" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="555" y="75" width="180" height="70" rx="10" fill="#f0f9ff" stroke="#0ea5e9"/><text x="645" y="117" text-anchor="middle" font-size="23" fill="#1a2e4a">S → (4,1)</text><rect x="25" y="205" width="180" height="70" rx="10" fill="#f0f9ff" stroke="#0ea5e9"/><text x="115" y="247" text-anchor="middle" font-size="25" fill="#1a2e4a">(1,1)</text><path d="M215,240L270,240" fill="none" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="280" y="205" width="210" height="70" rx="10" fill="#f0f9ff" stroke="#0ea5e9"/><text x="385" y="247" text-anchor="middle" font-size="23" fill="#1a2e4a">S → (2,1)</text><path d="M500,240L545,240" fill="none" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="555" y="205" width="180" height="70" rx="10" fill="#f0f9ff" stroke="#0ea5e9"/><text x="645" y="247" text-anchor="middle" font-size="23" fill="#1a2e4a">H → (3,1)</text><text x="380" y="328" text-anchor="middle" font-size="22" fill="#1a2e4a">S = [[2,0],[0,1]]     H = [[1,1],[0,1]]</text></g></svg>