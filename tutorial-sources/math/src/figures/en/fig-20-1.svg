<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 350" role="img" aria-label="The two-coordinate box is the unit square, the simplex is the sum-one segment; input (1.2,0.4) projects to (1,0.4) and (0.9,0.1) respectively."><title>Box and simplex projection</title><desc>The two-coordinate box is the unit square, the simplex is the sum-one segment; input (1.2,0.4) projects to (1,0.4) and (0.9,0.1) respectively.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#2563eb"/></marker></defs><rect width="760" height="350" fill="white"/><g font-family="system-ui,Segoe UI,Microsoft YaHei,sans-serif"><text x="380" y="30" text-anchor="middle" font-size="23" fill="#1a2e4a">The feasible set determines the nearest point</text><rect x="130" y="135" width="230" height="150" fill="#f0f9ff" stroke="#0ea5e9"/><path d="M130,135L360,285" stroke="#15803d" stroke-width="5"/><circle cx="406" cy="225" r="6" fill="#1a2e4a"/><circle cx="360" cy="225" r="6" fill="#2563eb"/><circle cx="337" cy="270" r="6" fill="#15803d"/><text x="445" y="92" text-anchor="start" font-size="20" fill="#1a2e4a">2D input (1.2,.4)</text><text x="445" y="139" text-anchor="start" font-size="20" fill="#1a2e4a">Box: (1,.4)</text><text x="445" y="186" text-anchor="start" font-size="20" fill="#1a2e4a">Segment: (.9,.1)</text><text x="445" y="233" text-anchor="start" font-size="20" fill="#1a2e4a">x+y=1; x,y≥0</text><text x="380" y="327" text-anchor="middle" font-size="18" fill="#1a2e4a">The square and green segment differ; feasible need not mean nearest.</text></g></svg>