<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 360" role="img" aria-label="A succeeds more often within both difficulty groups but less often in its original pooled sample because group weights differ; a common half-and-half mixture gives A0.6 versus B0.5."><title>Selection mixtures and Simpson reversal</title><desc>A succeeds more often within both difficulty groups but less often in its original pooled sample because group weights differ; a common half-and-half mixture gives A0.6 versus B0.5.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#2563eb"/></marker></defs><rect width="760" height="360" fill="white"/><g font-family="system-ui,Segoe UI,Microsoft YaHei,sans-serif"><text x="380" y="30" text-anchor="middle" font-size="24" fill="#1a2e4a">Different mixtures can reverse a pooled comparison</text><text x="175" y="101" text-anchor="end" font-size="18" fill="#1a2e4a">Easy</text><rect x="205" y="79" width="360" height="16" rx="10" fill="#dbeafe" stroke="#2563eb"/><rect x="205" y="100" width="320" height="16" rx="10" fill="#fff7ed" stroke="#c2410c"/><text x="640" y="93" text-anchor="start" font-size="17" fill="#1a2e4a">0.900</text><text x="640" y="114" text-anchor="start" font-size="17" fill="#1a2e4a">0.800</text><text x="175" y="157" text-anchor="end" font-size="18" fill="#1a2e4a">Hard</text><rect x="205" y="135" width="120" height="16" rx="10" fill="#dbeafe" stroke="#2563eb"/><rect x="205" y="156" width="80" height="16" rx="10" fill="#fff7ed" stroke="#c2410c"/><text x="640" y="149" text-anchor="start" font-size="17" fill="#1a2e4a">0.300</text><text x="640" y="170" text-anchor="start" font-size="17" fill="#1a2e4a">0.200</text><text x="175" y="213" text-anchor="end" font-size="18" fill="#1a2e4a">Original pooled</text><rect x="205" y="191" width="141.8181818181818" height="16" rx="10" fill="#dbeafe" stroke="#2563eb"/><rect x="205" y="212" width="298.1818181818182" height="16" rx="10" fill="#fff7ed" stroke="#c2410c"/><text x="640" y="205" text-anchor="start" font-size="17" fill="#1a2e4a">0.355</text><text x="640" y="226" text-anchor="start" font-size="17" fill="#1a2e4a">0.745</text><text x="175" y="269" text-anchor="end" font-size="18" fill="#1a2e4a">Common half mixture</text><rect x="205" y="247" width="240" height="16" rx="10" fill="#dbeafe" stroke="#2563eb"/><rect x="205" y="268" width="200" height="16" rx="10" fill="#fff7ed" stroke="#c2410c"/><text x="640" y="261" text-anchor="start" font-size="17" fill="#1a2e4a">0.600</text><text x="640" y="282" text-anchor="start" font-size="17" fill="#1a2e4a">0.500</text><text x="380" y="334" text-anchor="middle" font-size="18" fill="#1a2e4a">Blue A, orange B; A has more hard records, B more easy records.</text></g></svg>