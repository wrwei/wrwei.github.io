<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 340" role="img" aria-label="Empty-list base has length zero. The head-tail constructor uses the smaller-tail hypothesis and adds one."><title>List structural induction</title><desc>Empty-list base has length zero. The head-tail constructor uses the smaller-tail hypothesis and adds one.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#2563eb"/></marker></defs><rect width="760" height="340" fill="white"/><g font-family="system-ui,Segoe UI,Microsoft YaHei,sans-serif"><rect x="35" y="45" width="205" height="190" rx="10" fill="#f0f9ff" stroke="#0ea5e9"/><text x="137" y="84" text-anchor="middle" font-size="20" fill="#1a2e4a">Base: empty list</text><text x="137" y="144" text-anchor="middle" font-size="30" fill="#1a2e4a">[]</text><text x="137" y="196" text-anchor="middle" font-size="18" fill="#1a2e4a">length = 0</text><rect x="335" y="45" width="390" height="190" rx="10" fill="#f0f9ff" stroke="#0ea5e9"/><text x="530" y="84" text-anchor="middle" font-size="19" fill="#1a2e4a">Constructor: head and smaller tail</text><text x="530" y="135" text-anchor="middle" font-size="29" fill="#1a2e4a">h :: t</text><text x="530" y="179" text-anchor="middle" font-size="18" fill="#1a2e4a">Induction hypothesis on t</text><text x="530" y="213" text-anchor="middle" font-size="18" fill="#1a2e4a">length = 1 + length(t)</text><path d="M245,140L325,140" fill="none" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arrow)"/><text x="380" y="294" text-anchor="middle" font-size="18" fill="#1a2e4a">Prove the constructor preserves the property</text></g></svg>