<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 370" role="img" aria-label="Exact delta 10⁻¹² is nonzero and rank is two; the lab numerical cutoffs 10⁻¹⁴ and 10⁻¹⁰ give effective ranks two and one."><title>Exact rank and numerical resolution</title><desc>Exact delta 10⁻¹² is nonzero and rank is two; the lab numerical cutoffs 10⁻¹⁴ and 10⁻¹⁰ give effective ranks two and one.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#2563eb"/></marker></defs><rect width="760" height="370" fill="white"/><g font-family="system-ui,Segoe UI,Microsoft YaHei,sans-serif"><text x="380" y="30" text-anchor="middle" font-size="21" fill="#1a2e4a">A nonzero difference and a resolution cutoff are two claims</text><rect x="35" y="75" width="330" height="225" rx="10" fill="#f0f9ff" stroke="#0ea5e9"/><rect x="395" y="75" width="330" height="225" rx="10" fill="#fff7ed" stroke="#c2410c"/><text x="200" y="115" text-anchor="middle" font-size="22" fill="#1a2e4a">Exact rational model</text><text x="200" y="167" text-anchor="middle" font-size="21" fill="#1a2e4a">A = [[1,1],[1,1+δ]]</text><text x="200" y="216" text-anchor="middle" font-size="25" fill="#1a2e4a">δ = 10⁻¹² ≠ 0</text><text x="200" y="268" text-anchor="middle" font-size="23" fill="#1a2e4a">detA = δ; rank two</text><text x="560" y="115" text-anchor="middle" font-size="21" fill="#1a2e4a">Floating-point resolution policy</text><text x="560" y="167" text-anchor="middle" font-size="18" fill="#1a2e4a">tol 10⁻¹⁴ → numerical rank two</text><text x="560" y="218" text-anchor="middle" font-size="18" fill="#1a2e4a">tol 10⁻¹⁰ → numerical rank one</text><text x="560" y="268" text-anchor="middle" font-size="21" fill="#1a2e4a">Record scale and dtype</text><text x="380" y="342" text-anchor="middle" font-size="20" fill="#1a2e4a">Threshold decisions do not turn exact nonzero quantities into zero.</text></g></svg>