<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 350" role="img" aria-label="The four outcomes HH, HT, TH, TT have masses one, two, three and four tenths; unequal bar lengths display the weighting."><title>Finite weighted probability model</title><desc>The four outcomes HH, HT, TH, TT have masses one, two, three and four tenths; unequal bar lengths display the weighting.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#2563eb"/></marker></defs><rect width="760" height="350" fill="white"/><g font-family="system-ui,Segoe UI,Microsoft YaHei,sans-serif"><text x="380" y="30" text-anchor="middle" font-size="24" fill="#1a2e4a">Four labels need not have equal probabilities</text><text x="90" y="95" text-anchor="middle" font-size="23" fill="#1a2e4a">HH</text><rect x="140" y="68" width="110" height="36" rx="10" fill="#dbeafe" stroke="#2563eb"/><text x="285" y="95" text-anchor="start" font-size="22" fill="#1a2e4a">1/10</text><text x="90" y="147" text-anchor="middle" font-size="23" fill="#1a2e4a">HT</text><rect x="140" y="120" width="220" height="36" rx="10" fill="#dbeafe" stroke="#2563eb"/><text x="395" y="147" text-anchor="start" font-size="22" fill="#1a2e4a">2/10</text><text x="90" y="199" text-anchor="middle" font-size="23" fill="#1a2e4a">TH</text><rect x="140" y="172" width="330" height="36" rx="10" fill="#dbeafe" stroke="#2563eb"/><text x="505" y="199" text-anchor="start" font-size="22" fill="#1a2e4a">3/10</text><text x="90" y="251" text-anchor="middle" font-size="23" fill="#1a2e4a">TT</text><rect x="140" y="224" width="440" height="36" rx="10" fill="#dbeafe" stroke="#2563eb"/><text x="615" y="251" text-anchor="start" font-size="22" fill="#1a2e4a">4/10</text><text x="380" y="324" text-anchor="middle" font-size="20" fill="#1a2e4a">P(first H)=3/10; P(second H)=4/10; intersection=1/10.</text></g></svg>