<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 350" role="img" aria-label="Four equally likely outcomes map to zero, one, two; two preimages combine into the half-probability count one."><title>Two-coin outcomes to head count</title><desc>Four equally likely outcomes map to zero, one, two; two preimages combine into the half-probability count one.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#2563eb"/></marker></defs><rect width="760" height="350" fill="white"/><g font-family="system-ui,Segoe UI,Microsoft YaHei,sans-serif"><text x="380" y="30" text-anchor="middle" font-size="24" fill="#1a2e4a">A random variable combines preimages</text><rect x="55" y="60" width="145" height="39" rx="10" fill="#f0f9ff" stroke="#0ea5e9"/><text x="125" y="87" text-anchor="middle" font-size="20" fill="#1a2e4a">TT : 1/4</text><rect x="55" y="109" width="145" height="39" rx="10" fill="#f0f9ff" stroke="#0ea5e9"/><text x="125" y="136" text-anchor="middle" font-size="20" fill="#1a2e4a">HT : 1/4</text><rect x="55" y="158" width="145" height="39" rx="10" fill="#f0f9ff" stroke="#0ea5e9"/><text x="125" y="185" text-anchor="middle" font-size="20" fill="#1a2e4a">TH : 1/4</text><rect x="55" y="207" width="145" height="39" rx="10" fill="#f0f9ff" stroke="#0ea5e9"/><text x="125" y="234" text-anchor="middle" font-size="20" fill="#1a2e4a">HH : 1/4</text><rect x="475" y="55" width="215" height="48" rx="10" fill="#f0f9ff" stroke="#0ea5e9"/><text x="582" y="86" text-anchor="middle" font-size="22" fill="#1a2e4a">X=0; p=1/4</text><rect x="475" y="150" width="215" height="48" rx="10" fill="#f0f9ff" stroke="#0ea5e9"/><text x="582" y="181" text-anchor="middle" font-size="22" fill="#1a2e4a">X=1; p=1/2</text><rect x="475" y="245" width="215" height="48" rx="10" fill="#f0f9ff" stroke="#0ea5e9"/><text x="582" y="276" text-anchor="middle" font-size="22" fill="#1a2e4a">X=2; p=1/4</text><path d="M210,80L465,80" fill="none" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M210,129L465,173" fill="none" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M210,178L465,173" fill="none" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M210,227L465,269" fill="none" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arrow)"/><text x="380" y="329" text-anchor="middle" font-size="20" fill="#1a2e4a">Count1 collects HT and TH; F(1)=3/4, F(1−)=1/4.</text></g></svg>