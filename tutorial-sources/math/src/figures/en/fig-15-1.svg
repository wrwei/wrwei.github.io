<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 350" role="img" aria-label="Every reciprocal-sequence term from index six has error below 0.2. Alternating plus/minus one repeatedly visits separated values."><title>Tail band and alternating counterexample</title><desc>Every reciprocal-sequence term from index six has error below 0.2. Alternating plus/minus one repeatedly visits separated values.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#2563eb"/></marker></defs><rect width="760" height="350" fill="white"/><g font-family="system-ui,Segoe UI,Microsoft YaHei,sans-serif"><text x="380" y="30" text-anchor="middle" font-size="24" fill="#1a2e4a">Control a whole tail, rather than one sample</text><rect x="55" y="185" width="290" height="40" fill="#dcfce7"/><path d="M55,205H345M410,160H705" stroke="#94a3b8"/><text x="70" y="248" text-anchor="start" font-size="16" fill="#1a2e4a">ε = 0.2</text><text x="470" y="282" text-anchor="start" font-size="18" fill="#1a2e4a">Bounded, still divergent</text><circle cx="72" cy="105" r="4" fill="#2563eb"/><circle cx="427" cy="220" r="4" fill="#c2410c"/><circle cx="89" cy="155" r="4" fill="#2563eb"/><circle cx="444" cy="100" r="4" fill="#c2410c"/><circle cx="106" cy="171.66666666666666" r="4" fill="#2563eb"/><circle cx="461" cy="220" r="4" fill="#c2410c"/><circle cx="123" cy="180" r="4" fill="#2563eb"/><circle cx="478" cy="100" r="4" fill="#c2410c"/><circle cx="140" cy="185" r="4" fill="#2563eb"/><circle cx="495" cy="220" r="4" fill="#c2410c"/><circle cx="157" cy="188.33333333333334" r="4" fill="#15803d"/><circle cx="512" cy="100" r="4" fill="#c2410c"/><circle cx="174" cy="190.71428571428572" r="4" fill="#15803d"/><circle cx="529" cy="220" r="4" fill="#c2410c"/><circle cx="191" cy="192.5" r="4" fill="#15803d"/><circle cx="546" cy="100" r="4" fill="#c2410c"/><circle cx="208" cy="193.88888888888889" r="4" fill="#15803d"/><circle cx="563" cy="220" r="4" fill="#c2410c"/><circle cx="225" cy="195" r="4" fill="#15803d"/><circle cx="580" cy="100" r="4" fill="#c2410c"/><circle cx="242" cy="195.9090909090909" r="4" fill="#15803d"/><circle cx="597" cy="220" r="4" fill="#c2410c"/><circle cx="259" cy="196.66666666666666" r="4" fill="#15803d"/><circle cx="614" cy="100" r="4" fill="#c2410c"/><circle cx="276" cy="197.30769230769232" r="4" fill="#15803d"/><circle cx="631" cy="220" r="4" fill="#c2410c"/><circle cx="293" cy="197.85714285714286" r="4" fill="#15803d"/><circle cx="648" cy="100" r="4" fill="#c2410c"/><circle cx="310" cy="198.33333333333334" r="4" fill="#15803d"/><circle cx="665" cy="220" r="4" fill="#c2410c"/><circle cx="327" cy="198.75" r="4" fill="#15803d"/><circle cx="682" cy="100" r="4" fill="#c2410c"/><text x="190" y="75" text-anchor="middle" font-size="22" fill="#1a2e4a">1/n → 0</text><text x="565" y="75" text-anchor="middle" font-size="22" fill="#1a2e4a">(−1)ⁿ</text><text x="190" y="282" text-anchor="middle" font-size="18" fill="#1a2e4a">n ≥ 6: every error &lt; 0.2</text><text x="380" y="325" text-anchor="middle" font-size="16" fill="#1a2e4a">Indices increase left to right; the green band is distance &lt; ε from zero.</text></g></svg>