<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 350" role="img" aria-label="Four points lie on y=x/2, with principal variance3.125 and perpendicular variance zero; covariance is positive semidefinite and singular."><title>Singular covariance geometry</title><desc>Four points lie on y=x/2, with principal variance3.125 and perpendicular variance zero; covariance is positive semidefinite and singular.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#2563eb"/></marker></defs><rect width="760" height="350" fill="white"/><g font-family="system-ui,Segoe UI,Microsoft YaHei,sans-serif"><text x="380" y="30" text-anchor="middle" font-size="24" fill="#1a2e4a">PSD permits a zero projected variance</text><path d="M70,205H420M245,60V300" stroke="#94a3b8"/><path d="M84,285.5L406,124.5" stroke="#15803d" stroke-width="3"/><circle cx="105" cy="275" r="6" fill="#15803d"/><circle cx="175" cy="240" r="6" fill="#15803d"/><circle cx="315" cy="170" r="6" fill="#15803d"/><circle cx="385" cy="135" r="6" fill="#15803d"/><path d="M245,205L175,65" fill="none" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arrow)"/><text x="472" y="100" text-anchor="start" font-size="18" fill="#1a2e4a">Empirical Cov, denominator N</text><text x="472" y="145" text-anchor="start" font-size="21" fill="#1a2e4a">[[2.5,1.25],</text><text x="472" y="176" text-anchor="start" font-size="21" fill="#1a2e4a"> [1.25,.625]]</text><text x="472" y="225" text-anchor="start" font-size="19" fill="#1a2e4a">Line direction Var=3.125</text><text x="472" y="267" text-anchor="start" font-size="19" fill="#1a2e4a">Perpendicular Var=0</text><text x="380" y="327" text-anchor="middle" font-size="17" fill="#1a2e4a">Every direction nonnegative, possibly singular; variance does not certify prediction.</text></g></svg>