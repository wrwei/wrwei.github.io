<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 350" role="img" aria-label="At ten observations, the proportion is unbiased; the Beta two-two mean has lower risk at point three, but higher risk at point nine-five because squared bias outweighs its lower variance."><title>Risk comparison at two true rates</title><desc>At ten observations, the proportion is unbiased; the Beta two-two mean has lower risk at point three, but higher risk at point nine-five because squared bias outweighs its lower variance.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#2563eb"/></marker></defs><rect width="760" height="350" fill="white"/><g font-family="system-ui,Segoe UI,Microsoft YaHei,sans-serif"><text x="380" y="30" text-anchor="middle" font-size="23" fill="#1a2e4a">Risk = variance + squared bias</text><text x="20" y="94" text-anchor="start" font-size="18" fill="#1a2e4a">p=.30, MLE</text><rect x="220" y="69" width="420" height="30" rx="10" fill="#0284c7" stroke="#0284c7"/><text x="725" y="94" text-anchor="end" font-size="18" fill="#1a2e4a">0.021000</text><text x="20" y="148" text-anchor="start" font-size="18" fill="#1a2e4a">p=.30, Beta mean</text><rect x="220" y="123" width="214.28571428571428" height="30" rx="10" fill="#0284c7" stroke="#0284c7"/><rect x="434.2857142857143" y="123" width="65.30612244897961" height="30" rx="10" fill="#c2410c" stroke="#c2410c"/><text x="725" y="148" text-anchor="end" font-size="18" fill="#1a2e4a">0.013980</text><text x="20" y="202" text-anchor="start" font-size="18" fill="#1a2e4a">p=.95, MLE</text><rect x="220" y="177" width="95" height="30" rx="10" fill="#0284c7" stroke="#0284c7"/><text x="725" y="202" text-anchor="end" font-size="18" fill="#1a2e4a">0.004750</text><text x="20" y="256" text-anchor="start" font-size="18" fill="#1a2e4a">p=.95, Beta mean</text><rect x="220" y="231" width="48.46938775510204" height="30" rx="10" fill="#0284c7" stroke="#0284c7"/><rect x="268.46938775510205" y="231" width="330.6122448979593" height="30" rx="10" fill="#c2410c" stroke="#c2410c"/><text x="725" y="256" text-anchor="end" font-size="18" fill="#1a2e4a">0.018954</text><text x="380" y="317" text-anchor="middle" font-size="18" fill="#1a2e4a">Blue: variance; orange: squared bias. One horizontal scale.</text></g></svg>