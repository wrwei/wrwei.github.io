<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 360" role="img" aria-label="Points p=(1,2), q=(4,6) have difference (3,4). New points (11,−3), (14,1) have the same difference."><title>Translation of points and displacements</title><desc>Points p=(1,2), q=(4,6) have difference (3,4). New points (11,−3), (14,1) have the same difference.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#2563eb"/></marker></defs><rect width="760" height="360" fill="white"/><g font-family="system-ui,Segoe UI,Microsoft YaHei,sans-serif"><text x="380" y="32" text-anchor="middle" font-size="19" fill="#1a2e4a">A common offset changes point coordinates, not displacement</text><path d="M110,250L230,90" fill="none" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arrow)"/><circle cx="110" cy="250" r="6" fill="#1a2e4a"/><text x="110" y="284" text-anchor="middle" font-size="19" fill="#1a2e4a">p = (1,2)</text><text x="230" y="72" text-anchor="middle" font-size="19" fill="#1a2e4a">q = (4,6)</text><text x="146" y="170" text-anchor="middle" font-size="22" fill="#1a2e4a">(3,4)</text><path d="M470,250L590,90" fill="none" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arrow)"/><circle cx="470" cy="250" r="6" fill="#1a2e4a"/><text x="470" y="284" text-anchor="middle" font-size="19" fill="#1a2e4a">p′ = (11,−3)</text><text x="590" y="72" text-anchor="middle" font-size="19" fill="#1a2e4a">q′ = (14,1)</text><text x="506" y="170" text-anchor="middle" font-size="22" fill="#1a2e4a">(3,4)</text><text x="380" y="333" text-anchor="middle" font-size="18" fill="#1a2e4a">Both new tuples add (10,−5); the difference stays (3,4).</text></g></svg>