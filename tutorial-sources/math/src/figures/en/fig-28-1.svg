<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 350" role="img" aria-label="Population risk averages over new examples, empirical risk sums over fixed data, and gradient unbiasedness averages fresh indices conditional on the current state and data."><title>Population empirical and gradient averages</title><desc>Population risk averages over new examples, empirical risk sums over fixed data, and gradient unbiasedness averages fresh indices conditional on the current state and data.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#2563eb"/></marker></defs><rect width="760" height="350" fill="white"/><g font-family="system-ui,Segoe UI,Microsoft YaHei,sans-serif"><text x="380" y="30" text-anchor="middle" font-size="23" fill="#1a2e4a">Three averages: identify the randomness</text><rect x="35" y="55" width="690" height="77" rx="10" fill="#f0f9ff" stroke="#0ea5e9"/><text x="55" y="86" text-anchor="start" font-size="22" fill="#1a2e4a">R(w) = E_Z ℓ(w;Z)</text><text x="55" y="116" text-anchor="start" font-size="19" fill="#1a2e4a">Risk under the population law</text><rect x="35" y="145" width="690" height="77" rx="10" fill="#f0f9ff" stroke="#0ea5e9"/><text x="55" y="176" text-anchor="start" font-size="22" fill="#1a2e4a">F(w) = Σᵢ ℓᵢ(w)/N</text><text x="55" y="206" text-anchor="start" font-size="19" fill="#1a2e4a">Objective on fixed training data</text><rect x="35" y="235" width="690" height="77" rx="10" fill="#f0f9ff" stroke="#0ea5e9"/><text x="55" y="266" text-anchor="start" font-size="22" fill="#1a2e4a">E[ĝ | w,data] = ∇F(w)</text><text x="55" y="296" text-anchor="start" font-size="19" fill="#1a2e4a">Conditional mean over fresh sampled indices</text></g></svg>