<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 350" role="img" aria-label="Gradient uses one scalar step, cyclic coordinates use fresh updates, and Newton solves a coupled curvature system; costs and nonconvex safeguards differ."><title>Gradient coordinate and Newton comparison</title><desc>Gradient uses one scalar step, cyclic coordinates use fresh updates, and Newton solves a coupled curvature system; costs and nonconvex safeguards differ.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#2563eb"/></marker></defs><rect width="760" height="350" fill="white"/><g font-family="system-ui,Segoe UI,Microsoft YaHei,sans-serif"><text x="380" y="30" text-anchor="middle" font-size="24" fill="#1a2e4a">One objective, different update models</text><rect x="35" y="70" width="215" height="210" rx="10" fill="#f0f9ff" stroke="#0ea5e9"/><rect x="275" y="70" width="210" height="210" rx="10" fill="#f0f9ff" stroke="#0ea5e9"/><rect x="510" y="70" width="215" height="210" rx="10" fill="#f0f9ff" stroke="#0ea5e9"/><text x="142" y="109" text-anchor="middle" font-size="23" fill="#1a2e4a">Gradient</text><text x="380" y="109" text-anchor="middle" font-size="20" fill="#1a2e4a">Cyclic coordinates</text><text x="617" y="109" text-anchor="middle" font-size="23" fill="#1a2e4a">Newton</text><text x="142" y="163" text-anchor="middle" font-size="22" fill="#1a2e4a">x ← x−ηg</text><text x="380" y="163" text-anchor="middle" font-size="19" fill="#1a2e4a">xᵢ ← xᵢ−gᵢ/Aᵢᵢ</text><text x="617" y="163" text-anchor="middle" font-size="22" fill="#1a2e4a">Hp=−g</text><text x="142" y="218" text-anchor="middle" font-size="19" fill="#1a2e4a">One scalar step</text><text x="380" y="218" text-anchor="middle" font-size="18" fill="#1a2e4a">Use fresh coordinates</text><text x="617" y="218" text-anchor="middle" font-size="19" fill="#1a2e4a">Solve the system</text><text x="380" y="329" text-anchor="middle" font-size="17" fill="#1a2e4a">Compare decrease, total cost and safeguards, as well as iteration counts.</text></g></svg>