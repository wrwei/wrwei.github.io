<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 370" role="img" aria-label="Four left rectangles total 3/8 and right rectangles 5/8, enclosing the integral 1/2 of x on [0,1]."><title>Left and right sums enclose the integral</title><desc>Four left rectangles total 3/8 and right rectangles 5/8, enclosing the integral 1/2 of x on [0,1].</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#2563eb"/></marker></defs><rect width="760" height="370" fill="white"/><g font-family="system-ui,Segoe UI,Microsoft YaHei,sans-serif"><text x="380" y="30" text-anchor="middle" font-size="23" fill="#1a2e4a">Left and right rectangles for an increasing function</text><rect x="65" y="245" width="66.25" height="0" fill="#bfdbfe" stroke="#2563eb"/><rect x="131.25" y="207.5" width="66.25" height="37.5" fill="#bfdbfe" stroke="#2563eb"/><rect x="197.5" y="170" width="66.25" height="75" fill="#bfdbfe" stroke="#2563eb"/><rect x="263.75" y="132.5" width="66.25" height="112.5" fill="#bfdbfe" stroke="#2563eb"/><path d="M65,245H330M65,245V85" stroke="#94a3b8"/><path d="M65,245L330,95" stroke="#15803d" stroke-width="3"/><text x="65" y="268" text-anchor="middle" font-size="16" fill="#1a2e4a">0</text><text x="330" y="268" text-anchor="middle" font-size="16" fill="#1a2e4a">1</text><text x="197" y="305" text-anchor="middle" font-size="20" fill="#1a2e4a">Left sum = 3/8</text><rect x="430" y="207.5" width="66.25" height="37.5" fill="#fed7aa" stroke="#c2410c"/><rect x="496.25" y="170" width="66.25" height="75" fill="#fed7aa" stroke="#c2410c"/><rect x="562.5" y="132.5" width="66.25" height="112.5" fill="#fed7aa" stroke="#c2410c"/><rect x="628.75" y="95" width="66.25" height="150" fill="#fed7aa" stroke="#c2410c"/><path d="M430,245H695M430,245V85" stroke="#94a3b8"/><path d="M430,245L695,95" stroke="#15803d" stroke-width="3"/><text x="430" y="268" text-anchor="middle" font-size="16" fill="#1a2e4a">0</text><text x="695" y="268" text-anchor="middle" font-size="16" fill="#1a2e4a">1</text><text x="562" y="305" text-anchor="middle" font-size="20" fill="#1a2e4a">Right sum = 5/8</text><text x="380" y="343" text-anchor="middle" font-size="18" fill="#1a2e4a">f(x)=x, n=4; true integral 1/2, gap 1/4.</text></g></svg>