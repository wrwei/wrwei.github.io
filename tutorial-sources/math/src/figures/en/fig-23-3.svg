<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 350" role="img" aria-label="Expected within-case variance11/60 and between-case variance1/240 sum to3/16, using actual case weights5/8 and3/8."><title>Total variance decomposition</title><desc>Expected within-case variance11/60 and between-case variance1/240 sum to3/16, using actual case weights5/8 and3/8.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#2563eb"/></marker></defs><rect width="760" height="350" fill="white"/><g font-family="system-ui,Segoe UI,Microsoft YaHei,sans-serif"><text x="380" y="30" text-anchor="middle" font-size="24" fill="#1a2e4a">Total variance = within + between</text><rect x="35" y="65" width="325" height="210" rx="10" fill="#f0f9ff" stroke="#0ea5e9"/><rect x="400" y="65" width="325" height="210" rx="10" fill="#f0f9ff" stroke="#0ea5e9"/><text x="197" y="107" text-anchor="middle" font-size="18" fill="#1a2e4a">Expected conditional variance</text><text x="562" y="107" text-anchor="middle" font-size="18" fill="#1a2e4a">Variance of conditional means</text><text x="197" y="157" text-anchor="middle" font-size="24" fill="#1a2e4a">E[Var(X|Y)]</text><text x="562" y="157" text-anchor="middle" font-size="24" fill="#1a2e4a">Var(E[X|Y])</text><text x="197" y="209" text-anchor="middle" font-size="29" fill="#1a2e4a">11/60</text><text x="562" y="209" text-anchor="middle" font-size="29" fill="#1a2e4a">1/240</text><text x="197" y="250" text-anchor="middle" font-size="18" fill="#1a2e4a">Case weights5/8 and3/8</text><text x="562" y="250" text-anchor="middle" font-size="18" fill="#1a2e4a">Means1/5 and1/3</text><text x="380" y="325" text-anchor="middle" font-size="23" fill="#1a2e4a">Var(X)=3/16=11/60+1/240</text></g></svg>