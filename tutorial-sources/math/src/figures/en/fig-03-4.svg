<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 365" role="img" aria-label="Empty at bottom, incomparable singleton sets in the middle, and full set at top. Four cover edges indicate upward inclusion."><title>Hasse diagram of inclusion</title><desc>Empty at bottom, incomparable singleton sets in the middle, and full set at top. Four cover edges indicate upward inclusion.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#2563eb"/></marker></defs><rect width="760" height="365" fill="white"/><g font-family="system-ui,Segoe UI,Microsoft YaHei,sans-serif"><path d="M380,282L220,172L380,62L540,172L380,282" fill="none" stroke="#2563eb" stroke-width="3"/><circle cx="380" cy="282" r="7" fill="#1a2e4a"/><text x="380" y="264" text-anchor="middle" font-size="21" fill="#1a2e4a">∅</text><circle cx="220" cy="172" r="7" fill="#1a2e4a"/><text x="220" y="154" text-anchor="middle" font-size="21" fill="#1a2e4a">{a}</text><circle cx="540" cy="172" r="7" fill="#1a2e4a"/><text x="540" y="154" text-anchor="middle" font-size="21" fill="#1a2e4a">{b}</text><circle cx="380" cy="62" r="7" fill="#1a2e4a"/><text x="380" y="44" text-anchor="middle" font-size="21" fill="#1a2e4a">{a, b}</text><text x="380" y="332" text-anchor="middle" font-size="17" fill="#1a2e4a">Upward means inclusion; {a} and {b} are incomparable</text></g></svg>