<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 350" role="img" aria-label="Exact generation precedes stratified splitting; training fits all transforms, validation chooses among thirteen candidates, and frozen testing does not feed back into fitting."><title>Learning pipeline and split dependencies</title><desc>Exact generation precedes stratified splitting; training fits all transforms, validation chooses among thirteen candidates, and frozen testing does not feed back into fitting.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#2563eb"/></marker></defs><rect width="760" height="350" fill="white"/><g font-family="system-ui,Segoe UI,Microsoft YaHei,sans-serif"><text x="380" y="30" text-anchor="middle" font-size="23" fill="#1a2e4a">Fixed data, explicit information flow</text><rect x="35" y="55" width="690" height="48" rx="10" fill="#f0f9ff" stroke="#0ea5e9"/><text x="380" y="86" text-anchor="middle" font-size="21" fill="#1a2e4a">Seed7: 1000 rows; seed11: 600/200/200</text><path d="M380,105L380,116" fill="none" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="35" y="121" width="690" height="48" rx="10" fill="#f0f9ff" stroke="#0ea5e9"/><text x="380" y="152" text-anchor="middle" font-size="21" fill="#1a2e4a">Train: μ, s, PCA and model parameters</text><path d="M380,171L380,182" fill="none" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="35" y="187" width="690" height="48" rx="10" fill="#f0f9ff" stroke="#0ea5e9"/><text x="380" y="218" text-anchor="middle" font-size="21" fill="#1a2e4a">Validate: 13 candidates, baseline and components</text><path d="M380,237L380,248" fill="none" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="35" y="253" width="690" height="48" rx="10" fill="#f0f9ff" stroke="#0ea5e9"/><text x="380" y="284" text-anchor="middle" font-size="21" fill="#1a2e4a">Freeze rules → test metrics and conditional intervals</text></g></svg>