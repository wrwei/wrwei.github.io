<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 350" role="img" aria-label="Eigenvalues two and four give worst magnitudes 0.6, one-third, one and 1.2 for steps 0.2, one-third, 0.5 and 0.55. The strict magnitude bound is essential."><title>Quadratic spectral step table</title><desc>Eigenvalues two and four give worst magnitudes 0.6, one-third, one and 1.2 for steps 0.2, one-third, 0.5 and 0.55. The strict magnitude bound is essential.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#2563eb"/></marker></defs><rect width="760" height="350" fill="white"/><g font-family="system-ui,Segoe UI,Microsoft YaHei,sans-serif"><text x="380" y="30" text-anchor="middle" font-size="24" fill="#1a2e4a">One step acts on two eigenmodes</text><text x="100" y="83" text-anchor="middle" font-size="19" fill="#1a2e4a">η</text><text x="285" y="83" text-anchor="middle" font-size="19" fill="#1a2e4a">λ=2 factor</text><text x="470" y="83" text-anchor="middle" font-size="19" fill="#1a2e4a">λ=4 factor</text><text x="655" y="83" text-anchor="middle" font-size="19" fill="#1a2e4a">Worst magnitude</text><rect x="25" y="98" width="710" height="40" rx="10" fill="#f0f9ff" stroke="#0ea5e9"/><text x="100" y="125" text-anchor="middle" font-size="21" fill="#1a2e4a">.2</text><text x="285" y="125" text-anchor="middle" font-size="21" fill="#1a2e4a">.6</text><text x="470" y="125" text-anchor="middle" font-size="21" fill="#1a2e4a">.2</text><text x="655" y="125" text-anchor="middle" font-size="21" fill="#1a2e4a">.6</text><rect x="25" y="142" width="710" height="40" rx="10" fill="#f0f9ff" stroke="#0ea5e9"/><text x="100" y="169" text-anchor="middle" font-size="21" fill="#1a2e4a">1/3</text><text x="285" y="169" text-anchor="middle" font-size="21" fill="#1a2e4a">1/3</text><text x="470" y="169" text-anchor="middle" font-size="21" fill="#1a2e4a">−1/3</text><text x="655" y="169" text-anchor="middle" font-size="21" fill="#1a2e4a">1/3</text><rect x="25" y="186" width="710" height="40" rx="10" fill="#fff7ed" stroke="#0ea5e9"/><text x="100" y="213" text-anchor="middle" font-size="21" fill="#1a2e4a">.5</text><text x="285" y="213" text-anchor="middle" font-size="21" fill="#1a2e4a">0</text><text x="470" y="213" text-anchor="middle" font-size="21" fill="#1a2e4a">−1</text><text x="655" y="213" text-anchor="middle" font-size="21" fill="#1a2e4a">1</text><rect x="25" y="230" width="710" height="40" rx="10" fill="#fff7ed" stroke="#0ea5e9"/><text x="100" y="257" text-anchor="middle" font-size="21" fill="#1a2e4a">.55</text><text x="285" y="257" text-anchor="middle" font-size="21" fill="#1a2e4a">−.1</text><text x="470" y="257" text-anchor="middle" font-size="21" fill="#1a2e4a">−1.2</text><text x="655" y="257" text-anchor="middle" font-size="21" fill="#1a2e4a">1.2</text><text x="380" y="319" text-anchor="middle" font-size="20" fill="#1a2e4a">ρ=max|1−ηλ|; every-start convergence needs ρ&lt;1.</text></g></svg>