<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 365" role="img" aria-label="Input eight has three nonleaf levels costing eight each and eight unit leaves costing eight more, total thirty-two."><title>Recursion work by level</title><desc>Input eight has three nonleaf levels costing eight each and eight unit leaves costing eight more, total thirty-two.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#2563eb"/></marker></defs><rect width="760" height="365" fill="white"/><g font-family="system-ui,Segoe UI,Microsoft YaHei,sans-serif"><text x="380" y="30" text-anchor="middle" font-size="20" fill="#1a2e4a">T(n) = 2T(n/2) + n, T(1) = 1, n = 8</text><rect x="329" y="62" width="42" height="30" rx="10" fill="#f0f9ff" stroke="#0ea5e9"/><text x="350" y="83" text-anchor="middle" font-size="18" fill="#1a2e4a">8</text><text x="45" y="83" text-anchor="start" font-size="17" fill="#1a2e4a">j=0</text><text x="675" y="83" text-anchor="middle" font-size="19" fill="#1a2e4a">= 8</text><path d="M350,92L225,123" fill="none" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="204" y="127" width="42" height="30" rx="10" fill="#f0f9ff" stroke="#0ea5e9"/><text x="225" y="148" text-anchor="middle" font-size="18" fill="#1a2e4a">4</text><path d="M350,92L475,123" fill="none" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="454" y="127" width="42" height="30" rx="10" fill="#f0f9ff" stroke="#0ea5e9"/><text x="475" y="148" text-anchor="middle" font-size="18" fill="#1a2e4a">4</text><text x="45" y="148" text-anchor="start" font-size="17" fill="#1a2e4a">j=1</text><text x="675" y="148" text-anchor="middle" font-size="19" fill="#1a2e4a">= 8</text><path d="M225,157L162.5,188" fill="none" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="141.5" y="192" width="42" height="30" rx="10" fill="#f0f9ff" stroke="#0ea5e9"/><text x="162