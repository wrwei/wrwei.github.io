<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 340" role="img" aria-label="Arbitrary allowed inputs, hypotheses, definitions and rules, then conclusion."><title>Proof architecture</title><desc>Arbitrary allowed inputs, hypotheses, definitions and rules, then conclusion.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#2563eb"/></marker></defs><rect width="760" height="340" fill="white"/><g font-family="system-ui,Segoe UI,Microsoft YaHei,sans-serif"><rect x="25" y="85" width="158" height="90" rx="10" fill="#f0f9ff" stroke="#0ea5e9"/><text x="104" y="138" text-anchor="middle" font-size="12" fill="#1a2e4a">Arbitrary allowed inputs</text><path d="M185,130L209,130" fill="none" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="212" y="85" width="158" height="90" rx="10" fill="#f0f9ff" stroke="#0ea5e9"/><text x="291" y="138" text-anchor="middle" font-size="12" fill="#1a2e4a">Unpack hypotheses</text><path d="M372,130L396,130" fill="none" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="399" y="85" width="158" height="90" rx="10" fill="#f0f9ff" stroke="#0ea5e9"/><text x="478" y="138" text-anchor="middle" font-size="12" fill="#1a2e4a">Definitions and rules</text><path d="M559,130L583,130" fill="none" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="586" y="85" width="158" height="90" rx="10" fill="#f0f9ff" stroke="#0ea5e9"/><text x="665" y="138" text-anchor="middle" font-size="12" fill="#1a2e4a">Establish conclusion</text><text x="380" y="235" text-anchor="middle" font-size="18" fill="#1a2e4a">Every step needs a reason; arbitrary inputs determine coverage</text></g></svg>