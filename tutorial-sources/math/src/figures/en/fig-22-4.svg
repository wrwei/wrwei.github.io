<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 360" role="img" aria-label="A table distinguishes fixed-trial binomial, geometric waiting, rate-count Poisson, continuous exponential and real-supported Gaussian, with explicit parameter conventions."><title>Distribution mechanisms and supports</title><desc>A table distinguishes fixed-trial binomial, geometric waiting, rate-count Poisson, continuous exponential and real-supported Gaussian, with explicit parameter conventions.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#2563eb"/></marker></defs><rect width="760" height="360" fill="white"/><g font-family="system-ui,Segoe UI,Microsoft YaHei,sans-serif"><text x="380" y="30" text-anchor="middle" font-size="24" fill="#1a2e4a">Choose a distribution from mechanism and support</text><rect x="25" y="60" width="710" height="42" rx="10" fill="#f0f9ff" stroke="#0ea5e9"/><text x="42" y="88" text-anchor="start" font-size="18" fill="#1a2e4a">Binomial</text><text x="245" y="88" text-anchor="start" font-size="16" fill="#1a2e4a">Fixed n, independent common p</text><text x="670" y="88" text-anchor="middle" font-size="18" fill="#1a2e4a">0,…,n</text><rect x="25" y="107" width="710" height="42" rx="10" fill="#f0f9ff" stroke="#0ea5e9"/><text x="42" y="135" text-anchor="start" font-size="18" fill="#1a2e4a">Geometric trials</text><text x="245" y="135" text-anchor="start" font-size="16" fill="#1a2e4a">First success, stable attempts</text><text x="670" y="135" text-anchor="middle" font-size="18" fill="#1a2e4a">1,2,…</text><rect x="25" y="154" width="710" height="42" rx="10" fill="#f0f9ff" stroke="#0ea5e9"/><text x="42" y="182" text-anchor="start" font-size="18" fill="#1a2e4a">Poisson</text><text x="245" y="182" text-anchor="start" font-size="16" fill="#1a2e4a">Rate model in fixed interval</text><text x="670" y="182" text-anchor="middle" font-size="18" fill="#1a2e4a">0,1,…</text><rect x="25" y="201" width="710" height="42" rx="10" fill="#f0f9ff" stroke="#0ea5e9"/><text x="42" y="229" text-anchor="start" font-size="18" fill="#1a2e4a">Exponential (AI)</text><text x="245" y="229" text-anchor="start" font-size="16" fill="#1a2e4a">Continuous constant-rate wait</text><text x="670" y="229" text-anchor="middle" font-size="18" fill="#1a2e4a">[0,∞)</text><rect x="25" y="248" width="710" height="42" rx="10" fill="#f0f9ff" stroke="#0ea5e9"/><text x="42" y="276" text-anchor="start" font-size="18" fill="#1a2e4a">Gaussian (AI)</text><text x="245" y="276" text-anchor="start" font-size="16" fill="#1a2e4a">Location and positive error scale</text><text x="670" y="276" text-anchor="middle" font-size="18" fill="#1a2e4a">R</text><text x="380" y="333" text-anchor="middle" font-size="18" fill="#1a2e4a">Geometric failures start at0; rate≠scale, variance≠standard deviation.</text></g></svg>