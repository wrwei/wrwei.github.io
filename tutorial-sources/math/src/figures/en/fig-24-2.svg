<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 360" role="img" aria-label="The weak law fixes tolerance and sends the tail probability to zero; the CLT divides mean fluctuations by standard error for a standard Gaussian limit."><title>Fixed tolerance and standardised limits</title><desc>The weak law fixes tolerance and sends the tail probability to zero; the CLT divides mean fluctuations by standard error for a standard Gaussian limit.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#2563eb"/></marker></defs><rect width="760" height="360" fill="white"/><g font-family="system-ui,Segoe UI,Microsoft YaHei,sans-serif"><text x="380" y="30" text-anchor="middle" font-size="23" fill="#1a2e4a">Weak law and CLT use different scales</text><rect x="30" y="60" width="700" height="107" rx="10" fill="#f0f9ff" stroke="#0ea5e9"/><text x="55" y="91" text-anchor="start" font-size="22" fill="#1a2e4a">Fix ε &gt; 0, increase N</text><text x="380" y="130" text-anchor="middle" font-size="22" fill="#1a2e4a">P(|M_N − μ| ≥ ε) ≤ σ²/(Nε²) → 0</text><path d="M380,174L380,199" fill="none" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="30" y="213" width="700" height="98" rx="10" fill="#faf5ff" stroke="#7e22ce"/><text x="55" y="246" text-anchor="start" font-size="22" fill="#1a2e4a">Rescale fluctuations, not raw observations</text><text x="380" y="282" text-anchor="middle" font-size="22" fill="#1a2e4a">Z_N = √N(M_N − μ)/σ   ⇒   N(0,1)</text><text x="380" y="339" text-anchor="middle" font-size="18" fill="#1a2e4a">CLT: IID, 0 &lt; σ² &lt; ∞; no finite error rate stated here.</text></g></svg>