<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 350" role="img" aria-label="Training fits transforms and parameters, validation selects models and stopping, and a final test evaluates the frozen pipeline independently; preprocessing is refitted inside folds."><title>Evaluation splits and selection roles</title><desc>Training fits transforms and parameters, validation selects models and stopping, and a final test evaluates the frozen pipeline independently; preprocessing is refitted inside folds.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#2563eb"/></marker></defs><rect width="760" height="350" fill="white"/><g font-family="system-ui,Segoe UI,Microsoft YaHei,sans-serif"><text x="380" y="30" text-anchor="middle" font-size="23" fill="#1a2e4a">Fit, select, then evaluate after freezing</text><rect x="30" y="85" width="210" height="145" rx="10" fill="#f0f9ff" stroke="#0ea5e9"/><text x="135" y="133" text-anchor="middle" font-size="22" fill="#1a2e4a">Training</text><text x="135" y="175" text-anchor="middle" font-size="16" fill="#1a2e4a">Fit transforms and parameters</text><rect x="275" y="85" width="210" height="145" rx="10" fill="#f0f9ff" stroke="#0ea5e9"/><text x="380" y="133" text-anchor="middle" font-size="22" fill="#1a2e4a">Validation</text><text x="380" y="175" text-anchor="middle" font-size="16" fill="#1a2e4a">Select model and stopping</text><rect x="520" y="85" width="210" height="145" rx="10" fill="#f0f9ff" stroke="#0ea5e9"/><text x="625" y="133" text-anchor="middle" font-size="22" fill="#1a2e4a">Final test</text><text x="625" y="175" text-anchor="middle" font-size="16" fill="#1a2e4a">Independent frozen evaluation</text><path d="M244,155L265,155" fill="none" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M489,155L510,155" fill="none" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arrow)"/><text x="380" y="280" text-anchor="middle" font-size="20" fill="#1a2e4a">Cross-validation: refit preprocessing in each training fold.</text><text x="380" y="327" text-anchor="middle" font-size="19" fill="#1a2e4a">A test used for selection is no longer untouched.</text></g></svg>