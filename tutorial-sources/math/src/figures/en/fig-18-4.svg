<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 525" role="img" aria-label="At x two, u four, v sixteen, w twenty and z twenty-two, output seed one gives adjoints z one, w one, v one, u nine, x thirty-seven. Both repeated multiplication edges and direct addition paths contribute."><title>Complete accumulation in a shared-square graph</title><desc>At x two, u four, v sixteen, w twenty and z twenty-two, output seed one gives adjoints z one, w one, v one, u nine, x thirty-seven. Both repeated multiplication edges and direct addition paths contribute.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#2563eb"/></marker></defs><rect width="760" height="525" fill="white"/><g font-family="system-ui,Segoe UI,Microsoft YaHei,sans-serif"><text x="380" y="30" text-anchor="middle" font-size="24" fill="#1a2e4a">Shared graph: forward values and reverse adjoints</text><path d="M225,108L290,108" fill="none" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M225,148L290,148" fill="none" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M470,108L535,108" fill="none" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M470,148L535,148" fill="none" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M625,180L625,300" fill="none" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M470,168L535,300" fill="none" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M535,355L470,355" fill="none" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M225,168L290,300" fill="none" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="45" y="70" width="180" height="110" rx="10" fill="#f0f9ff" stroke="#0ea5e9"/><text x="135" y="100" text-anchor="middle" font-size="21" fill="#1a2e4a">x</text><text x="135" y="136" text-anchor="middle" font-size="20" fill="#1a2e4a">value 2</text><text x="135" y="166" text-anchor="middle" font-size="20" fill="#15803d">adjoint 37</text><rect x="290" y="70" width="180" height="110" rx="10" fill="#f0f9ff" stroke="#0ea5e9"/><text x="380" y="100" text-anchor="middle" font-size="21" fill="#1a2e4a">u=x*x</text><text x="380" y="136" text-anchor="middle" font-size="20" fill="#1a2e4a">value 4</text><text x="380" y="166" text-anchor="middle" font-size="20" fill="#15803d">adjoint 9</text><rect x="535" y="70" width="180" height="110" rx="10" fill="#f0f9ff" stroke="#0ea5e9"/><text x="625" y="100" text-anchor="middle" font-size="21" fill="#1a2e4a">v=u*u</text><text x="625" y="136" text-anchor="middle" font-size="20" fill="#1a2e4a">value 16</text><text x="625" y="166" text-anchor="middle" font-size="20" fill="#15803d">adjoint 1</text><rect x="535" y="300" width="180" height="110" rx="10" fill="#f0f9ff" stroke="#0ea5e9"/><text x="625" y="330" text-anchor="middle" font-size="21" fill="#1a2e4a">w=v+u</text><text x="625" y="366" text-anchor="middle" font-size="20" fill="#1a2e4a">value 20</text><text x="625" y="396" text-anchor="middle" font-size="20" fill="#15803d">adjoint 1</text><rect x="290" y="300" width="180" height="110" rx="10" fill="#f0f9ff" stroke="#0ea5e9"/><text x="380" y="330" text-anchor="middle" font-size="21" fill="#1a2e4a">z=w+x</text><text x="380" y="366" text-anchor="middle" font-size="20" fill="#1a2e4a">value 22</text><text x="380" y="396" text-anchor="middle" font-size="20" fill="#15803d">adjoint 1</text><text x="258" y="100" text-anchor="middle" font-size="18" fill="#1a2e4a">x</text><text x="258" y="145" text-anchor="middle" font-size="18" fill="#1a2e4a">x</text><text x="503" y="100" text-anchor="middle" font-size="18" fill="#1a2e4a">u</text><text x="503" y="145" text-anchor="middle" font-size="18" fill="#1a2e4a">u</text><text x="643" y="245" text-anchor="start" font-size="18" fill="#1a2e4a">1</text><text x="500" y="238" text-anchor="start" font-size="18" fill="#1a2e4a">1</text><text x="503" y="344" text-anchor="middle" font-size="18" fill="#1a2e4a">1</text><text x="250" y="238" text-anchor="start" font-size="18" fill="#1a2e4a">1</text><text x="380" y="463" text-anchor="middle" font-size="22" fill="#1a2e4a">ū=2u+1=9; x̄=2x·ū+1=37.</text><text x="380" y="498" text-anchor="middle" font-size="17" fill="#1a2e4a">Arrows show forward dependencies; every edge contributes backward.</text></g></svg>