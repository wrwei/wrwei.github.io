<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 350" role="img" aria-label="Illustrative four-bit precision: spacing from one to two is one-eighth, and from two to four is one-quarter; local spacing grows with scale."><title>Floating-point spacing across binades</title><desc>Illustrative four-bit precision: spacing from one to two is one-eighth, and from two to four is one-quarter; local spacing grows with scale.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#2563eb"/></marker></defs><rect width="760" height="350" fill="white"/><g font-family="system-ui,Segoe UI,Microsoft YaHei,sans-serif"><text x="380" y="30" text-anchor="middle" font-size="22" fill="#1a2e4a">Illustrative p=4: spacing grows with the binade</text><path d="M65,110H700" stroke="#64748b"/><path d="M65,98V122" stroke="#0284c7" stroke-width="2"/><text x="65" y="150" text-anchor="middle" font-size="18" fill="#1a2e4a">1.00</text><path d="M143,98V122" stroke="#0284c7" stroke-width="2"/><path d="M221,98V122" stroke="#0284c7" stroke-width="2"/><text x="221" y="150" text-anchor="middle" font-size="18" fill="#1a2e4a">1.25</text><path d="M299,98V122" stroke="#0284c7" stroke-width="2"/><path d="M377,98V122" stroke="#0284c7" stroke-width="2"/><text x="377" y="150" text-anchor="middle" font-size="18" fill="#1a2e4a">1.50</text><path d="M455,98V122" stroke="#0284c7" stroke-width="2"/><path d="M533,98V122" stroke="#0284c7" stroke-width="2"/><text x="533" y="150" text-anchor="middle" font-size="18" fill="#1a2e4a">1.75</text><path d="M611,98V122" stroke="#0284c7" stroke-width="2"/><path d="M689,98V122" stroke="#0284c7" stroke-width="2"/><text x="689" y="150" text-anchor="middle" font-size="18" fill="#1a2e4a">2.00</text><text x="380" y="75" text-anchor="middle" font-size="21" fill="#1a2e4a">Spacing on this binade: 0.125</text><path d="M65,240H700" stroke="#64748b"/><path d="M65,228V252" stroke="#0284c7" stroke-width="2"/><text x="65" y="280" text-anchor="middle" font-size="18" fill="#1a2e4a">2.00</text><path d="M143,228V252" stroke="#0284c7" stroke-width="2"/><path d="M221,228V252" stroke="#0284c7" stroke-width="2"/><text x="221" y="280" text-anchor="middle" font-size="18" fill="#1a2e4a">2.50</text><path d="M299,228V252" stroke="#0284c7" stroke-width="2"/><path d="M377,228V252" stroke="#0284c7" stroke-width="2"/><text x="377" y="280" text-anchor="middle" font-size="18" fill="#1a2e4a">3.00</text><path d="M455,228V252" stroke="#0284c7" stroke-width="2"/><path d="M533,228V252" stroke="#0284c7" stroke-width="2"/><text x="533" y="280" text-anchor="middle" font-size="18" fill="#1a2e4a">3.50</text><path d="M611,228V252" stroke="#0284c7" stroke-width="2"/><path d="M689,228V252" stroke="#0284c7" stroke-width="2"/><text x="689" y="280" text-anchor="middle" font-size="18" fill="#1a2e4a">4.00</text><text x="380" y="205" text-anchor="middle" font-size="21" fill="#1a2e4a">Spacing on this binade: 0.25</text><text x="380" y="327" text-anchor="middle" font-size="19" fill="#1a2e4a">This simplified format is not binary16.</text></g></svg>