<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 340" role="img" aria-label="Only r1-a and r2-b are true. Every request has a reviewer, but no reviewer covers both requests."><title>Local and common witnesses</title><desc>Only r1-a and r2-b are true. Every request has a reviewer, but no reviewer covers both requests.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#2563eb"/></marker></defs><rect width="760" height="340" fill="white"/><g font-family="system-ui,Segoe UI,Microsoft YaHei,sans-serif"><text x="320" y="45" text-anchor="middle" font-size="22" fill="#1a2e4a">a</text><text x="475" y="45" text-anchor="middle" font-size="22" fill="#1a2e4a">b</text><text x="155" y="112" text-anchor="middle" font-size="22" fill="#1a2e4a">r1</text><rect x="260" y="73" width="120" height="62" rx="10" fill="#f0fdf4" stroke="#15803d"/><text x="320" y="112" text-anchor="middle" font-size="25" fill="#1a2e4a">T</text><rect x="415" y="73" width="120" height="62" rx="10" fill="#fff1f2" stroke="#be123c"/><text x="475" y="112" text-anchor="middle" font-size="25" fill="#1a2e4a">F</text><text x="155" y="192" text-anchor="middle" font-size="22" fill="#1a2e4a">r2</text><rect x="260" y="153" width="120" height="62" rx="10" fill="#fff1f2" stroke="#be123c"/><text x="320" y="192" text-anchor="middle" font-size="25" fill="#1a2e4a">F</text><rect x="415" y="153" width="120" height="62" rx="10" fill="#f0fdf4" stroke="#15803d"/><text x="475" y="192" text-anchor="middle" font-size="25" fill="#1a2e4a">T</text><text x="380" y="270" text-anchor="middle" font-size="19" fill="#1a2e4a">Each row has T: ∀r ∃v is true</text><text x="380" y="305" text-anchor="middle" font-size="19" fill="#1a2e4a">No all-T column: ∃v ∀r is false</text></g></svg>