<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 340" role="img" aria-label="Matrix [[2,1],[1,2]] has sum eigenvalue three and difference eigenvalue one; unit directions are orthogonal and Q diag(1,3) Q transpose reconstructs it."><title>Orthogonal eigendirections</title><desc>Matrix [[2,1],[1,2]] has sum eigenvalue three and difference eigenvalue one; unit directions are orthogonal and Q diag(1,3) Q transpose reconstructs it.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#2563eb"/></marker></defs><rect width="760" height="340" fill="white"/><g font-family="system-ui,Segoe UI,Microsoft YaHei,sans-serif"><text x="380" y="30" text-anchor="middle" font-size="20" fill="#1a2e4a">Sum and difference modes of a symmetric map: perpendicular scalings</text><path d="M30,220H380M180,310V65" stroke="#94a3b8"/><path d="M180,220L270,130" fill="none" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M180,220L240,280" fill="none" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arrow)"/><text x="278" y="123" text-anchor="start" font-size="21" fill="#1a2e4a">(1,1): λ=3</text><text x="248" y="301" text-anchor="start" font-size="21" fill="#1a2e4a">(1,−1): λ=1</text><rect x="445" y="75" width="290" height="220" rx="10" fill="#f0f9ff" stroke="#0ea5e9"/><text x="590" y="119" text-anchor="middle" font-size="23" fill="#1a2e4a">A=[[2,1],[1,2]]</text><text x="590" y="174" text-anchor="middle" font-size="22" fill="#1a2e4a">A = Q diag(1,3) Qᵀ</text><text x="590" y="229" text-anchor="middle" font-size="26" fill="#1a2e4a">QᵀQ = I</text><text x="590" y="272" text-anchor="middle" font-size="17" fill="#1a2e4a">Unit directions divide by √2</text></g></svg>