<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 380" role="img" aria-label="Singular values six, three, one have squares 36,9,1. Retaining zero, one, two, three terms leaves squared errors 46,10,1,0."><title>Truncation error budget</title><desc>Singular values six, three, one have squares 36,9,1. Retaining zero, one, two, three terms leaves squared errors 46,10,1,0.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#2563eb"/></marker></defs><rect width="760" height="380" fill="white"/><g font-family="system-ui,Segoe UI,Microsoft YaHei,sans-serif"><text x="380" y="30" text-anchor="middle" font-size="21" fill="#1a2e4a">Strengths six, three, one: discarded squared energy is exact</text><rect x="110" y="91" width="110" height="144" fill="#2563eb"/><text x="165" y="265" text-anchor="middle" font-size="23" fill="#1a2e4a">σ₁²=36</text><rect x="320" y="199" width="110" height="36" fill="#2563eb"/><text x="375" y="265" text-anchor="middle" font-size="23" fill="#1a2e4a">σ₂²=9</text><rect x="530" y="231" width="110" height="4" fill="#2563eb"/><text x="585" y="265" text-anchor="middle" font-size="23" fill="#1a2e4a">σ₃²=1</text><text x="380" y="305" text-anchor="middle" font-size="24" fill="#1a2e4a">k=0,1,2,3 → squared errors 46,10,1,0</text><text x="380" y="348" text-anchor="middle" font-size="19" fill="#1a2e4a">Operator error is the largest discarded strength, not the square sum.</text></g></svg>