<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 380" role="img" aria-label="Any target first projects to its closest column-space prediction, then the inverse restricted to the row space lifts it to minimum-norm weights."><title>Projection and lifting in the pseudoinverse</title><desc>Any target first projects to its closest column-space prediction, then the inverse restricted to the row space lifts it to minimum-norm weights.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#2563eb"/></marker></defs><rect width="760" height="380" fill="white"/><g font-family="system-ui,Segoe UI,Microsoft YaHei,sans-serif"><text x="380" y="30" text-anchor="middle" font-size="19" fill="#1a2e4a">Pseudoinverse: project the target, then choose weights with no null component</text><rect x="20" y="110" width="185" height="140" rx="10" fill="#f0f9ff" stroke="#0ea5e9"/><text x="112.5" y="163" text-anchor="middle" font-size="23" fill="#1a2e4a">y ∈ Rᵐ</text><text x="112.5" y="214" text-anchor="middle" font-size="17" fill="#1a2e4a">Any target</text><rect x="280" y="110" width="200" height="140" rx="10" fill="#f0f9ff" stroke="#0ea5e9"/><text x="380" y="163" text-anchor="middle" font-size="23" fill="#1a2e4a">p ∈ C(X)</text><text x="380" y="214" text-anchor="middle" font-size="17" fill="#1a2e4a">Closest prediction</text><rect x="555" y="110" width="185" height="140" rx="10" fill="#f0f9ff" stroke="#0ea5e9"/><text x="647.5" y="163" text-anchor="middle" font-size="23" fill="#1a2e4a">w_min ∈ R(X)</text><text x="647.5" y="214" text-anchor="middle" font-size="17" fill="#1a2e4a">Minimum-norm representative</text><path d="M215,180L270,180" fill="none" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M490,180L545,180" fill="none" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arrow)"/><text x="380" y="300" text-anchor="middle" font-size="26" fill="#1a2e4a">XX⁺ = P_C;     X⁺X = P_R</text><text x="380" y="348" text-anchor="middle" font-size="18" fill="#1a2e4a">The kernel remains, and targets outside the column space remain unattainable.</text></g></svg>