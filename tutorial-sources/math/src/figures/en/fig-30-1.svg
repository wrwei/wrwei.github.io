<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 350" role="img" aria-label="Training fits parameters and transforms, validation selects, all rules are frozen, then independent testing estimates the declared target risk."><title>Selection and frozen testing</title><desc>Training fits parameters and transforms, validation selects, all rules are frozen, then independent testing estimates the declared target risk.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#2563eb"/></marker></defs><rect width="760" height="350" fill="white"/><g font-family="system-ui,Segoe UI,Microsoft YaHei,sans-serif"><text x="380" y="30" text-anchor="middle" font-size="23" fill="#1a2e4a">Select first, freeze before estimating</text><rect x="35" y="52" width="690" height="47" rx="10" fill="#f0f9ff" stroke="#0ea5e9"/><text x="380" y="82" text-anchor="middle" font-size="21" fill="#1a2e4a">Train: parameters and transforms</text><path d="M380,101L380,114" fill="none" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="35" y="118" width="690" height="47" rx="10" fill="#f0f9ff" stroke="#0ea5e9"/><text x="380" y="148" text-anchor="middle" font-size="21" fill="#1a2e4a">Validate: candidate selection</text><path d="M380,167L380,180" fill="none" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="35" y="184" width="690" height="47" rx="10" fill="#f0f9ff" stroke="#0ea5e9"/><text x="380" y="214" text-anchor="middle" font-size="21" fill="#1a2e4a">Freeze: model and rules</text><path d="M380,233L380,246" fill="none" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="35" y="250" width="690" height="47" rx="10" fill="#f0f9ff" stroke="#0ea5e9"/><text x="380" y="280" text-anchor="middle" font-size="21" fill="#1a2e4a">Test: estimate target risk</text><text x="380" y="336" text-anchor="middle" font-size="18" fill="#1a2e4a">Every use of labels belongs in the information-dependency account.</text></g></svg>