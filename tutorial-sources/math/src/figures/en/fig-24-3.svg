<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 350" role="img" aria-label="For twenty fair Bernoulli draws the mean deviation tail at least point two is approximately point1153, below Chebyshev point3125 and Hoeffding approximately point4038."><title>Tail probability and valid upper bounds</title><desc>For twenty fair Bernoulli draws the mean deviation tail at least point two is approximately point1153, below Chebyshev point3125 and Hoeffding approximately point4038.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#2563eb"/></marker></defs><rect width="760" height="350" fill="white"/><g font-family="system-ui,Segoe UI,Microsoft YaHei,sans-serif"><text x="380" y="30" text-anchor="middle" font-size="23" fill="#1a2e4a">The same IID Bernoulli(.5) event</text><text x="380" y="66" text-anchor="middle" font-size="22" fill="#1a2e4a">N=20; ε=.20; |M−.5| ≥ .20</text><text x="32" y="113" text-anchor="start" font-size="19" fill="#1a2e4a">Finite-model tail</text><rect x="245" y="85" width="111.85874938964844" height="38" rx="10" fill="#0ea5e9" stroke="#0ea5e9"/><text x="700" y="113" text-anchor="end" font-size="21" fill="#1a2e4a">0.115318</text><text x="32" y="181" text-anchor="start" font-size="19" fill="#1a2e4a">Chebyshev</text><rect x="245" y="153" width="303.125" height="38" rx="10" fill="#c2410c" stroke="#c2410c"/><text x="700" y="181" text-anchor="end" font-size="21" fill="#1a2e4a">0.312500</text><text x="32" y="249" text-anchor="start" font-size="19" fill="#1a2e4a">Hoeffding</text><rect x="245" y="221" width="391.67924490963145" height="38" rx="10" fill="#7e22ce" stroke="#7e22ce"/><text x="700" y="249" text-anchor="end" font-size="21" fill="#1a2e4a">0.403793</text><text x="380" y="321" text-anchor="middle" font-size="18" fill="#1a2e4a">An upper bound is not the actual probability; check its conditions.</text></g></svg>