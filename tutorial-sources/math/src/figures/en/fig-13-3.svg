<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 375" role="img" aria-label="A defective half-eigenvalue map first amplifies but eventually decays; a unit defective map produces unbounded (k,1)."><title>Geometric and polynomial factors in defective powers</title><desc>A defective half-eigenvalue map first amplifies but eventually decays; a unit defective map produces unbounded (k,1).</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#2563eb"/></marker></defs><rect width="760" height="375" fill="white"/><g font-family="system-ui,Segoe UI,Microsoft YaHei,sans-serif"><text x="380" y="30" text-anchor="middle" font-size="20" fill="#1a2e4a">Spectral boundary and transients: one-step norms do not tell all</text><rect x="25" y="70" width="345" height="235" rx="10" fill="#f0f9ff" stroke="#0ea5e9"/><rect x="395" y="70" width="340" height="235" rx="10" fill="#fff7ed" stroke="#c2410c"/><text x="197" y="112" text-anchor="middle" font-size="22" fill="#1a2e4a">B=[[0.5,3],[0,0.5]]</text><text x="197" y="158" text-anchor="middle" font-size="25" fill="#1a2e4a">ρ=0.5</text><text x="197" y="208" text-anchor="middle" font-size="20" fill="#1a2e4a">e₀=(0,1) → e₁=(3,0.5)</text><text x="197" y="256" text-anchor="middle" font-size="18" fill="#1a2e4a">First amplification, eventual decay</text><text x="565" y="112" text-anchor="middle" font-size="22" fill="#1a2e4a">J=[[1,1],[0,1]]</text><text x="565" y="158" text-anchor="middle" font-size="25" fill="#1a2e4a">ρ=1</text><text x="565" y="208" text-anchor="middle" font-size="23" fill="#1a2e4a">Jᵏ(0,1)=(k,1)</text><text x="565" y="256" text-anchor="middle" font-size="18" fill="#1a2e4a">Unit defective block: unbounded</text><text x="380" y="342" text-anchor="middle" font-size="20" fill="#1a2e4a">When N²=0: (λI+N)ᵏ=λᵏI+kλᵏ⁻¹N for k≥1.</text></g></svg>