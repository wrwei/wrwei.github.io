<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 350" role="img" aria-label="A fixed parameter generates random data, then a rule produces an estimate; sampling laws repeat data, while the posterior fixes data and conditions a prior parameter law."><title>Estimation and two distributions</title><desc>A fixed parameter generates random data, then a rule produces an estimate; sampling laws repeat data, while the posterior fixes data and conditions a prior parameter law.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#2563eb"/></marker></defs><rect width="760" height="350" fill="white"/><g font-family="system-ui,Segoe UI,Microsoft YaHei,sans-serif"><text x="380" y="30" text-anchor="middle" font-size="23" fill="#1a2e4a">What is fixed, and what is repeated?</text><rect x="30" y="67" width="190" height="73" rx="10" fill="#f0f9ff" stroke="#0ea5e9"/><text x="125" y="100" text-anchor="middle" font-size="21" fill="#1a2e4a">Fixed parameter θ</text><text x="125" y="126" text-anchor="middle" font-size="20" fill="#1a2e4a">P_θ</text><path d="M225,103L283,103" fill="none" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="290" y="67" width="180" height="73" rx="10" fill="#f0f9ff" stroke="#0ea5e9"/><text x="380" y="111" text-anchor="middle" font-size="22" fill="#1a2e4a">Random data X</text><path d="M475,103L533,103" fill="none" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="540" y="67" width="190" height="73" rx="10" fill="#f0f9ff" stroke="#0ea5e9"/><text x="635" y="111" text-anchor="middle" font-size="22" fill="#1a2e4a">T(X) → t</text><text x="380" y="182" text-anchor="middle" font-size="22" fill="#1a2e4a">Sampling law: fix θ, generate new X.</text><rect x="30" y="221" width="700" height="74" rx="10" fill="#faf5ff" stroke="#7e22ce"/><text x="380" y="253" text-anchor="middle" font-size="20" fill="#1a2e4a">Posterior: fix observed x, condition the parameter law.</text><text x="380" y="282" text-anchor="middle" font-size="21" fill="#1a2e4a">π(θ|x) ∝ L(θ;x)π(θ)</text></g></svg>