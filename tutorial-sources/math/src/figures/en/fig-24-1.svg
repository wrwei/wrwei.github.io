<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 360" role="img" aria-label="Three model mean variances are sigma squared over N, over independent cluster count m, and sigma squared; copied rows do not add independent information."><title>Mean variance under independence and copying</title><desc>Three model mean variances are sigma squared over N, over independent cluster count m, and sigma squared; copied rows do not add independent information.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#2563eb"/></marker></defs><rect width="760" height="360" fill="white"/><g font-family="system-ui,Segoe UI,Microsoft YaHei,sans-serif"><text x="380" y="30" text-anchor="middle" font-size="23" fill="#1a2e4a">Rows and independent draws can differ</text><rect x="30" y="62" width="700" height="65" rx="10" fill="#f0fdf4" stroke="#0ea5e9"/><text x="55" y="89" text-anchor="start" font-size="21" fill="#1a2e4a">N IID draws</text><text x="700" y="113" text-anchor="end" font-size="21" fill="#1a2e4a">Var(M) = σ²/N</text><rect x="30" y="144" width="700" height="65" rx="10" fill="#fff7ed" stroke="#0ea5e9"/><text x="55" y="171" text-anchor="start" font-size="21" fill="#1a2e4a">m independent draws, b copies each</text><text x="700" y="195" text-anchor="end" font-size="21" fill="#1a2e4a">Var(M) = σ²/m = bσ²/N</text><rect x="30" y="226" width="700" height="65" rx="10" fill="#fff7ed" stroke="#0ea5e9"/><text x="55" y="253" text-anchor="start" font-size="21" fill="#1a2e4a">One draw copied N times</text><text x="700" y="277" text-anchor="end" font-size="21" fill="#1a2e4a">Var(M) = σ²</text><text x="380" y="334" text-anchor="middle" font-size="19" fill="#1a2e4a">Adding copies does not remove covariance.</text></g></svg>