<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 340" role="img" aria-label="Vector (2,3) has first-axis component (2,0) and perpendicular remainder (0,3). The dot product with the first unit axis is two."><title>A component and orthogonal remainder</title><desc>Vector (2,3) has first-axis component (2,0) and perpendicular remainder (0,3). The dot product with the first unit axis is two.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#2563eb"/></marker></defs><rect width="760" height="340" fill="white"/><g font-family="system-ui,Segoe UI,Microsoft YaHei,sans-serif"><text x="380" y="30" text-anchor="middle" font-size="21" fill="#1a2e4a">The component along the first unit axis is two</text><path d="M180,260L300,80" fill="none" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arrow)"/><text x="310" y="75" text-anchor="start" font-size="21" fill="#1a2e4a">w = (2,3)</text><path d="M180,260L300,260" fill="none" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M300,80V260" stroke="#15803d" stroke-width="3" stroke-dasharray="7 5"/><text x="240" y="298" text-anchor="middle" font-size="21" fill="#1a2e4a">2e₁ = (2,0)</text><text x="320" y="178" text-anchor="start" font-size="21" fill="#1a2e4a">(0,3)</text><text x="160" y="275" text-anchor="start" font-size="20" fill="#1a2e4a">0</text><path d="M284,260V244H300" fill="none" stroke="#475569" stroke-width="2"/><rect x="460" y="100" width="250" height="150" rx="10" fill="#f0f9ff" stroke="#0ea5e9"/><text x="585" y="147" text-anchor="middle" font-size="25" fill="#1a2e4a">w·e₁ = 2</text><text x="585" y="202" text-anchor="middle" font-size="23" fill="#1a2e4a">(0,3)·e₁ = 0</text></g></svg>