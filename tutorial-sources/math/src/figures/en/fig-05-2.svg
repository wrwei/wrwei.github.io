<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 340" role="img" aria-label="AB and BA, AC and CA, BC and CB each merge to one subset. Every subset has two representations."><title>Forgetting order to obtain subsets</title><desc>AB and BA, AC and CA, BC and CB each merge to one subset. Every subset has two representations.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#2563eb"/></marker></defs><rect width="760" height="340" fill="white"/><g font-family="system-ui,Segoe UI,Microsoft YaHei,sans-serif"><text x="200" y="35" text-anchor="middle" font-size="20" fill="#1a2e4a">Ordered representations</text><text x="570" y="35" text-anchor="middle" font-size="20" fill="#1a2e4a">Unordered outcomes</text><rect x="45" y="65" width="310" height="58" rx="10" fill="#f0f9ff" stroke="#0ea5e9"/><text x="200" y="102" text-anchor="middle" font-size="25" fill="#1a2e4a">AB, BA</text><path d="M360,94L440,94" fill="none" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="450" y="65" width="245" height="58" rx="10" fill="#f0fdf4" stroke="#15803d"/><text x="570" y="102" text-anchor="middle" font-size="25" fill="#1a2e4a">{A, B}</text><rect x="45" y="143" width="310" height="58" rx="10" fill="#f0f9ff" stroke="#0ea5e9"/><text x="200" y="180" text-anchor="middle" font-size="25" fill="#1a2e4a">AC, CA</text><path d="M360,172L440,172" fill="none" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="450" y="143" width="245" height="58" rx="10" fill="#f0fdf4" stroke="#15803d"/><text x="570" y="180" text-anchor="middle" font-size="25" fill="#1a2e4a">{A, C}</text><rect x="45" y="221" width="310" height="58" rx="10" fill="#f0f9ff" stroke="#0ea5e9"/><text x="200" y="258" text-anchor="middle" font-size="25" fill="#1a2e4a">BC, CB</text><path d="M360,250L440,250" fill="none" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="450" y="221" width="245" height="58" rx="10" fill="#f0fdf4" stroke="#15803d"/><text x="570" y="258" text-anchor="middle" font-size="25" fill="#1a2e4a">{B, C}</text></g></svg>