<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 350" role="img" aria-label="The D row has 900 positives and 100 negatives, not-D has 4,950 positives and 94,050 negatives; sensitivity divides by1,000, posterior by5,850, and positive mass is0.0585."><title>Different sensitivity and posterior denominators</title><desc>The D row has 900 positives and 100 negatives, not-D has 4,950 positives and 94,050 negatives; sensitivity divides by1,000, posterior by5,850, and positive mass is0.0585.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#2563eb"/></marker></defs><rect width="760" height="350" fill="white"/><g font-family="system-ui,Segoe UI,Microsoft YaHei,sans-serif"><text x="380" y="30" text-anchor="middle" font-size="24" fill="#1a2e4a">Model-expected counts per100,000 records</text><text x="320" y="88" text-anchor="middle" font-size="22" fill="#1a2e4a">Positive +</text><text x="560" y="88" text-anchor="middle" font-size="22" fill="#1a2e4a">Negative −</text><text x="85" y="156" text-anchor="middle" font-size="22" fill="#1a2e4a">D</text><rect x="200" y="110" width="225" height="64" rx="10" fill="#fff7ed" stroke="#c2410c"/><rect x="445" y="110" width="225" height="64" rx="10" fill="#f0f9ff" stroke="#0ea5e9"/><text x="312" y="153" text-anchor="middle" font-size="25" fill="#1a2e4a">900</text><text x="557" y="153" text-anchor="middle" font-size="25" fill="#1a2e4a">100</text><text x="85" y="236" text-anchor="middle" font-size="22" fill="#1a2e4a">Not D</text><rect x="200" y="190" width="225" height="64" rx="10" fill="#fff7ed" stroke="#c2410c"/><rect x="445" y="190" width="225" height="64" rx="10" fill="#f0f9ff" stroke="#0ea5e9"/><text x="312" y="233" text-anchor="middle" font-size="25" fill="#1a2e4a">4,950</text><text x="557" y="233" text-anchor="middle" font-size="25" fill="#1a2e4a">94,050</text><text x="380" y="289" text-anchor="middle" font-size="21" fill="#1a2e4a">P(+|D)=900/1,000=.9</text><text x="380" y="329" text-anchor="middle" font-size="21" fill="#1a2e4a">P(D|+)=900/5,850=2/13≈.153846</text></g></svg>