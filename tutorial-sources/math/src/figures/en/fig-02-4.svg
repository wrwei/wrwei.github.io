<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 340" role="img" aria-label="Four Boolean rows exhaust two proposition letters. A finite interval does not exhaust all integers."><title>Exhaustion and finite sampling</title><desc>Four Boolean rows exhaust two proposition letters. A finite interval does not exhaust all integers.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#2563eb"/></marker></defs><rect width="760" height="340" fill="white"/><g font-family="system-ui,Segoe UI,Microsoft YaHei,sans-serif"><rect x="35" y="40" width="320" height="245" rx="10" fill="#f0f9ff" stroke="#0ea5e9"/><text x="195" y="76" text-anchor="middle" font-size="20" fill="#1a2e4a">Finite Boolean domain</text><text x="195" y="115" text-anchor="middle" font-size="21" fill="#1a2e4a">FF, FT, TF, TT</text><text x="195" y="165" text-anchor="middle" font-size="18" fill="#1a2e4a">Check all four rows</text><text x="195" y="211" text-anchor="middle" font-size="17" fill="#1a2e4a">Can establish validity</text><rect x="405" y="40" width="320" height="245" rx="10" fill="#fff7ed" stroke="#c2410c"/><text x="565" y="76" text-anchor="middle" font-size="20" fill="#1a2e4a">Infinite integer domain</text><text x="565" y="115" text-anchor="middle" font-size="18" fill="#1a2e4a">…, −2, −1, 0, 1, 2, …</text><text x="565" y="165" text-anchor="middle" font-size="18" fill="#1a2e4a">Check a finite interval</text><text x="565" y="211" text-anchor="middle" font-size="17" fill="#1a2e4a">Other inputs remain open</text></g></svg>