<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 365" role="img" aria-label="Four fair-bit outcomes each have mass one-quarter; three events each have mass one-half and every pair one-quarter, but no row has all three indicators one."><title>Xor pairwise but not mutual independence</title><desc>Four fair-bit outcomes each have mass one-quarter; three events each have mass one-half and every pair one-quarter, but no row has all three indicators one.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#2563eb"/></marker></defs><rect width="760" height="365" fill="white"/><g font-family="system-ui,Segoe UI,Microsoft YaHei,sans-serif"><text x="380" y="30" text-anchor="middle" font-size="24" fill="#1a2e4a">Every pair independent, the triple dependent</text><text x="110" y="84" text-anchor="middle" font-size="18" fill="#1a2e4a">Outcome (X,Y)</text><text x="290" y="84" text-anchor="middle" font-size="20" fill="#1a2e4a">A: X=1</text><text x="470" y="84" text-anchor="middle" font-size="20" fill="#1a2e4a">B: Y=1</text><text x="650" y="84" text-anchor="middle" font-size="20" fill="#1a2e4a">C: xor=1</text><rect x="30" y="100" width="700" height="38" rx="10" fill="#f0f9ff" stroke="#0ea5e9"/><text x="110" y="126" text-anchor="middle" font-size="21" fill="#1a2e4a">(0,0)</text><text x="290" y="126" text-anchor="middle" font-size="21" fill="#1a2e4a">0</text><text x="470" y="126" text-anchor="middle" font-size="21" fill="#1a2e4a">0</text><text x="650" y="126" text-anchor="middle" font-size="21" fill="#1a2e4a">0</text><rect x="30" y="143" width="700" height="38" rx="10" fill="#f0f9ff" stroke="#0ea5e9"/><text x="110" y="169" text-anchor="middle" font-size="21" fill="#1a2e4a">(0,1)</text><text x="290" y="169" text-anchor="middle" font-size="21" fill="#1a2e4a">0</text><text x="470" y="169" text-anchor="middle" font-size="21" fill="#1a2e4a">1</text><text x="650" y="169" text-anchor="middle" font-size="21" fill="#1a2e4a">1</text><rect x="30" y="186" width="700" height="38" rx="10" fill="#f0f9ff" stroke="#0ea5e9"/><text x="110" y="212" text-anchor="middle" font-size="21" fill="#1a2e4a">(1,0)</text><text x="290" y="212" text-anchor="middle" font-size="21" fill="#1a2e4a">1</text><text x="470" y="212" text-anchor="middle" font-size="21" fill="#1a2e4a">0</text><text x="650" y="212" text-anchor="middle" font-size="21" fill="#1a2e4a">1</text><rect x="30" y="229" width="700" height="38" rx="10" fill="#f0f9ff" stroke="#0ea5e9"/><text x="110" y="255" text-anchor="middle" font-size="21" fill="#1a2e4a">(1,1)</text><text x="290" y="255" text-anchor="middle" font-size="21" fill="#1a2e4a">1</text><text x="470" y="255" text-anchor="middle" font-size="21" fill="#1a2e4a">1</text><text x="650" y="255" text-anchor="middle" font-size="21" fill="#1a2e4a">0</text><text x="380" y="305" text-anchor="middle" font-size="19" fill="#1a2e4a">Each marginal1/2; each pair joint1/4; triple joint0≠1/8.</text><text x="380" y="337" text-anchor="middle" font-size="18" fill="#1a2e4a">Each of the four outcomes has mass1/4.</text></g></svg>