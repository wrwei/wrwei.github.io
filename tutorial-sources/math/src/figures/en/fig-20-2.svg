<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 350" role="img" aria-label="Separate rows check primal feasibility, nonnegative inequality multipliers, individual complementarity and the full Lagrangian gradient; active need not mean positive price."><title>Four KKT conditions</title><desc>Separate rows check primal feasibility, nonnegative inequality multipliers, individual complementarity and the full Lagrangian gradient; active need not mean positive price.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#2563eb"/></marker></defs><rect width="760" height="350" fill="white"/><g font-family="system-ui,Segoe UI,Microsoft YaHei,sans-serif"><text x="380" y="30" text-anchor="middle" font-size="24" fill="#1a2e4a">A complete KKT certificate has four lines</text><rect x="40" y="64" width="680" height="45" rx="10" fill="#f0f9ff" stroke="#0ea5e9"/><text x="60" y="94" text-anchor="start" font-size="20" fill="#1a2e4a">Primal feasibility</text><text x="410" y="94" text-anchor="start" font-size="18" fill="#1a2e4a">g≤0; h=0</text><rect x="40" y="116" width="680" height="45" rx="10" fill="#f0f9ff" stroke="#0ea5e9"/><text x="60" y="146" text-anchor="start" font-size="20" fill="#1a2e4a">Dual feasibility</text><text x="410" y="146" text-anchor="start" font-size="18" fill="#1a2e4a">λ≥0; ν unrestricted</text><rect x="40" y="168" width="680" height="45" rx="10" fill="#f0f9ff" stroke="#0ea5e9"/><text x="60" y="198" text-anchor="start" font-size="20" fill="#1a2e4a">Complementarity</text><text x="410" y="198" text-anchor="start" font-size="18" fill="#1a2e4a">λᵢgᵢ=0</text><rect x="40" y="220" width="680" height="45" rx="10" fill="#f0f9ff" stroke="#0ea5e9"/><text x="60" y="250" text-anchor="start" font-size="20" fill="#1a2e4a">Stationarity</text><text x="410" y="250" text-anchor="start" font-size="18" fill="#1a2e4a">∇f+Σλᵢ∇gᵢ+Σνⱼ∇hⱼ=0</text><text x="380" y="324" text-anchor="middle" font-size="17" fill="#1a2e4a">Active can mean zero price; convex sufficiency differs from qualified necessity.</text></g></svg>