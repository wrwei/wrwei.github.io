<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 365" role="img" aria-label="Starting capacity one, nine append costs are 1, 2, 3, 1, 5, 1, 1, 1, 9, totalling 24."><title>Copy bursts and aggregate cost</title><desc>Starting capacity one, nine append costs are 1, 2, 3, 1, 5, 1, 1, 1, 9, totalling 24.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#2563eb"/></marker></defs><rect width="760" height="365" fill="white"/><g font-family="system-ui,Segoe UI,Microsoft YaHei,sans-serif"><text x="380" y="30" text-anchor="middle" font-size="19" fill="#1a2e4a">Append: write one item, plus old-item copies at resize</text><rect x="40" y="217" width="45" height="18" fill="#c2410c"/><text x="62" y="261" text-anchor="middle" font-size="17" fill="#1a2e4a">1</text><text x="62" y="204" text-anchor="middle" font-size="16" fill="#1a2e4a">1</text><rect x="116" y="199" width="45" height="36" fill="#c2410c"/><text x="138" y="261" text-anchor="middle" font-size="17" fill="#1a2e4a">2</text><text x="138" y="186" text-anchor="middle" font-size="16" fill="#1a2e4a">2</text><rect x="192" y="181" width="45" height="54" fill="#c2410c"/><text x="214" y="261" text-anchor="middle" font-size="17" fill="#1a2e4a">3</text><text x="214" y="168" text-anchor="middle" font-size="16" fill="#1a2e4a">3</text><rect x="268" y="217" width="45" height="18" fill="#c2410c"/><text x="290" y="261" text-anchor="middle" font-size="17" fill="#1a2e4a">4</text><text x="290" y="204" text-anchor="middle" font-size="16" fill="#1a2e4a">1</text><rect x="344" y="145" width="45" height="90" fill="#c2410c"/><text x="366" y="261" text-anchor="middle" font-size="17" fill="#1a2e4a">5</text><text x="366" y="132" text-anchor="middle" font-size="16" fill="#1a2e4a">5</text><rect x="420" y="217" width="45" height="18" fill="#c2410c"/><text x="442" y="261" text-anchor="middle" font-size="17" fill="#1a2e4a">6</text><text x="442" y="204" text-anchor="middle" font-size="16" fill="#1a2e4a">1</text><rect x="496" y="217" width="45" height="18" fill="#c2410c"/><text x="518" y="261" text-anchor="middle" font-size="17" fill="#1a2e4a">7</text><text x="518" y="204" text-anchor="middle" font-size="16" fill="#1a2e4a">1</text><rect x="572" y="217" width="45" height="18" fill="#c2410c"/><text x="594" y="261" text-anchor="middle" font-size="17" fill="#1a2e4a">8</text><text x="594" y="204" text-anchor="middle" font-size="16" fill="#1a2e4a">1</text><rect x="648" y="73" width="45" height="162" fill="#c2410c"/><text x="670" y="261" text-anchor="middle" font-size="17" fill="#1a2e4a">9</text><text x="670" y="60" text-anchor="middle" font-size="16" fill="#1a2e4a">9</text><text x="380" y="292" text-anchor="middle" font-size="16" fill="#1a2e4a">Append number (bar height = copies + new write)</text><text x="380" y="331" text-anchor="middle" font-size="18" fill="#1a2e4a">Nine appends cost 24 &lt; 27; append nine alone costs nine.</text></g></svg>