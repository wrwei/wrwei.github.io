<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 340" role="img" aria-label="Seventeen dots form two groups of seven and three left over. Negative seventeen has quotient negative three and remainder four under the same range."><title>Unique quotient and remainder</title><desc>Seventeen dots form two groups of seven and three left over. Negative seventeen has quotient negative three and remainder four under the same range.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#2563eb"/></marker></defs><rect width="760" height="340" fill="white"/><g font-family="system-ui,Segoe UI,Microsoft YaHei,sans-serif"><text x="380" y="35" text-anchor="middle" font-size="22" fill="#1a2e4a">Quotient and remainder: 0 ≤ r &lt; 7</text><rect x="50" y="80" width="225" height="110" rx="10" fill="#f0f9ff" stroke="#0ea5e9"/><circle cx="75" cy="120" r="8" fill="#2563eb"/><circle cx="103" cy="120" r="8" fill="#2563eb"/><circle cx="131" cy="120" r="8" fill="#2563eb"/><circle cx="159" cy="120" r="8" fill="#2563eb"/><circle cx="187" cy="120" r="8" fill="#2563eb"/><circle cx="215" cy="120" r="8" fill="#2563eb"/><circle cx="243" cy="120" r="8" fill="#2563eb"/><text x="160" y="168" text-anchor="middle" font-size="24" fill="#1a2e4a">7</text><rect x="305" y="80" width="225" height="110" rx="10" fill="#f0f9ff" stroke="#0ea5e9"/><circle cx="330" cy="120" r="8" fill="#2563eb"/><circle cx="358" cy="120" r="8" fill="#2563eb"/><circle cx="386" cy="120" r="8" fill="#2563eb"/><circle cx="414" cy="120" r="8" fill="#2563eb"/><circle cx="442" cy="120" r="8" fill="#2563eb"/><circle cx="470" cy="120" r="8" fill="#2563eb"/><circle cx="498" cy="120" r="8" fill="#2563eb"/><text x="415" y="168" text-anchor="middle" font-size="24" fill="#1a2e4a">7</text><rect x="560" y="80" width="150" height="110" rx="10" fill="#fff7ed" stroke="#c2410c"/><circle cx="600" cy="120" r="8" fill="#c2410c"/><circle cx="632" cy="120" r="8" fill="#c2410c"/><circle cx="664" cy="120" r="8" fill="#c2410c"/><text x="635" y="168" text-anchor="middle" font-size="24" fill="#1a2e4a">3</text><text x="380" y="237" text-anchor="middle" font-size="25" fill="#1a2e4a">17 = 2 × 7 + 3</text><text x="380" y="300" text-anchor="middle" font-size="25" fill="#1a2e4a">−17 = (−3) × 7 + 4</text></g></svg>