<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 360" role="img" aria-label="The CDF jumps to0.3 at zero and rises linearly to one; density0.7 represents only the continuous component."><title>Mixed-distribution CDF</title><desc>The CDF jumps to0.3 at zero and rises linearly to one; density0.7 represents only the continuous component.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#2563eb"/></marker></defs><rect width="760" height="360" fill="white"/><g font-family="system-ui,Segoe UI,Microsoft YaHei,sans-serif"><text x="380" y="30" text-anchor="middle" font-size="23" fill="#1a2e4a">A CDF retains atoms and continuous parts</text><path d="M110,275H650M145,60V285" stroke="#94a3b8"/><path d="M122.5,275H145V222.5L595,100H640" stroke="#2563eb" stroke-width="4" fill="none"/><circle cx="145" cy="275" r="5" fill="white" stroke="#2563eb"/><circle cx="145" cy="222.5" r="5" fill="#2563eb"/><text x="105" y="228.5" text-anchor="end" font-size="18" fill="#1a2e4a">.3</text><text x="105" y="106" text-anchor="end" font-size="18" fill="#1a2e4a">1</text><text x="145" y="305" text-anchor="middle" font-size="19" fill="#1a2e4a">0</text><text x="595" y="305" text-anchor="middle" font-size="19" fill="#1a2e4a">1</text><text x="400" y="175" text-anchor="middle" font-size="22" fill="#1a2e4a">F(t)=.3+.7t</text><text x="380" y="335" text-anchor="middle" font-size="18" fill="#1a2e4a">Atom at0: .3; density on(0,1): .7; continuous mass only .7.</text></g></svg>