<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 395" role="img" aria-label="B-by-d input times d-by-o weights gives B-by-o output. Flat o bias broadcasts across rows; a column bias can add to rows incorrectly."><title>Dimensions in a batched matrix product</title><desc>B-by-d input times d-by-o weights gives B-by-o output. Flat o bias broadcasts across rows; a column bias can add to rows incorrectly.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#2563eb"/></marker></defs><rect width="760" height="395" fill="white"/><g font-family="system-ui,Segoe UI,Microsoft YaHei,sans-serif"><text x="380" y="30" text-anchor="middle" font-size="20" fill="#1a2e4a">Row-batch convention: each row uses the same affine map</text><rect x="25" y="105" width="170" height="135" rx="10" fill="#f0f9ff" stroke="#0ea5e9"/><text x="110" y="148" text-anchor="middle" font-size="26" fill="#1a2e4a">X</text><text x="110" y="205" text-anchor="middle" font-size="24" fill="#1a2e4a">B × d</text><rect x="285" y="105" width="150" height="135" rx="10" fill="#f0f9ff" stroke="#0ea5e9"/><text x="360" y="148" text-anchor="middle" font-size="26" fill="#1a2e4a">W = Mᵀ</text><text x="360" y="205" text-anchor="middle" font-size="24" fill="#1a2e4a">d × o</text><rect x="555" y="105" width="180" height="135" rx="10" fill="#f0f9ff" stroke="#0ea5e9"/><text x="645" y="148" text-anchor="middle" font-size="26" fill="#1a2e4a">Y</text><text x="645" y="205" text-anchor="middle" font-size="24" fill="#1a2e4a">B × o</text><text x="225" y="177" text-anchor="middle" font-size="35" fill="#1a2e4a">@</text><path d="M445,175L540,175" fill="none" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arrow)"/><text x="380" y="285" text-anchor="middle" font-size="20" fill="#1a2e4a">Inner dimension d contracts; bias (o,) broadcasts over batch B.</text><text x="380" y="330" text-anchor="middle" font-size="28" fill="#1a2e4a">Y = XW + b</text><text x="380" y="369" text-anchor="middle" font-size="17" fill="#c2410c">Bias (o,1) can succeed when B=o while adding along the wrong axis.</text></g></svg>