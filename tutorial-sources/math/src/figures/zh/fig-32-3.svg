<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 350" role="img" aria-label="均值似然与无罚截距推导，稳定原 logit 求值，以及同一归约惩罚的数值导数应一致。"><title>目标、稳定求值与检查一致性</title><desc>均值似然与无罚截距推导，稳定原 logit 求值，以及同一归约惩罚的数值导数应一致。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#2563eb"/></marker></defs><rect width="760" height="350" fill="white"/><g font-family="system-ui,Segoe UI,Microsoft YaHei,sans-serif"><text x="380" y="30" text-anchor="middle" font-size="23" fill="#1a2e4a">三个实现必须是同一个目标</text><rect x="35" y="65" width="690" height="65" rx="10" fill="#f0f9ff" stroke="#0ea5e9"/><text x="380" y="105" text-anchor="middle" font-size="21" fill="#1a2e4a">推导：均值 NLL + λ‖w‖²/2，b 不罚</text><rect x="35" y="145" width="690" height="65" rx="10" fill="#f0f9ff" stroke="#0ea5e9"/><text x="380" y="185" text-anchor="middle" font-size="21" fill="#1a2e4a">求值：稳定 logit 损失，不裁剪模型</text><rect x="35" y="225" width="690" height="65" rx="10" fill="#f0f9ff" stroke="#0ea5e9"/><text x="380" y="265" text-anchor="middle" font-size="21" fill="#1a2e4a">检查：同样归约和惩罚的平滑差分</text><text x="380" y="332" text-anchor="middle" font-size="19" fill="#1a2e4a">遗漏除 n 是公式错误，不能靠更小 h 修复。</text></g></svg>