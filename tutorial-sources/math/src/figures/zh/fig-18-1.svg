<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 350" role="img" aria-label="两轴函数为零，原点两偏导零，对角接近时值始终二分之一，所以原点不连续。"><title>偏导与全可导反例</title><desc>两轴函数为零，原点两偏导零，对角接近时值始终二分之一，所以原点不连续。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#2563eb"/></marker></defs><rect width="760" height="350" fill="white"/><g font-family="system-ui,Segoe UI,Microsoft YaHei,sans-serif"><text x="380" y="30" text-anchor="middle" font-size="24" fill="#1a2e4a">轴上的偏导可以遗漏对角路径</text><rect x="35" y="65" width="325" height="215" rx="10" fill="#f0f9ff" stroke="#0ea5e9"/><rect x="400" y="65" width="325" height="215" rx="10" fill="#f0f9ff" stroke="#0ea5e9"/><text x="195" y="100" text-anchor="middle" font-size="21" fill="#1a2e4a">坐标轴 x=0 或 y=0</text><text x="195" y="150" text-anchor="middle" font-size="27" fill="#1a2e4a">f=0</text><text x="195" y="220" text-anchor="middle" font-size="22" fill="#1a2e4a">∂ₓf(0)=∂ᵧf(0)=0</text><text x="562" y="100" text-anchor="middle" font-size="21" fill="#1a2e4a">对角 x=y=t≠0</text><text x="562" y="150" text-anchor="middle" font-size="27" fill="#1a2e4a">f=1/2</text><text x="562" y="220" text-anchor="middle" font-size="20" fill="#1a2e4a">不连续，更非全可导</text><text x="380" y="325" text-anchor="middle" font-size="21" fill="#1a2e4a">f(x,y)=xy/(x²+y²); f(0,0)=0</text></g></svg>