<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 350" role="img" aria-label="四行分别检查原始可行、非负不等式乘子、逐项互补及完整拉格朗日梯度，活跃不必正价格。"><title>四项KKT条件</title><desc>四行分别检查原始可行、非负不等式乘子、逐项互补及完整拉格朗日梯度，活跃不必正价格。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#2563eb"/></marker></defs><rect width="760" height="350" fill="white"/><g font-family="system-ui,Segoe UI,Microsoft YaHei,sans-serif"><text x="380" y="30" text-anchor="middle" font-size="24" fill="#1a2e4a">完整KKT证书有四行</text><rect x="40" y="64" width="680" height="45" rx="10" fill="#f0f9ff" stroke="#0ea5e9"/><text x="60" y="94" text-anchor="start" font-size="20" fill="#1a2e4a">原始可行</text><text x="410" y="94" text-anchor="start" font-size="18" fill="#1a2e4a">g≤0; h=0</text><rect x="40" y="116" width="680" height="45" rx="10" fill="#f0f9ff" stroke="#0ea5e9"/><text x="60" y="146" text-anchor="start" font-size="20" fill="#1a2e4a">对偶可行</text><text x="410" y="146" text-anchor="start" font-size="18" fill="#1a2e4a">λ≥0; ν任意</text><rect x="40" y="168" width="680" height="45" rx="10" fill="#f0f9ff" stroke="#0ea5e9"/><text x="60" y="198" text-anchor="start" font-size="20" fill="#1a2e4a">互补松弛</text><text x="410" y="198" text-anchor="start" font-size="18" fill="#1a2e4a">λᵢgᵢ=0</text><rect x="40" y="220" width="680" height="45" rx="10" fill="#f0f9ff" stroke="#0ea5e9"/><text x="60" y="250" text-anchor="start" font-size="20" fill="#1a2e4a">驻点</text><text x="410" y="250" text-anchor="start" font-size="18" fill="#1a2e4a">∇f+Σλᵢ∇gᵢ+Σνⱼ∇hⱼ=0</text><text x="380" y="324" text-anchor="middle" font-size="17" fill="#1a2e4a">活跃可有零乘子；凸充分性与资格必要性分开。</text></g></svg>