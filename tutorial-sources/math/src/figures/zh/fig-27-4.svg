<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 350" role="img" aria-label="同一原字符串概率十六分之一，两词元平均 log 四困惑度四，四词元平均 log 二困惑度二；概率没有改善。"><title>困惑度分母与单位</title><desc>同一原字符串概率十六分之一，两词元平均 log 四困惑度四，四词元平均 log 二困惑度二；概率没有改善。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#2563eb"/></marker></defs><rect width="760" height="350" fill="white"/><g font-family="system-ui,Segoe UI,Microsoft YaHei,sans-serif"><text x="380" y="30" text-anchor="middle" font-size="23" fill="#1a2e4a">同一字符串概率，不同平均单位</text><text x="380" y="74" text-anchor="middle" font-size="22" fill="#1a2e4a">q(raw string)=1/16; total NLL=log16</text><rect x="30" y="104" width="700" height="68" rx="10" fill="#f0f9ff" stroke="#0ea5e9"/><text x="55" y="144" text-anchor="start" font-size="21" fill="#1a2e4a">2 个计分词元</text><text x="700" y="144" text-anchor="end" font-size="21" fill="#1a2e4a">mean=log4; perplexity=4</text><rect x="30" y="190" width="700" height="68" rx="10" fill="#faf5ff" stroke="#0ea5e9"/><text x="55" y="230" text-anchor="start" font-size="21" fill="#1a2e4a">4 个计分词元</text><text x="700" y="230" text-anchor="end" font-size="21" fill="#1a2e4a">mean=log2; perplexity=2</text><text x="380" y="311" text-anchor="middle" font-size="19" fill="#1a2e4a">匹配分词、底、位置与上下文后再比较。</text></g></svg>