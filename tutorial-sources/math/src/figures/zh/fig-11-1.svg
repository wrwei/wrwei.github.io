<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 340" role="img" aria-label="u一零、v零一、w一一三条向量张成二维平面，w是u加v，故列表相关。"><title>生成列表与独立方向</title><desc>u一零、v零一、w一一三条向量张成二维平面，w是u加v，故列表相关。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#2563eb"/></marker></defs><rect width="760" height="340" fill="white"/><g font-family="system-ui,Segoe UI,Microsoft YaHei,sans-serif"><text x="380" y="30" text-anchor="middle" font-size="22" fill="#1a2e4a">三条生成向量，两个独立方向</text><path d="M80,255H380M110,285V70" stroke="#94a3b8"/><path d="M110,255L260,255" fill="none" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M110,255L110,105" fill="none" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M110,255L260,105" fill="none" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M260,255V105H110" stroke="#94a3b8" stroke-dasharray="6 5" fill="none"/><text x="275" y="276" text-anchor="start" font-size="20" fill="#1a2e4a">u=(1,0)</text><text x="120" y="88" text-anchor="start" font-size="20" fill="#1a2e4a">v=(0,1)</text><text x="280" y="106" text-anchor="start" font-size="20" fill="#1a2e4a">w=(1,1)</text><rect x="450" y="100" width="270" height="170" rx="10" fill="#f0f9ff" stroke="#0ea5e9"/><text x="585" y="151" text-anchor="middle" font-size="28" fill="#1a2e4a">w = u + v</text><text x="585" y="201" text-anchor="middle" font-size="25" fill="#1a2e4a">u + v − w = 0</text><text x="585" y="244" text-anchor="middle" font-size="20" fill="#1a2e4a">张成 R²；维数二</text></g></svg>