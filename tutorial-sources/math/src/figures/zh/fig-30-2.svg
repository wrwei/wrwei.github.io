<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 350" role="img" aria-label="特征核的二次型为特征和平方非负；对称正对角矩阵一二二一有向量一负一给负二。"><title>特征平方和与负见证</title><desc>特征核的二次型为特征和平方非负；对称正对角矩阵一二二一有向量一负一给负二。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#2563eb"/></marker></defs><rect width="760" height="350" fill="white"/><g font-family="system-ui,Segoe UI,Microsoft YaHei,sans-serif"><text x="380" y="30" text-anchor="middle" font-size="23" fill="#1a2e4a">PSD 的证明，比对称性更强</text><rect x="35" y="65" width="690" height="91" rx="10" fill="#f0f9ff" stroke="#0ea5e9"/><text x="55" y="97" text-anchor="start" font-size="22" fill="#1a2e4a">k(s,t)=φ(s)ᵀφ(t); φ(t)=(1,t)</text><text x="55" y="135" text-anchor="start" font-size="24" fill="#1a2e4a">cᵀKc = ‖Σᵢ cᵢφ(xᵢ)‖² ≥ 0</text><rect x="35" y="185" width="690" height="91" rx="10" fill="#fff7ed" stroke="#c2410c"/><text x="55" y="219" text-anchor="start" font-size="22" fill="#1a2e4a">K=((1,2),(2,1)); c=(1,−1)</text><text x="55" y="257" text-anchor="start" font-size="24" fill="#1a2e4a">cᵀKc = −2</text><text x="380" y="327" text-anchor="middle" font-size="18" fill="#1a2e4a">正对角与对称不能排除负二次型。</text></g></svg>