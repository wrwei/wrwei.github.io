<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 350" role="img" aria-label="左图去心极限二而赋值七，可以改赋二修复；右图左右输出零与一不同，任何零处赋值都无法修复。"><title>可去错配与跳跃</title><desc>左图去心极限二而赋值七，可以改赋二修复；右图左右输出零与一不同，任何零处赋值都无法修复。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#2563eb"/></marker></defs><rect width="760" height="350" fill="white"/><g font-family="system-ui,Segoe UI,Microsoft YaHei,sans-serif"><text x="380" y="30" text-anchor="middle" font-size="23" fill="#1a2e4a">实际值与邻近行为分别检查</text><path d="M55,245H340M150,70V250M420,245H710M565,70V250" stroke="#94a3b8"/><path d="M65,235L325,105" stroke="#2563eb" stroke-width="3"/><circle cx="195" cy="170" r="7" fill="white" stroke="#2563eb" stroke-width="3"/><circle cx="195" cy="100" r="6" fill="#c2410c"/><path d="M435,220H565M565,130H700" stroke="#2563eb" stroke-width="3"/><circle cx="565" cy="220" r="6" fill="white" stroke="#2563eb" stroke-width="2"/><circle cx="565" cy="130" r="6" fill="#2563eb"/><text x="230" y="94" text-anchor="start" font-size="17" fill="#1a2e4a">g(1)=7</text><text x="235" y="170" text-anchor="start" font-size="17" fill="#1a2e4a">lim = 2</text><text x="475" y="210" text-anchor="start" font-size="17" fill="#1a2e4a">0</text><text x="680" y="118" text-anchor="start" font-size="17" fill="#1a2e4a">1</text><text x="195" y="288" text-anchor="middle" font-size="18" fill="#1a2e4a">改点值可以修复</text><text x="565" y="288" text-anchor="middle" font-size="18" fill="#1a2e4a">改点值不能消除跳跃</text><text x="380" y="325" text-anchor="middle" font-size="16" fill="#1a2e4a">左图纵向示意，不按七与二的比例绘制。</text></g></svg>