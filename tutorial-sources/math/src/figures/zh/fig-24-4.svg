<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 350" role="img" aria-label="相同边缘的独立差值方差点四八七五，共同均匀数产生正协方差点二二后，差值方差降至点零四七五；该收益不是普遍结论。"><title>共同随机数的带条件收益</title><desc>相同边缘的独立差值方差点四八七五，共同均匀数产生正协方差点二二后，差值方差降至点零四七五；该收益不是普遍结论。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#2563eb"/></marker></defs><rect width="760" height="350" fill="white"/><g font-family="system-ui,Segoe UI,Microsoft YaHei,sans-serif"><text x="380" y="30" text-anchor="middle" font-size="23" fill="#1a2e4a">保持边缘，再比较差值方差</text><text x="380" y="71" text-anchor="middle" font-size="22" fill="#1a2e4a">Var(A−B) = Var(A)+Var(B)−2Cov(A,B)</text><rect x="30" y="104" width="700" height="78" rx="10" fill="#f0f9ff" stroke="#0ea5e9"/><text x="55" y="135" text-anchor="start" font-size="21" fill="#1a2e4a">独立阈值 .60 与 .55</text><text x="700" y="166" text-anchor="end" font-size="21" fill="#1a2e4a">.24 + .2475 = .4875</text><rect x="30" y="202" width="700" height="87" rx="10" fill="#f0fdf4" stroke="#15803d"/><text x="55" y="235" text-anchor="start" font-size="21" fill="#1a2e4a">共同 U，对内 Cov=.22</text><text x="700" y="272" text-anchor="end" font-size="21" fill="#1a2e4a">.4875 − .44 = .0475</text><text x="380" y="332" text-anchor="middle" font-size="18" fill="#1a2e4a">不同对仍需独立；负 Cov 会增大差值方差。</text></g></svg>