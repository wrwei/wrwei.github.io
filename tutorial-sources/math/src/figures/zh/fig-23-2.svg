<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 365" role="img" aria-label="两行X零一两列Y零二，行和四分之三四分之一，列和八分之五八分之三；列内X一条件分别五分之一三分之一。"><title>精确联合边缘条件表</title><desc>两行X零一两列Y零二，行和四分之三四分之一，列和八分之五八分之三；列内X一条件分别五分之一三分之一。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#2563eb"/></marker></defs><rect width="760" height="365" fill="white"/><g font-family="system-ui,Segoe UI,Microsoft YaHei,sans-serif"><text x="380" y="30" text-anchor="middle" font-size="23" fill="#1a2e4a">联合质量先求和 再按情况归一</text><text x="105" y="85" text-anchor="middle" font-size="20" fill="#1a2e4a">X / Y</text><text x="285" y="85" text-anchor="middle" font-size="20" fill="#1a2e4a">0</text><text x="465" y="85" text-anchor="middle" font-size="20" fill="#1a2e4a">2</text><text x="645" y="85" text-anchor="middle" font-size="20" fill="#1a2e4a">行和</text><rect x="25" y="104" width="710" height="44" rx="10" fill="#f0f9ff" stroke="#0ea5e9"/><text x="105" y="135" text-anchor="middle" font-size="21" fill="#1a2e4a">0</text><text x="285" y="135" text-anchor="middle" font-size="21" fill="#1a2e4a">1/2</text><text x="465" y="135" text-anchor="middle" font-size="21" fill="#1a2e4a">1/4</text><text x="645" y="135" text-anchor="middle" font-size="21" fill="#1a2e4a">3/4</text><rect x="25" y="156" width="710" height="44" rx="10" fill="#f0f9ff" stroke="#0ea5e9"/><text x="105" y="187" text-anchor="middle" font-size="21" fill="#1a2e4a">1</text><text x="285" y="187" text-anchor="middle" font-size="21" fill="#1a2e4a">1/8</text><text x="465" y="187" text-anchor="middle" font-size="21" fill="#1a2e4a">1/8</text><text x="645" y="187" text-anchor="middle" font-size="21" fill="#1a2e4a">1/4</text><rect x="25" y="208" width="710" height="44" rx="10" fill="#fff7ed" stroke="#0ea5e9"/><text x="105" y="239" text-anchor="middle" font-size="21" fill="#1a2e4a">列和</text><text x="285" y="239" text-anchor="middle" font-size="21" fill="#1a2e4a">5/8</text><text x="465" y="239" text-anchor="middle" font-size="21" fill="#1a2e4a">3/8</text><text x="645" y="239" text-anchor="middle" font-size="21" fill="#1a2e4a">1</text><text x="380" y="309" text-anchor="middle" font-size="20" fill="#1a2e4a">P(X=1|Y=0)=1/5; P(X=1|Y=2)=1/3</text><text x="380" y="339" text-anchor="middle" font-size="17" fill="#1a2e4a">条件分母为对应列和，不是原始X边缘。</text></g></svg>