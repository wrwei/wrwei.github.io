<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 365" role="img" aria-label="252、105 经余数 42、21、0，得到 gcd 二十一，贝祖系数负二与五。"><title>欧几里得与贝祖跟踪</title><desc>252、105 经余数 42、21、0，得到 gcd 二十一，贝祖系数负二与五。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#2563eb"/></marker></defs><rect width="760" height="365" fill="white"/><g font-family="system-ui,Segoe UI,Microsoft YaHei,sans-serif"><text x="380" y="35" text-anchor="middle" font-size="19" fill="#1a2e4a">相同共同因数，第二分量严格降</text><rect x="60" y="75" width="640" height="47" rx="10" fill="#f0f9ff" stroke="#0ea5e9"/><text x="380" y="106" text-anchor="middle" font-size="23" fill="#1a2e4a">252 = 2 × 105 + 42</text><rect x="60" y="140" width="640" height="47" rx="10" fill="#f0f9ff" stroke="#0ea5e9"/><text x="380" y="171" text-anchor="middle" font-size="23" fill="#1a2e4a">105 = 2 × 42 + 21</text><rect x="60" y="205" width="640" height="47" rx="10" fill="#f0f9ff" stroke="#0ea5e9"/><text x="380" y="236" text-anchor="middle" font-size="23" fill="#1a2e4a">42 = 2 × 21 + 0</text><text x="380" y="301" text-anchor="middle" font-size="24" fill="#1a2e4a">21 = −2 × 252 + 5 × 105</text><text x="380" y="336" text-anchor="middle" font-size="17" fill="#1a2e4a">回代给证书；不是只看猜测 gcd。</text></g></svg>