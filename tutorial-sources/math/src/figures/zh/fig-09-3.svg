<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 385" role="img" aria-label="最大范数单位边界是正方形，欧几里得圆，曼哈顿菱形，均过坐标单位轴端点。"><title>三种范数的单位球</title><desc>最大范数单位边界是正方形，欧几里得圆，曼哈顿菱形，均过坐标单位轴端点。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#2563eb"/></marker></defs><rect width="760" height="385" fill="white"/><g font-family="system-ui,Segoe UI,Microsoft YaHei,sans-serif"><text x="380" y="28" text-anchor="middle" font-size="19" fill="#1a2e4a">二维单位球：每个边界都表示相应长度一</text><path d="M220,180H540M380,45V335" stroke="#94a3b8"/><rect x="265" y="65" width="230" height="230" fill="none" stroke="#15803d" stroke-width="3"/><circle cx="380" cy="180" r="115" fill="none" stroke="#2563eb" stroke-width="3"/><path d="M380,65L495,180L380,295L265,180z" fill="none" stroke="#c2410c" stroke-width="3"/><text x="380" y="185" text-anchor="start" font-size="16" fill="#1a2e4a">0</text><text x="501" y="174" text-anchor="start" font-size="16" fill="#1a2e4a">1</text><text x="255" y="174" text-anchor="end" font-size="16" fill="#1a2e4a">−1</text><text x="100" y="358" text-anchor="start" font-size="18" fill="#c2410c">曼哈顿：菱形</text><text x="380" y="358" text-anchor="middle" font-size="18" fill="#2563eb">欧几里得：圆</text><text x="670" y="358" text-anchor="end" font-size="18" fill="#15803d">最大：方形</text></g></svg>