<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 395" role="img" aria-label="B乘d的输入乘d乘o的权重得到B乘o输出，形状o的偏置逐行广播，形状o一可能把偏置加到行。"><title>批矩阵乘法的维度</title><desc>B乘d的输入乘d乘o的权重得到B乘o输出，形状o的偏置逐行广播，形状o一可能把偏置加到行。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#2563eb"/></marker></defs><rect width="760" height="395" fill="white"/><g font-family="system-ui,Segoe UI,Microsoft YaHei,sans-serif"><text x="380" y="30" text-anchor="middle" font-size="20" fill="#1a2e4a">行批次约定：每一行独立通过同一个仿射映射</text><rect x="25" y="105" width="170" height="135" rx="10" fill="#f0f9ff" stroke="#0ea5e9"/><text x="110" y="148" text-anchor="middle" font-size="26" fill="#1a2e4a">X</text><text x="110" y="205" text-anchor="middle" font-size="24" fill="#1a2e4a">B × d</text><rect x="285" y="105" width="150" height="135" rx="10" fill="#f0f9ff" stroke="#0ea5e9"/><text x="360" y="148" text-anchor="middle" font-size="26" fill="#1a2e4a">W = Mᵀ</text><text x="360" y="205" text-anchor="middle" font-size="24" fill="#1a2e4a">d × o</text><rect x="555" y="105" width="180" height="135" rx="10" fill="#f0f9ff" stroke="#0ea5e9"/><text x="645" y="148" text-anchor="middle" font-size="26" fill="#1a2e4a">Y</text><text x="645" y="205" text-anchor="middle" font-size="24" fill="#1a2e4a">B × o</text><text x="225" y="177" text-anchor="middle" font-size="35" fill="#1a2e4a">@</text><path d="M445,175L540,175" fill="none" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arrow)"/><text x="380" y="285" text-anchor="middle" font-size="20" fill="#1a2e4a">内维 d 收缩；偏置形状 (o,) 沿批次 B 广播。</text><text x="380" y="330" text-anchor="middle" font-size="28" fill="#1a2e4a">Y = XW + b</text><text x="380" y="369" text-anchor="middle" font-size="17" fill="#c2410c">偏置 (o,1) 在 B=o 时仍可能成功，却加错方向。</text></g></svg>