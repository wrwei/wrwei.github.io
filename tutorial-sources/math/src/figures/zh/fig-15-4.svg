<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 350" role="img" aria-label="原映射零处残差十，乘极小松弛后步长低于阈值，但距一百不动点仍几乎一百。"><title>松弛产生的假精度</title><desc>原映射零处残差十，乘极小松弛后步长低于阈值，但距一百不动点仍几乎一百。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#2563eb"/></marker></defs><rect width="760" height="350" fill="white"/><g font-family="system-ui,Segoe UI,Microsoft YaHei,sans-serif"><text x="380" y="30" text-anchor="middle" font-size="22" fill="#1a2e4a">小步长不自动表示接近解</text><rect x="35" y="65" width="215" height="160" rx="10" fill="#f0f9ff" stroke="#0ea5e9"/><rect x="275" y="65" width="210" height="160" rx="10" fill="#f0f9ff" stroke="#0ea5e9"/><rect x="510" y="65" width="215" height="160" rx="10" fill="#f0f9ff" stroke="#0ea5e9"/><text x="142" y="100" text-anchor="middle" font-size="21" fill="#1a2e4a">当前 x = 0</text><text x="142" y="145" text-anchor="middle" font-size="20" fill="#1a2e4a">原残差 10</text><text x="142" y="190" text-anchor="middle" font-size="18" fill="#1a2e4a">F(x)=.9x+10</text><text x="380" y="100" text-anchor="middle" font-size="21" fill="#1a2e4a">α = 10⁻¹⁰</text><text x="380" y="145" text-anchor="middle" font-size="20" fill="#1a2e4a">应用步长 10⁻⁹</text><text x="380" y="190" text-anchor="middle" font-size="18" fill="#1a2e4a">10⁻⁹ &lt; tol 10⁻⁶</text><text x="617" y="100" text-anchor="middle" font-size="20" fill="#1a2e4a">不动点 x* = 100</text><text x="617" y="145" text-anchor="middle" font-size="20" fill="#1a2e4a">误差近 100</text><text x="617" y="190" text-anchor="middle" font-size="18" fill="#1a2e4a">r/(1−.9) ≈ 100</text><path d="M250,145L275,145" fill="none" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M485,145L510,145" fill="none" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arrow)"/><text x="380" y="277" text-anchor="middle" font-size="20" fill="#1a2e4a">报告原方程残差与已证明误差界。</text><text x="380" y="322" text-anchor="middle" font-size="18" fill="#1a2e4a">使用松弛后，步长阈值的含义发生变化。</text></g></svg>