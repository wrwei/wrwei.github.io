<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 350" role="img" aria-label="n 为 4、8、16 时分别列对数、线性、n log n、平方与指数的精确数值。"><title>增长数量比较</title><desc>n 为 4、8、16 时分别列对数、线性、n log n、平方与指数的精确数值。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#2563eb"/></marker></defs><rect width="760" height="350" fill="white"/><g font-family="system-ui,Segoe UI,Microsoft YaHei,sans-serif"><text x="380" y="30" text-anchor="middle" font-size="19" fill="#1a2e4a">相同 n，不同增长；数值并非运行秒数</text><text x="65" y="78" text-anchor="middle" font-size="19" fill="#1a2e4a">n</text><text x="190" y="78" text-anchor="middle" font-size="19" fill="#1a2e4a">log₂ n</text><text x="315" y="78" text-anchor="middle" font-size="19" fill="#1a2e4a">n</text><text x="440" y="78" text-anchor="middle" font-size="19" fill="#1a2e4a">n log₂ n</text><text x="565" y="78" text-anchor="middle" font-size="19" fill="#1a2e4a">n²</text><text x="690" y="78" text-anchor="middle" font-size="19" fill="#1a2e4a">2ⁿ</text><text x="65" y="126" text-anchor="middle" font-size="21" fill="#1a2e4a">4</text><text x="190" y="126" text-anchor="middle" font-size="21" fill="#1a2e4a">2</text><text x="315" y="126" text-anchor="middle" font-size="21" fill="#1a2e4a">4</text><text x="440" y="126" text-anchor="middle" font-size="21" fill="#1a2e4a">8</text><text x="565" y="126" text-anchor="middle" font-size="21" fill="#1a2e4a">16</text><text x="690" y="126" text-anchor="middle" font-size="21" fill="#1a2e4a">16</text><text x="65" y="187" text-anchor="middle" font-size="21" fill="#1a2e4a">8</text><text x="190" y="187" text-anchor="middle" font-size="21" fill="#1a2e4a">3</text><text x="315" y="187" text-anchor="middle" font-size="21" fill="#1a2e4a">8</text><text x="440" y="187" text-anchor="middle" font-size="21" fill="#1a2e4a">24</text><text x="565" y="187" text-anchor="middle" font-size="21" fill="#1a2e4a">64</text><text x="690" y="187" text-anchor="middle" font-size="21" fill="#1a2e4a">256</text><text x="65" y="248" text-anchor="middle" font-size="21" fill="#1a2e4a">16</text><text x="190" y="248" text-anchor="middle" font-size="21" fill="#1a2e4a">4</text><text x="315" y="248" text-anchor="middle" font-size="21" fill="#1a2e4a">16</text><text x="440" y="248" text-anchor="middle" font-size="21" fill="#1a2e4a">64</text><text x="565" y="248" text-anchor="middle" font-size="21" fill="#1a2e4a">256</text><text x="690" y="248" text-anchor="middle" font-size="21" fill="#1a2e4a">65536</text><text x="380" y="318" text-anchor="middle" font-size="17" fill="#1a2e4a">有限表说明数量；无限增长关系仍需证明。</text></g></svg>