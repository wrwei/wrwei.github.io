<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 340" role="img" aria-label="三二投影到一一张成为二点五二点五，余量零点五负零点五垂直一一，平方长度二分之一。"><title>对角线投影的正交分解</title><desc>三二投影到一一张成为二点五二点五，余量零点五负零点五垂直一一，平方长度二分之一。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#2563eb"/></marker></defs><rect width="760" height="340" fill="white"/><g font-family="system-ui,Segoe UI,Microsoft YaHei,sans-serif"><text x="380" y="30" text-anchor="middle" font-size="21" fill="#1a2e4a">最近点：投影与残差垂直</text><path d="M80,275H385M110,295V50" stroke="#94a3b8"/><path d="M80,305L335,50" stroke="#93c5fd" stroke-width="4"/><path d="M110,275L260,125" fill="none" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M260,125L290,155" fill="none" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arrow)"/><circle cx="260" cy="125" r="5" fill="#15803d"/><circle cx="290" cy="155" r="5" fill="#1a2e4a"/><text x="170" y="120" text-anchor="start" font-size="21" fill="#1a2e4a">p=(2.5,2.5)</text><text x="300" y="176" text-anchor="start" font-size="21" fill="#1a2e4a">y=(3,2)</text><text x="290" y="100" text-anchor="start" font-size="20" fill="#1a2e4a">r=(0.5,−0.5)</text><rect x="470" y="90" width="260" height="195" rx="10" fill="#f0f9ff" stroke="#0ea5e9"/><text x="600" y="139" text-anchor="middle" font-size="26" fill="#1a2e4a">u·r = 0</text><text x="600" y="191" text-anchor="middle" font-size="25" fill="#1a2e4a">‖r‖² = 1/2</text><text x="600" y="246" text-anchor="middle" font-size="17" fill="#1a2e4a">其他候选增加平方项</text></g></svg>