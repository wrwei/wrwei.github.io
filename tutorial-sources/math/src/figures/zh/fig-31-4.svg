<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 350" role="img" aria-label="完成三与五的独立质量四分一四分三，共享质量各半，相同边际却均值四点五与四。"><title>菱形工期的精确分布</title><desc>完成三与五的独立质量四分一四分三，共享质量各半，相同边际却均值四点五与四。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#2563eb"/></marker></defs><rect width="760" height="350" fill="white"/><g font-family="system-ui,Segoe UI,Microsoft YaHei,sans-serif"><text x="380" y="30" text-anchor="middle" font-size="23" fill="#1a2e4a">相同边际，不同完成 PMF</text><path d="M70,70V265H700" fill="none" stroke="#64748b"/><rect x="185" y="210" width="50" height="55" fill="#0284c7"/><text x="210" y="195" text-anchor="middle" font-size="21" fill="#1a2e4a">0.25</text><rect x="255" y="155" width="50" height="110" fill="#7e22ce"/><text x="280" y="140" text-anchor="middle" font-size="21" fill="#1a2e4a">0.5</text><text x="245" y="300" text-anchor="middle" font-size="22" fill="#1a2e4a">T=3</text><rect x="485" y="100" width="50" height="165" fill="#0284c7"/><text x="510" y="85" text-anchor="middle" font-size="21" fill="#1a2e4a">0.75</text><rect x="555" y="155" width="50" height="110" fill="#7e22ce"/><text x="580" y="140" text-anchor="middle" font-size="21" fill="#1a2e4a">0.5</text><text x="545" y="300" text-anchor="middle" font-size="22" fill="#1a2e4a">T=5</text><text x="380" y="335" text-anchor="middle" font-size="19" fill="#1a2e4a">蓝：独立 E[T]=4.5；紫：共享 E[T]=4</text></g></svg>