<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 375" role="img" aria-label="半特征值亏损首步放大却最终衰减，单位特征值亏损产生k一无界增长。"><title>亏损幂的几何与多项式因素</title><desc>半特征值亏损首步放大却最终衰减，单位特征值亏损产生k一无界增长。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#2563eb"/></marker></defs><rect width="760" height="375" fill="white"/><g font-family="system-ui,Segoe UI,Microsoft YaHei,sans-serif"><text x="380" y="30" text-anchor="middle" font-size="20" fill="#1a2e4a">谱半径边界与暂态：不能只看单步范数</text><rect x="25" y="70" width="345" height="235" rx="10" fill="#f0f9ff" stroke="#0ea5e9"/><rect x="395" y="70" width="340" height="235" rx="10" fill="#fff7ed" stroke="#c2410c"/><text x="197" y="112" text-anchor="middle" font-size="22" fill="#1a2e4a">B=[[0.5,3],[0,0.5]]</text><text x="197" y="158" text-anchor="middle" font-size="25" fill="#1a2e4a">ρ=0.5</text><text x="197" y="208" text-anchor="middle" font-size="20" fill="#1a2e4a">e₀=(0,1) → e₁=(3,0.5)</text><text x="197" y="256" text-anchor="middle" font-size="18" fill="#1a2e4a">首步放大，最终趋零</text><text x="565" y="112" text-anchor="middle" font-size="22" fill="#1a2e4a">J=[[1,1],[0,1]]</text><text x="565" y="158" text-anchor="middle" font-size="25" fill="#1a2e4a">ρ=1</text><text x="565" y="208" text-anchor="middle" font-size="23" fill="#1a2e4a">Jᵏ(0,1)=(k,1)</text><text x="565" y="256" text-anchor="middle" font-size="18" fill="#1a2e4a">单位亏损：无界增长</text><text x="380" y="342" text-anchor="middle" font-size="20" fill="#1a2e4a">N²=0 时，(λI+N)ᵏ=λᵏI+kλᵏ⁻¹N（k≥1）。</text></g></svg>