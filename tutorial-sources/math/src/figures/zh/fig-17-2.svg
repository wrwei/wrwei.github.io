<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 350" role="img" aria-label="零一上二倍x密度高度最大二，总质量一，四分之一至四分之三区间质量二分之一。"><title>线性密度的高度和质量</title><desc>零一上二倍x密度高度最大二，总质量一，四分之一至四分之三区间质量二分之一。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#2563eb"/></marker></defs><rect width="760" height="350" fill="white"/><g font-family="system-ui,Segoe UI,Microsoft YaHei,sans-serif"><text x="380" y="30" text-anchor="middle" font-size="24" fill="#1a2e4a">密度高度与积分质量不同</text><path d="M110,260L610,80V260Z" fill="#eff6ff"/><path d="M235,260V215L485,125V260Z" fill="#93c5fd"/><path d="M110,260H640M110,270V60" stroke="#94a3b8"/><path d="M110,260L610,80" stroke="#2563eb" stroke-width="4"/><circle cx="610" cy="80" r="5" fill="#c2410c"/><text x="650" y="82" text-anchor="end" font-size="18" fill="#1a2e4a">p(1)=2</text><text x="360" y="190" text-anchor="middle" font-size="20" fill="#1a2e4a">蓝色质量 = 1/2</text><text x="110" y="283" text-anchor="middle" font-size="16" fill="#1a2e4a">0</text><text x="235" y="283" text-anchor="middle" font-size="16" fill="#1a2e4a">1/4</text><text x="485" y="283" text-anchor="middle" font-size="16" fill="#1a2e4a">3/4</text><text x="610" y="283" text-anchor="middle" font-size="16" fill="#1a2e4a">1</text><text x="380" y="326" text-anchor="middle" font-size="20" fill="#1a2e4a">p(x)=2x 在 [0,1]；总积分 = 1。</text></g></svg>