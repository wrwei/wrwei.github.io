<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 350" role="img" aria-label="A 距离零，B,C 一，D 二，E 三，F 不可达。CD 为非父边，其他边给父路径。"><title>BFS 距离层</title><desc>A 距离零，B,C 一，D 二，E 三，F 不可达。CD 为非父边，其他边给父路径。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#2563eb"/></marker></defs><rect width="760" height="350" fill="white"/><g font-family="system-ui,Segoe UI,Microsoft YaHei,sans-serif"><text x="380" y="30" text-anchor="middle" font-size="19" fill="#1a2e4a">按距离分层：父边给最短边数证书</text><path d="M80,160L255,100" stroke="#2563eb" stroke-width="3"/><path d="M80,160L255,220" stroke="#2563eb" stroke-width="3"/><path d="M255,100L430,160" stroke="#2563eb" stroke-width="3"/><path d="M255,220L430,160" stroke="#94a3b8" stroke-width="3"/><path d="M430,160L605,160" stroke="#2563eb" stroke-width="3"/><circle cx="80" cy="160" r="22" fill="#f0f9ff" stroke="#2563eb"/><text x="80" y="167" text-anchor="middle" font-size="20" fill="#1a2e4a">A</text><circle cx="255" cy="100" r="22" fill="#f0f9ff" stroke="#2563eb"/><text x="255" y="107" text-anchor="middle" font-size="20" fill="#1a2e4a">B</text><circle cx="255" cy="220" r="22" fill="#f0f9ff" stroke="#2563eb"/><text x="255" y="227" text-anchor="middle" font-size="20" fill="#1a2e4a">C</text><circle cx="430" cy="160" r="22" fill="#f0f9ff" stroke="#2563eb"/><text x="430" y="167" text-anchor="middle" font-size="20" fill="#1a2e4a">D</text><circle cx="605" cy="160" r="22" fill="#f0f9ff" stroke="#2563eb"/><text x="605" y="167" text-anchor="middle" font-size="20" fill="#1a2e4a">E</text><circle cx="670" cy="290" r="22" fill="#f0f9ff" stroke="#2563eb"/><text x="670" y="297" text-anchor="middle" font-size="20" fill="#1a2e4a">F</text><text x="80" y="68" text-anchor="middle" font-size="19" fill="#1a2e4a">d=0</text><text x="255" y="68" text-anchor="middle" font-size="19" fill="#1a2e4a">d=1</text><text x="430" y="68" text-anchor="middle" font-size="19" fill="#1a2e4a">d=2</text><text x="605" y="68" text-anchor="middle" font-size="19" fill="#1a2e4a">d=3</text><text x="360" y="307" text-anchor="middle" font-size="17" fill="#1a2e4a">F 从 A 不可达，不应标零。</text></g></svg>