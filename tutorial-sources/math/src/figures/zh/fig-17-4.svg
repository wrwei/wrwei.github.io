<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 350" role="img" aria-label="正速率正步长下乘积ah在零一范围保持非负，介于一二为稳定交替，大于二不稳定，等于二中性振荡。"><title>欧拉稳定与非负区域</title><desc>正速率正步长下乘积ah在零一范围保持非负，介于一二为稳定交替，大于二不稳定，等于二中性振荡。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#2563eb"/></marker></defs><rect width="760" height="350" fill="white"/><g font-family="system-ui,Segoe UI,Microsoft YaHei,sans-serif"><text x="380" y="30" text-anchor="middle" font-size="24" fill="#1a2e4a">欧拉因子 q=1−ah 的不同区域</text><rect x="45" y="75" width="210" height="145" rx="10" fill="#dcfce7" stroke="#15803d"/><rect x="275" y="75" width="210" height="145" rx="10" fill="#fff7ed" stroke="#c2410c"/><rect x="505" y="75" width="210" height="145" rx="10" fill="#fee2e2" stroke="#dc2626"/><text x="150" y="111" text-anchor="middle" font-size="21" fill="#1a2e4a">0 &lt; ah ≤ 1</text><text x="380" y="111" text-anchor="middle" font-size="21" fill="#1a2e4a">1 &lt; ah &lt; 2</text><text x="610" y="111" text-anchor="middle" font-size="21" fill="#1a2e4a">ah &gt; 2</text><text x="150" y="153" text-anchor="middle" font-size="20" fill="#1a2e4a">非负衰减</text><text x="380" y="153" text-anchor="middle" font-size="20" fill="#1a2e4a">交替衰减</text><text x="610" y="153" text-anchor="middle" font-size="20" fill="#1a2e4a">交替增长</text><text x="150" y="193" text-anchor="middle" font-size="19" fill="#1a2e4a">0 ≤ q &lt; 1</text><text x="380" y="193" text-anchor="middle" font-size="19" fill="#1a2e4a">−1 &lt; q &lt; 0</text><text x="610" y="193" text-anchor="middle" font-size="19" fill="#1a2e4a">q &lt; −1</text><text x="380" y="270" text-anchor="middle" font-size="20" fill="#1a2e4a">ah=2：q=−1，中性振荡，不衰减。</text><text x="380" y="315" text-anchor="middle" font-size="17" fill="#1a2e4a">a&gt;0，h&gt;0；稳定、非负、准确分别检查。</text></g></svg>