<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 350" role="img" aria-label="固定真值用紫竖线表示，五个示意区间中三条蓝线包含真值，两条橙线不包含；理论覆盖必须按真实抽样律计算。"><title>重复区间与固定真值</title><desc>固定真值用紫竖线表示，五个示意区间中三条蓝线包含真值，两条橙线不包含；理论覆盖必须按真实抽样律计算。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#2563eb"/></marker></defs><rect width="760" height="350" fill="white"/><g font-family="system-ui,Segoe UI,Microsoft YaHei,sans-serif"><text x="380" y="30" text-anchor="middle" font-size="23" fill="#1a2e4a">真参数固定；区间随数据变化</text><path d="M380,63V285" stroke="#7e22ce" stroke-width="3"/><path d="M230,88H460M230,80V96M460,80V96" stroke="#0284c7" stroke-width="4"/><text x="35" y="94" text-anchor="start" font-size="18" fill="#1a2e4a">样本 1</text><path d="M290,130H520M290,122V138M520,122V138" stroke="#0284c7" stroke-width="4"/><text x="35" y="136" text-anchor="start" font-size="18" fill="#1a2e4a">样本 2</text><path d="M140,172H310M140,164V180M310,164V180" stroke="#c2410c" stroke-width="4"/><text x="35" y="178" text-anchor="start" font-size="18" fill="#1a2e4a">样本 3</text><path d="M345,214H575M345,206V222M575,206V222" stroke="#0284c7" stroke-width="4"/><text x="35" y="220" text-anchor="start" font-size="18" fill="#1a2e4a">样本 4</text><path d="M405,256H655M405,248V264M655,248V264" stroke="#c2410c" stroke-width="4"/><text x="35" y="262" text-anchor="start" font-size="18" fill="#1a2e4a">样本 5</text><text x="380" y="319" text-anchor="middle" font-size="18" fill="#1a2e4a">示意区间；五条线不定义理论覆盖率。</text></g></svg>