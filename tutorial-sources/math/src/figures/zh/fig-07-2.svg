ff" stroke="#2563eb"/><text x="555" y="76" text-anchor="middle" font-size="18" fill="#1a2e4a">B</text><circle cx="555" cy="180" r="17" fill="#f0f9ff" stroke="#2563eb"/><text x="555" y="186" text-anchor="middle" font-size="18" fill="#1a2e4a">C</text><circle cx="655" cy="145" r="17" fill="#f0f9ff" stroke="#2563eb"/><text x="655" y="151" text-anchor="middle" font-size="18" fill="#1a2e4a">D</text><text x="380" y="309" text-anchor="middle" font-size="17" fill="#1a2e4a">余点路径仍存在；基础：单点零边。</text></g></svg>