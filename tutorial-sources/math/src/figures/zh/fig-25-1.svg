<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 350" role="img" aria-label="固定参数生成随机数据再应用规则得到估计值；抽样律重复数据，后验在先验模型下固定数据而条件化参数。"><title>参数估计与两种分布</title><desc>固定参数生成随机数据再应用规则得到估计值；抽样律重复数据，后验在先验模型下固定数据而条件化参数。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#2563eb"/></marker></defs><rect width="760" height="350" fill="white"/><g font-family="system-ui,Segoe UI,Microsoft YaHei,sans-serif"><text x="380" y="30" text-anchor="middle" font-size="23" fill="#1a2e4a">固定什么，重复什么？</text><rect x="30" y="67" width="190" height="73" rx="10" fill="#f0f9ff" stroke="#0ea5e9"/><text x="125" y="100" text-anchor="middle" font-size="21" fill="#1a2e4a">固定参数 θ</text><text x="125" y="126" text-anchor="middle" font-size="20" fill="#1a2e4a">P_θ</text><path d="M225,103L283,103" fill="none" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="290" y="67" width="180" height="73" rx="10" fill="#f0f9ff" stroke="#0ea5e9"/><text x="380" y="111" text-anchor="middle" font-size="22" fill="#1a2e4a">随机数据 X</text><path d="M475,103L533,103" fill="none" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="540" y="67" width="190" height="73" rx="10" fill="#f0f9ff" stroke="#0ea5e9"/><text x="635" y="111" text-anchor="middle" font-size="22" fill="#1a2e4a">T(X) → t</text><text x="380" y="182" text-anchor="middle" font-size="22" fill="#1a2e4a">抽样分布：固定 θ，重新生成 X。</text><rect x="30" y="221" width="700" height="74" rx="10" fill="#faf5ff" stroke="#7e22ce"/><text x="380" y="253" text-anchor="middle" font-size="20" fill="#1a2e4a">后验：固定观察 x，条件化参数分布。</text><text x="380" y="282" text-anchor="middle" font-size="21" fill="#1a2e4a">π(θ|x) ∝ L(θ;x)π(θ)</text></g></svg>