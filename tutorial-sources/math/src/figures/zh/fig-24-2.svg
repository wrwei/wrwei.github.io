<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 360" role="img" aria-label="弱法则固定容差使尾概率趋零，中心极限定理除以标准误使均值波动的分布趋标准高斯。"><title>固定容差与标准化极限</title><desc>弱法则固定容差使尾概率趋零，中心极限定理除以标准误使均值波动的分布趋标准高斯。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#2563eb"/></marker></defs><rect width="760" height="360" fill="white"/><g font-family="system-ui,Segoe UI,Microsoft YaHei,sans-serif"><text x="380" y="30" text-anchor="middle" font-size="23" fill="#1a2e4a">弱法则与 CLT 使用不同尺度</text><rect x="30" y="60" width="700" height="107" rx="10" fill="#f0f9ff" stroke="#0ea5e9"/><text x="55" y="91" text-anchor="start" font-size="22" fill="#1a2e4a">固定 ε &gt; 0，N 增长</text><text x="380" y="130" text-anchor="middle" font-size="22" fill="#1a2e4a">P(|M_N − μ| ≥ ε) ≤ σ²/(Nε²) → 0</text><path d="M380,174L380,199" fill="none" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="30" y="213" width="700" height="98" rx="10" fill="#faf5ff" stroke="#7e22ce"/><text x="55" y="246" text-anchor="start" font-size="22" fill="#1a2e4a">重新缩放波动，而非原观测</text><text x="380" y="282" text-anchor="middle" font-size="22" fill="#1a2e4a">Z_N = √N(M_N − μ)/σ   ⇒   N(0,1)</text><text x="380" y="339" text-anchor="middle" font-size="18" fill="#1a2e4a">CLT 假设 IID，0 &lt; σ² &lt; ∞；这里不给有限误差率。</text></g></svg>