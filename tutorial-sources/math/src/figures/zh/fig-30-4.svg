<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 350" role="img" aria-label="风险声明需要样本条件、候选控制、数值模型有效性和冻结目标评估，任一条件不能由单个训练分数替代。"><title>泛化报告的条件链</title><desc>风险声明需要样本条件、候选控制、数值模型有效性和冻结目标评估，任一条件不能由单个训练分数替代。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#2563eb"/></marker></defs><rect width="760" height="350" fill="white"/><g font-family="system-ui,Segoe UI,Microsoft YaHei,sans-serif"><text x="380" y="30" text-anchor="middle" font-size="23" fill="#1a2e4a">同一报告，四种论证</text><rect x="35" y="58" width="690" height="50" rx="10" fill="#f0f9ff" stroke="#0ea5e9"/><text x="380" y="90" text-anchor="middle" font-size="20" fill="#1a2e4a">样本：IID 单位、损失范围及目标 P</text><rect x="35" y="124" width="690" height="50" rx="10" fill="#f0f9ff" stroke="#0ea5e9"/><text x="380" y="156" text-anchor="middle" font-size="20" fill="#1a2e4a">类：预先控制或独立构造候选</text><rect x="35" y="190" width="690" height="50" rx="10" fill="#f0f9ff" stroke="#0ea5e9"/><text x="380" y="222" text-anchor="middle" font-size="20" fill="#1a2e4a">数值：PSD、尺度、求解与目标约定</text><rect x="35" y="256" width="690" height="50" rx="10" fill="#f0f9ff" stroke="#0ea5e9"/><text x="380" y="288" text-anchor="middle" font-size="20" fill="#1a2e4a">评估：冻结选择、配对指标及偏移限制</text></g></svg>