<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 365" role="img" aria-label="四记录正负一百和正负一组合，标签依第二符号，第一方向解释百分之九十九点九九却将异标签映同分，竖方向为可见性放大。"><title>方差与标签区别</title><desc>四记录正负一百和正负一组合，标签依第二符号，第一方向解释百分之九十九点九九却将异标签映同分，竖方向为可见性放大。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#2563eb"/></marker></defs><rect width="760" height="365" fill="white"/><g font-family="system-ui,Segoe UI,Microsoft YaHei,sans-serif"><text x="380" y="30" text-anchor="middle" font-size="22" fill="#1a2e4a">高能量保留不保证保留标签信息</text><path d="M40,170H380M210,80V265" stroke="#94a3b8"/><circle cx="95" cy="125" r="10" fill="#c2410c"/><text x="112" y="131" text-anchor="start" font-size="23" fill="#1a2e4a">+</text><circle cx="95" cy="215" r="10" fill="#2563eb"/><text x="112" y="221" text-anchor="start" font-size="23" fill="#1a2e4a">−</text><circle cx="325" cy="125" r="10" fill="#c2410c"/><text x="342" y="131" text-anchor="start" font-size="23" fill="#1a2e4a">+</text><circle cx="325" cy="215" r="10" fill="#2563eb"/><text x="342" y="221" text-anchor="start" font-size="23" fill="#1a2e4a">−</text><text x="95" y="289" text-anchor="middle" font-size="19" fill="#1a2e4a">x₁=−100</text><text x="325" y="289" text-anchor="middle" font-size="19" fill="#1a2e4a">x₁=100</text><text x="210" y="329" text-anchor="middle" font-size="16" fill="#1a2e4a">竖向坐标 ±1（为可见性放大）</text><rect x="435" y="80" width="290" height="230" rx="10" fill="#f0f9ff" stroke="#0ea5e9"/><text x="580" y="123" text-anchor="middle" font-size="20" fill="#1a2e4a">Scatter=diag(40000,4)</text><text x="580" y="170" text-anchor="middle" font-size="24" fill="#1a2e4a">第一方向：99.99%</text><text x="580" y="215" text-anchor="middle" font-size="21" fill="#1a2e4a">同分数，两个标签</text><text x="580" y="262" text-anchor="middle" font-size="21" fill="#1a2e4a">第二方向才能区分</text></g></svg>