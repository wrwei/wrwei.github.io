<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 350" role="img" aria-label="设计矩阵 n乘d加一，参数 d加一，logits概率标签 n，转置残差均值加斜率罚得参数梯度；PCA用k。"><title>logistic 形状与梯度</title><desc>设计矩阵 n乘d加一，参数 d加一，logits概率标签 n，转置残差均值加斜率罚得参数梯度；PCA用k。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#2563eb"/></marker></defs><rect width="760" height="350" fill="white"/><g font-family="system-ui,Segoe UI,Microsoft YaHei,sans-serif"><text x="380" y="30" text-anchor="middle" font-size="23" fill="#1a2e4a">形状是导数约定的一部分</text><rect x="35" y="65" width="690" height="64" rx="10" fill="#f0f9ff" stroke="#0ea5e9"/><text x="380" y="104" text-anchor="middle" font-size="23" fill="#1a2e4a">Z: n×d → A=[1,Z]: n×(d+1)</text><rect x="35" y="145" width="690" height="64" rx="10" fill="#f0f9ff" stroke="#0ea5e9"/><text x="380" y="184" text-anchor="middle" font-size="23" fill="#1a2e4a">θ: (d+1,) → t,p,y: (n,)</text><rect x="35" y="225" width="690" height="64" rx="10" fill="#f0f9ff" stroke="#0ea5e9"/><text x="380" y="264" text-anchor="middle" font-size="23" fill="#1a2e4a">g = Aᵀ(p−y)/n + λ(0,w): (d+1,)</text><text x="380" y="332" text-anchor="middle" font-size="19" fill="#1a2e4a">PCA 保留 k 后，将 d 换 k；不要广播成 n×n。</text></g></svg>