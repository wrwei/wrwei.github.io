<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 370" role="img" aria-label="四乘三秩二映射，输入侧行空间二维零空间一维，输出侧列空间二维左零空间二维。"><title>输入与输出侧的空间</title><desc>四乘三秩二映射，输入侧行空间二维零空间一维，输出侧列空间二维左零空间二维。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#2563eb"/></marker></defs><rect width="760" height="370" fill="white"/><g font-family="system-ui,Segoe UI,Microsoft YaHei,sans-serif"><text x="380" y="30" text-anchor="middle" font-size="21" fill="#1a2e4a">矩形映射的四个基本空间：例 m=4、n=3、r=2</text><rect x="25" y="65" width="290" height="245" rx="10" fill="#f0f9ff" stroke="#0ea5e9"/><rect x="445" y="65" width="290" height="245" rx="10" fill="#f0f9ff" stroke="#0ea5e9"/><path d="M325,155L435,155" fill="none" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arrow)"/><text x="380" y="138" text-anchor="middle" font-size="24" fill="#1a2e4a">A</text><text x="170" y="105" text-anchor="middle" font-size="22" fill="#1a2e4a">输入 R³</text><text x="590" y="105" text-anchor="middle" font-size="22" fill="#1a2e4a">输出 R⁴</text><text x="170" y="161" text-anchor="middle" font-size="22" fill="#1a2e4a">R(A): dim 2</text><text x="170" y="209" text-anchor="middle" font-size="22" fill="#1a2e4a">N(A): dim 1</text><text x="590" y="161" text-anchor="middle" font-size="22" fill="#1a2e4a">C(A): dim 2</text><text x="590" y="209" text-anchor="middle" font-size="22" fill="#1a2e4a">N(Aᵀ): dim 2</text><text x="170" y="266" text-anchor="middle" font-size="25" fill="#1a2e4a">2 + 1 = 3</text><text x="590" y="266" text-anchor="middle" font-size="25" fill="#1a2e4a">2 + 2 = 4</text><text x="380" y="342" text-anchor="middle" font-size="20" fill="#1a2e4a">行 ⟂ 零；列 ⟂ 左零。所在空间不能互换。</text></g></svg>