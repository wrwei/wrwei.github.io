<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 345" role="img" aria-label="交叉两直线一个解，重合两直线无穷解，平行不同两直线无解；这是两未知量的几何示例。"><title>方程组的三个解集类别</title><desc>交叉两直线一个解，重合两直线无穷解，平行不同两直线无解；这是两未知量的几何示例。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#2563eb"/></marker></defs><rect width="760" height="345" fill="white"/><g font-family="system-ui,Segoe UI,Microsoft YaHei,sans-serif"><text x="380" y="30" text-anchor="middle" font-size="20" fill="#1a2e4a">两个未知量：约束的三种几何关系</text><rect x="20" y="65" width="220" height="215" rx="10" fill="#fff" stroke="#94a3b8"/><path d="M40,260L220,95" stroke="#2563eb" stroke-width="4"/><path d="M40,95L220,260" stroke="#c2410c" stroke-width="4"/><circle cx="130" cy="177.5" r="6" fill="#1a2e4a"/><text x="130" y="315" text-anchor="middle" font-size="21" fill="#1a2e4a">唯一解</text><rect x="270" y="65" width="220" height="215" rx="10" fill="#fff" stroke="#94a3b8"/><path d="M290,260L470,95" stroke="#2563eb" stroke-width="4"/><path d="M290,260L470,95" stroke="#c2410c" stroke-width="2" stroke-dasharray="8 5"/><text x="380" y="315" text-anchor="middle" font-size="21" fill="#1a2e4a">无穷多解</text><rect x="520" y="65" width="220" height="215" rx="10" fill="#fff" stroke="#94a3b8"/><path d="M540,260L720,95" stroke="#2563eb" stroke-width="4"/><path d="M540,210L695,68" stroke="#c2410c" stroke-width="4"/><text x="630" y="315" text-anchor="middle" font-size="21" fill="#1a2e4a">无解</text></g></svg>