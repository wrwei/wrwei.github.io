<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 350" role="img" aria-label="三具名项独立均匀选四桶，64 结果中 24 全不同，40 碰撞。"><title>用补集计算碰撞</title><desc>三具名项独立均匀选四桶，64 结果中 24 全不同，40 碰撞。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#2563eb"/></marker></defs><rect width="760" height="350" fill="white"/><g font-family="system-ui,Segoe UI,Microsoft YaHei,sans-serif"><rect x="40" y="45" width="680" height="235" rx="10" fill="#f0f9ff" stroke="#0ea5e9"/><text x="380" y="83" text-anchor="middle" font-size="21" fill="#1a2e4a">完整均匀样本空间：64 元组</text><rect x="80" y="112" width="270" height="130" rx="10" fill="#f0fdf4" stroke="#15803d"/><text x="215" y="154" text-anchor="middle" font-size="22" fill="#1a2e4a">全不同：24</text><text x="215" y="207" text-anchor="middle" font-size="22" fill="#1a2e4a">4 × 3 × 2</text><rect x="410" y="112" width="270" height="130" rx="10" fill="#fff7ed" stroke="#c2410c"/><text x="545" y="154" text-anchor="middle" font-size="17" fill="#1a2e4a">至少一碰撞：40</text><text x="545" y="207" text-anchor="middle" font-size="22" fill="#1a2e4a">64 − 24</text><text x="380" y="320" text-anchor="middle" font-size="18" fill="#1a2e4a">等权模型下：P(碰撞) = 40/64 = 5/8</text></g></svg>