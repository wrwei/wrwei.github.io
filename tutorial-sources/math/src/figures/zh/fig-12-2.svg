<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 350" role="img" aria-label="从一零一减去沿第一标准正交方向的成分得二分之一负二分之一一，归一化得到一负一二除根号六，QR重构原列。"><title>两列格拉姆施密特</title><desc>从一零一减去沿第一标准正交方向的成分得二分之一负二分之一一，归一化得到一负一二除根号六，QR重构原列。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#2563eb"/></marker></defs><rect width="760" height="350" fill="white"/><g font-family="system-ui,Segoe UI,Microsoft YaHei,sans-serif"><text x="380" y="30" text-anchor="middle" font-size="21" fill="#1a2e4a">先去成分，再归一化：保留相同张成</text><rect x="25" y="75" width="220" height="180" rx="10" fill="#f0f9ff" stroke="#0ea5e9"/><text x="135" y="119" text-anchor="middle" font-size="24" fill="#1a2e4a">a₂=(1,0,1)</text><text x="135" y="173" text-anchor="middle" font-size="20" fill="#1a2e4a">q₁=(1,1,0)/√2</text><text x="135" y="224" text-anchor="middle" font-size="21" fill="#1a2e4a">q₁·a₂=1/√2</text><path d="M255,163L295,163" fill="none" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="305" y="75" width="200" height="180" rx="10" fill="#f0f9ff" stroke="#0ea5e9"/><text x="405" y="119" text-anchor="middle" font-size="26" fill="#1a2e4a">v₂</text><text x="405" y="173" text-anchor="middle" font-size="21" fill="#1a2e4a">(1/2,−1/2,1)</text><text x="405" y="224" text-anchor="middle" font-size="21" fill="#1a2e4a">‖v₂‖=√(3/2)</text><path d="M515,163L550,163" fill="none" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="560" y="75" width="175" height="180" rx="10" fill="#f0fdf4" stroke="#15803d"/><text x="647" y="119" text-anchor="middle" font-size="26" fill="#1a2e4a">q₂</text><text x="647" y="172" text-anchor="middle" font-size="20" fill="#1a2e4a">(1,−1,2)/√6</text><text x="647" y="224" text-anchor="middle" font-size="21" fill="#1a2e4a">q₁·q₂=0</text><text x="380" y="315" text-anchor="middle" font-size="22" fill="#1a2e4a">A = QR;   R = [[√2,1/√2],[0,√(3/2)]]</text></g></svg>