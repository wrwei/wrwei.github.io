<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 350" role="img" aria-label="根的零分支直接到 a，右一分支再分零到 b、一到 c，码字零一零一一无前缀冲突，平均一点五比特。"><title>三符号前缀码树</title><desc>根的零分支直接到 a，右一分支再分零到 b、一到 c，码字零一零一一无前缀冲突，平均一点五比特。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#2563eb"/></marker></defs><rect width="760" height="350" fill="white"/><g font-family="system-ui,Segoe UI,Microsoft YaHei,sans-serif"><text x="380" y="30" text-anchor="middle" font-size="23" fill="#1a2e4a">前缀叶码 0、10、11</text><path d="M380,70L155,151M380,70L510,151M510,151L420,241M510,151L630,241" fill="none" stroke="#0284c7" stroke-width="3"/><text x="265" y="99" text-anchor="start" font-size="20" fill="#1a2e4a">0</text><text x="463" y="99" text-anchor="start" font-size="20" fill="#1a2e4a">1</text><text x="445" y="198" text-anchor="start" font-size="20" fill="#1a2e4a">0</text><text x="582" y="198" text-anchor="start" font-size="20" fill="#1a2e4a">1</text><circle cx="380" cy="70" r="7" fill="#0284c7"/><circle cx="510" cy="151" r="7" fill="#0284c7"/><circle cx="155" cy="151" r="7" fill="#15803d"/><text x="155" y="183" text-anchor="middle" font-size="19" fill="#1a2e4a">a: 0; p=1/2</text><circle cx="420" cy="241" r="7" fill="#15803d"/><text x="420" y="273" text-anchor="middle" font-size="19" fill="#1a2e4a">b: 10; p=1/4</text><circle cx="630" cy="241" r="7" fill="#15803d"/><text x="630" y="273" text-anchor="middle" font-size="19" fill="#1a2e4a">c: 11; p=1/4</text><text x="380" y="327" text-anchor="middle" font-size="21" fill="#1a2e4a">E[length] = .5×1 + .25×2 + .25×2 = 1.5 bits</text></g></svg>