<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 380" role="img" aria-label="奇异值六、三、一，平方三十六、九、一，保留零、一、二、三项的误差平方四十六、十、一、零。"><title>截断误差的预算</title><desc>奇异值六、三、一，平方三十六、九、一，保留零、一、二、三项的误差平方四十六、十、一、零。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#2563eb"/></marker></defs><rect width="760" height="380" fill="white"/><g font-family="system-ui,Segoe UI,Microsoft YaHei,sans-serif"><text x="380" y="30" text-anchor="middle" font-size="21" fill="#1a2e4a">强度六、三、一：舍弃平方能量精确可算</text><rect x="110" y="91" width="110" height="144" fill="#2563eb"/><text x="165" y="265" text-anchor="middle" font-size="23" fill="#1a2e4a">σ₁²=36</text><rect x="320" y="199" width="110" height="36" fill="#2563eb"/><text x="375" y="265" text-anchor="middle" font-size="23" fill="#1a2e4a">σ₂²=9</text><rect x="530" y="231" width="110" height="4" fill="#2563eb"/><text x="585" y="265" text-anchor="middle" font-size="23" fill="#1a2e4a">σ₃²=1</text><text x="380" y="305" text-anchor="middle" font-size="24" fill="#1a2e4a">k=0,1,2,3 → 误差平方 46,10,1,0</text><text x="380" y="348" text-anchor="middle" font-size="19" fill="#1a2e4a">算子误差为最大舍弃强度，不是平方和。</text></g></svg>