<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 350" role="img" aria-label="绝对值左右斜率负一正一，ReLU左右零一；中心差分分别稳定零和零点五，但都没有双侧导数。"><title>绝对值与ReLU的单侧斜率</title><desc>绝对值左右斜率负一正一，ReLU左右零一；中心差分分别稳定零和零点五，但都没有双侧导数。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#2563eb"/></marker></defs><rect width="760" height="350" fill="white"/><g font-family="system-ui,Segoe UI,Microsoft YaHei,sans-serif"><text x="380" y="30" text-anchor="middle" font-size="22" fill="#1a2e4a">中心平均不能证明折点可导</text><rect x="35" y="65" width="325" height="245" rx="10" fill="#f0f9ff" stroke="#0ea5e9"/><rect x="395" y="65" width="325" height="245" rx="10" fill="#f0f9ff" stroke="#0ea5e9"/><path d="M80,115L195,190L310,115M440,190H555L670,115" stroke="#2563eb" stroke-width="4"/><text x="195" y="100" text-anchor="middle" font-size="22" fill="#1a2e4a">|x|</text><text x="555" y="100" text-anchor="middle" font-size="22" fill="#1a2e4a">ReLU(x)</text><text x="195" y="230" text-anchor="middle" font-size="20" fill="#1a2e4a">左 −1，右 +1</text><text x="555" y="230" text-anchor="middle" font-size="20" fill="#1a2e4a">左 0，右 1</text><text x="195" y="276" text-anchor="middle" font-size="18" fill="#1a2e4a">中心 = 0；不可导</text><text x="555" y="276" text-anchor="middle" font-size="18" fill="#1a2e4a">中心 = 0.5；不可导</text></g></svg>