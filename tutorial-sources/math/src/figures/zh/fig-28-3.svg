<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 350" role="img" aria-label="标量点八岭强度一解点四，套索强度一解零；尺度改变惩罚几何，训练拟合尺度验证选强度最终一次评估。"><title>岭套索与拆分约定</title><desc>标量点八岭强度一解点四，套索强度一解零；尺度改变惩罚几何，训练拟合尺度验证选强度最终一次评估。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#2563eb"/></marker></defs><rect width="760" height="350" fill="white"/><g font-family="system-ui,Segoe UI,Microsoft YaHei,sans-serif"><text x="380" y="30" text-anchor="middle" font-size="23" fill="#1a2e4a">同一个标量目标，不同惩罚</text><text x="380" y="77" text-anchor="middle" font-size="24" fill="#1a2e4a">½(w−a)²; a=.8, λ=1</text><rect x="35" y="115" width="330" height="125" rx="10" fill="#f0f9ff" stroke="#0ea5e9"/><rect x="395" y="115" width="330" height="125" rx="10" fill="#faf5ff" stroke="#7e22ce"/><text x="200" y="149" text-anchor="middle" font-size="23" fill="#1a2e4a">岭 λw²/2</text><text x="200" y="190" text-anchor="middle" font-size="23" fill="#1a2e4a">w*=a/(1+λ)=.4</text><text x="560" y="149" text-anchor="middle" font-size="23" fill="#1a2e4a">套索 λ|w|</text><text x="560" y="190" text-anchor="middle" font-size="20" fill="#1a2e4a">w*=sign(a)(|a|−λ)₊=0</text><text x="380" y="290" text-anchor="middle" font-size="19" fill="#1a2e4a">特征缩放会改变惩罚几何；截距另定。</text><text x="380" y="328" text-anchor="middle" font-size="19" fill="#1a2e4a">训练拟合尺度 → 验证选择 λ → 一次最终评估</text></g></svg>