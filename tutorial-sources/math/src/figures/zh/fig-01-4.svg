<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 340" role="img" aria-label="第一行为 11、12、13，总和 36；第二行为 21、22、23，总和 66；合计 102。"><title id="title">矩形双重求和</title><desc id="desc">第一行为 11、12、13，总和 36；第二行为 21、22、23，总和 66；合计 102。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker></defs><rect width="760" height="340" fill="white"/><g font-family="system-ui,Segoe UI,Microsoft YaHei,sans-serif"><text x="380" y="33" text-anchor="middle" font-size="20" fill="#1a2e4a">项 = 10i + j</text><text x="255" y="71" text-anchor="middle" font-size="17" fill="#1a2e4a">j = 1</text><text x="380" y="71" text-anchor="middle" font-size="17" fill="#1a2e4a">j = 2</text><text x="505" y="71" text-anchor="middle" font-size="17" fill="#1a2e4a">j = 3</text><text x="90" y="122" text-anchor="middle" font-size="17" fill="#1a2e4a">i = 1</text><rect x="205" y="90" width="100" height="56" rx="12" fill="#f0f9ff" stroke="#0ea5e9"/><text x="255" y="125" text-anchor="middle" font-size="22" fill="#1a2e4a">11</text><rect x="330" y="90" width="100" height="56" rx="12" fill="#f0f9ff" stroke="#0ea5e9"/><text x="380" y="125" text-anchor="middle" font-size="22" fill="#1a2e4a">12</text><rect x="455" y="90" width="100" height="56" rx="12" fill="#f0f9ff" stroke="#0ea5e9"/><text x="505" y="125" text-anchor="middle" font-size="22" fill="#1a2e4a">13</text><text x="650" y="125" text-anchor="middle" font-size="20" fill="#1a2e4a">= 36</text><text x="90" y="200" text-anchor="middle" font-size="17" fill="#1a2e4a">i = 2</text><rect x="205" y="168" width="100" height="56" rx="12" fill="#f0f9ff" stroke="#0ea5e9"/><text x="255" y="203" text-anchor="middle" font-size="22" fill="#1a2e4a">21</text><rect x="330" y="168" width="100" height="56" rx="12" fill="#f0f9ff" stroke="#0ea5e9"/><text x="380" y="203" text-anchor="middle" font-size="22" fill="#1a2e4a">22</text><rect x="455" y="168" width="100" height="56" rx="12" fill="#f0f9ff" stroke="#0ea5e9"/><text x="505" y="203" text-anchor="middle" font-size="22" fill="#1a2e4a">23</text><text x="650" y="203" text-anchor="middle" font-size="20" fill="#1a2e4a">= 66</text><text x="380" y="288" text-anchor="middle" font-size="22" fill="#1a2e4a">总和：36 + 66 = 102</text></g></svg>