<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 340" role="img" aria-label="原命题等价于逆否命题，逆命题等价于否命题，但两组一般不同。"><title>两组等价式</title><desc>原命题等价于逆否命题，逆命题等价于否命题，但两组一般不同。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#2563eb"/></marker></defs><rect width="760" height="340" fill="white"/><g font-family="system-ui,Segoe UI,Microsoft YaHei,sans-serif"><rect x="40" y="35" width="280" height="85" rx="10" fill="#f0f9ff" stroke="#0ea5e9"/><text x="180" y="68" text-anchor="middle" font-size="24" fill="#1a2e4a">p ⇒ q</text><text x="180" y="97" text-anchor="middle" font-size="16" fill="#1a2e4a">原命题</text><rect x="440" y="35" width="280" height="85" rx="10" fill="#f0f9ff" stroke="#0ea5e9"/><text x="580" y="68" text-anchor="middle" font-size="24" fill="#1a2e4a">¬q ⇒ ¬p</text><text x="580" y="97" text-anchor="middle" font-size="16" fill="#1a2e4a">逆否命题</text><path d="M325,77L432,77" fill="none" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arrow)"/><text x="380" y="52" text-anchor="middle" font-size="21" fill="#1a2e4a">≡</text><rect x="40" y="210" width="280" height="85" rx="10" fill="#fff7ed" stroke="#c2410c"/><text x="180" y="243" text-anchor="middle" font-size="24" fill="#1a2e4a">q ⇒ p</text><text x="180" y="272" text-anchor="middle" font-size="16" fill="#1a2e4a">逆命题</text><rect x="440" y="210" width="280" height="85" rx="10" fill="#fff7ed" stroke="#c2410c"/><text x="580" y="243" text-anchor="middle" font-size="24" fill="#1a2e4a">¬p ⇒ ¬q</text><text x="580" y="272" text-anchor="middle" font-size="16" fill="#1a2e4a">否命题</text><path d="M325,252L432,252" fill="none" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arrow)"/><text x="380" y="227" text-anchor="middle" font-size="21" fill="#1a2e4a">≡</text><text x="380" y="171" text-anchor="middle" font-size="18" fill="#1a2e4a">两组一般不等价</text></g></svg>