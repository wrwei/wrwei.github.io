<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 350" role="img" aria-label="有放回独立平均 C 除 b，不同索引再乘有限总体校正，复制同一个梯度没有方差缩减。"><title>批次独立性与有限总体校正</title><desc>有放回独立平均 C 除 b，不同索引再乘有限总体校正，复制同一个梯度没有方差缩减。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#2563eb"/></marker></defs><rect width="760" height="350" fill="white"/><g font-family="system-ui,Segoe UI,Microsoft YaHei,sans-serif"><text x="380" y="30" text-anchor="middle" font-size="23" fill="#1a2e4a">同一个 b，三个协方差</text><rect x="35" y="55" width="690" height="70" rx="10" fill="#f0f9ff" stroke="#0ea5e9"/><text x="55" y="85" text-anchor="start" font-size="21" fill="#1a2e4a">独立有放回</text><text x="700" y="111" text-anchor="end" font-size="24" fill="#1a2e4a">C/b</text><rect x="35" y="140" width="690" height="70" rx="10" fill="#f0f9ff" stroke="#0ea5e9"/><text x="55" y="170" text-anchor="start" font-size="21" fill="#1a2e4a">均匀不同索引子集</text><text x="700" y="196" text-anchor="end" font-size="24" fill="#1a2e4a">(C/b) (N−b)/(N−1)</text><rect x="35" y="225" width="690" height="70" rx="10" fill="#f0f9ff" stroke="#0ea5e9"/><text x="55" y="255" text-anchor="start" font-size="21" fill="#1a2e4a">一个抽样复制 b 次</text><text x="700" y="281" text-anchor="end" font-size="24" fill="#1a2e4a">C</text><text x="380" y="332" text-anchor="middle" font-size="18" fill="#1a2e4a">子集公式需 N&gt;1；C 使用分母 N。</text></g></svg>