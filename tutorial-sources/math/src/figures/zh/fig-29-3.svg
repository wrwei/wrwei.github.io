<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 350" role="img" aria-label="大 logits 减最大值后得到有限概率和原模型损失；导数差分需要平衡截断与舍入。"><title>稳定 logits 与差分权衡</title><desc>大 logits 减最大值后得到有限概率和原模型损失；导数差分需要平衡截断与舍入。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#2563eb"/></marker></defs><rect width="760" height="350" fill="white"/><g font-family="system-ui,Segoe UI,Microsoft YaHei,sans-serif"><text x="380" y="30" text-anchor="middle" font-size="22" fill="#1a2e4a">先稳定求值，再检查同一导数</text><rect x="35" y="65" width="690" height="65" rx="10" fill="#f0f9ff" stroke="#0ea5e9"/><text x="55" y="92" text-anchor="start" font-size="20" fill="#1a2e4a">原始 logits</text><text x="55" y="118" text-anchor="start" font-size="22" fill="#1a2e4a">(1000,1001,1002)</text><rect x="35" y="145" width="690" height="65" rx="10" fill="#f0f9ff" stroke="#0ea5e9"/><text x="55" y="172" text-anchor="start" font-size="20" fill="#1a2e4a">减公共最大值</text><text x="55" y="198" text-anchor="start" font-size="22" fill="#1a2e4a">(−2,−1,0)</text><rect x="35" y="225" width="690" height="65" rx="10" fill="#f0f9ff" stroke="#0ea5e9"/><text x="55" y="252" text-anchor="start" font-size="20" fill="#1a2e4a">概率与零类 NLL</text><text x="55" y="278" text-anchor="start" font-size="22" fill="#1a2e4a">(.09003,.24473,.66524); 2.407606</text><text x="380" y="330" text-anchor="middle" font-size="19" fill="#1a2e4a">差分 h 太大：截断；太小：舍入。</text></g></svg>