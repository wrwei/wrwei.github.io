<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 350" role="img" aria-label="训练拟合参数和变换，验证选候选，冻结所有规则，再用独立测试估计声明目标风险。"><title>选择与冻结测试</title><desc>训练拟合参数和变换，验证选候选，冻结所有规则，再用独立测试估计声明目标风险。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#2563eb"/></marker></defs><rect width="760" height="350" fill="white"/><g font-family="system-ui,Segoe UI,Microsoft YaHei,sans-serif"><text x="380" y="30" text-anchor="middle" font-size="23" fill="#1a2e4a">先选择，冻结后再估计</text><rect x="35" y="52" width="690" height="47" rx="10" fill="#f0f9ff" stroke="#0ea5e9"/><text x="380" y="82" text-anchor="middle" font-size="21" fill="#1a2e4a">训练：参数与变换</text><path d="M380,101L380,114" fill="none" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="35" y="118" width="690" height="47" rx="10" fill="#f0f9ff" stroke="#0ea5e9"/><text x="380" y="148" text-anchor="middle" font-size="21" fill="#1a2e4a">验证：候选选择</text><path d="M380,167L380,180" fill="none" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="35" y="184" width="690" height="47" rx="10" fill="#f0f9ff" stroke="#0ea5e9"/><text x="380" y="214" text-anchor="middle" font-size="21" fill="#1a2e4a">冻结：模型与规则</text><path d="M380,233L380,246" fill="none" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="35" y="250" width="690" height="47" rx="10" fill="#f0f9ff" stroke="#0ea5e9"/><text x="380" y="280" text-anchor="middle" font-size="21" fill="#1a2e4a">测试：目标风险估计</text><text x="380" y="336" text-anchor="middle" font-size="18" fill="#1a2e4a">每次使用标签都应进入信息依赖说明。</text></g></svg>