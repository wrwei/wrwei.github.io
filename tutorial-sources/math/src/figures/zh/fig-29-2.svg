<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 350" role="img" aria-label="近相关二维矩阵的候选相对误差一，残差仅约三点五四乘十的负九次；大条件数解释放大。"><title>残差与敏感性反例</title><desc>近相关二维矩阵的候选相对误差一，残差仅约三点五四乘十的负九次；大条件数解释放大。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#2563eb"/></marker></defs><rect width="760" height="350" fill="white"/><g font-family="system-ui,Segoe UI,Microsoft YaHei,sans-serif"><text x="380" y="30" text-anchor="middle" font-size="22" fill="#1a2e4a">一个小残差不等于小前向误差</text><text x="380" y="83" text-anchor="middle" font-size="22" fill="#1a2e4a">A = ((1,1),(1,1+ε)); ε=10⁻⁸</text><rect x="35" y="115" width="690" height="67" rx="10" fill="#f0f9ff" stroke="#0ea5e9"/><text x="55" y="145" text-anchor="start" font-size="22" fill="#1a2e4a">真解 (1,1)，候选 (0,2)</text><text x="55" y="171" text-anchor="start" font-size="20" fill="#1a2e4a">相对解误差 = 1</text><rect x="35" y="200" width="690" height="67" rx="10" fill="#faf5ff" stroke="#7e22ce"/><text x="55" y="231" text-anchor="start" font-size="22" fill="#1a2e4a">relative residual ≈ 3.54×10⁻⁹</text><text x="55" y="257" text-anchor="start" font-size="20" fill="#1a2e4a">κ₂(A) ≈ 4×10⁸</text><text x="380" y="327" text-anchor="middle" font-size="19" fill="#1a2e4a">残差度量邻近输入，条件数控制解敏感性。</text></g></svg>