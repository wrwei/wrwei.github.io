<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 350" role="img" aria-label="精确生成后分层拆分，训练拟合全部变换，验证选择十三候选，冻结后测试；测试不回流拟合。"><title>学习流程与拆分依赖</title><desc>精确生成后分层拆分，训练拟合全部变换，验证选择十三候选，冻结后测试；测试不回流拟合。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#2563eb"/></marker></defs><rect width="760" height="350" fill="white"/><g font-family="system-ui,Segoe UI,Microsoft YaHei,sans-serif"><text x="380" y="30" text-anchor="middle" font-size="23" fill="#1a2e4a">固定数据，正确的信息流</text><rect x="35" y="55" width="690" height="48" rx="10" fill="#f0f9ff" stroke="#0ea5e9"/><text x="380" y="86" text-anchor="middle" font-size="21" fill="#1a2e4a">种子 7：1000 行；种子 11：600/200/200</text><path d="M380,105L380,116" fill="none" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="35" y="121" width="690" height="48" rx="10" fill="#f0f9ff" stroke="#0ea5e9"/><text x="380" y="152" text-anchor="middle" font-size="21" fill="#1a2e4a">训练：μ、s、PCA 和模型参数</text><path d="M380,171L380,182" fill="none" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="35" y="187" width="690" height="48" rx="10" fill="#f0f9ff" stroke="#0ea5e9"/><text x="380" y="218" text-anchor="middle" font-size="21" fill="#1a2e4a">验证：13 候选、基线与组件选择</text><path d="M380,237L380,248" fill="none" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="35" y="253" width="690" height="48" rx="10" fill="#f0f9ff" stroke="#0ea5e9"/><text x="380" y="284" text-anchor="middle" font-size="21" fill="#1a2e4a">冻结规则 → 测试指标及条件区间</text></g></svg>