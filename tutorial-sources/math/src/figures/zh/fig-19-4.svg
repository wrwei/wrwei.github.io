<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 350" role="img" aria-label="梯度统一标量步，循环坐标用刚更新值，牛顿求耦合曲率系统，成本和非凸保障各不同。"><title>梯度坐标牛顿比较</title><desc>梯度统一标量步，循环坐标用刚更新值，牛顿求耦合曲率系统，成本和非凸保障各不同。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#2563eb"/></marker></defs><rect width="760" height="350" fill="white"/><g font-family="system-ui,Segoe UI,Microsoft YaHei,sans-serif"><text x="380" y="30" text-anchor="middle" font-size="24" fill="#1a2e4a">同一目标，不同更新模型</text><rect x="35" y="70" width="215" height="210" rx="10" fill="#f0f9ff" stroke="#0ea5e9"/><rect x="275" y="70" width="210" height="210" rx="10" fill="#f0f9ff" stroke="#0ea5e9"/><rect x="510" y="70" width="215" height="210" rx="10" fill="#f0f9ff" stroke="#0ea5e9"/><text x="142" y="109" text-anchor="middle" font-size="23" fill="#1a2e4a">梯度</text><text x="380" y="109" text-anchor="middle" font-size="20" fill="#1a2e4a">循环坐标</text><text x="617" y="109" text-anchor="middle" font-size="23" fill="#1a2e4a">牛顿</text><text x="142" y="163" text-anchor="middle" font-size="22" fill="#1a2e4a">x ← x−ηg</text><text x="380" y="163" text-anchor="middle" font-size="19" fill="#1a2e4a">xᵢ ← xᵢ−gᵢ/Aᵢᵢ</text><text x="617" y="163" text-anchor="middle" font-size="22" fill="#1a2e4a">Hp=−g</text><text x="142" y="218" text-anchor="middle" font-size="19" fill="#1a2e4a">统一标量步</text><text x="380" y="218" text-anchor="middle" font-size="18" fill="#1a2e4a">后步用新坐标</text><text x="617" y="218" text-anchor="middle" font-size="19" fill="#1a2e4a">求解而非显式逆</text><text x="380" y="329" text-anchor="middle" font-size="17" fill="#1a2e4a">比较目标下降、总成本与保障；不是只数迭代。</text></g></svg>