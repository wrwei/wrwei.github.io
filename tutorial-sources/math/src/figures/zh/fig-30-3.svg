<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 350" role="img" aria-label="间隔约束含非负松弛，目标半范数平方加 C 总松弛，固定分数最小松弛为 hinge，自由截距产生对偶等式。"><title>软 SVM 模型约定</title><desc>间隔约束含非负松弛，目标半范数平方加 C 总松弛，固定分数最小松弛为 hinge，自由截距产生对偶等式。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#2563eb"/></marker></defs><rect width="760" height="350" fill="white"/><g font-family="system-ui,Segoe UI,Microsoft YaHei,sans-serif"><text x="380" y="30" text-anchor="middle" font-size="23" fill="#1a2e4a">软间隔：分数、松弛及范数</text><text x="380" y="88" text-anchor="middle" font-size="25" fill="#1a2e4a">yᵢ(wᵀφᵢ+b) ≥ 1−ξᵢ; ξᵢ≥0</text><rect x="35" y="125" width="690" height="75" rx="10" fill="#f0f9ff" stroke="#0ea5e9"/><text x="380" y="170" text-anchor="middle" font-size="25" fill="#1a2e4a">min ½‖w‖² + CΣᵢξᵢ</text><text x="380" y="246" text-anchor="middle" font-size="24" fill="#1a2e4a">ξᵢ* = max(0,1−yᵢfᵢ)</text><text x="380" y="296" text-anchor="middle" font-size="21" fill="#1a2e4a">自由截距的对偶条件：Σᵢαᵢyᵢ=0</text><text x="380" y="331" text-anchor="middle" font-size="19" fill="#1a2e4a">几何距离 yᵢfᵢ/‖w‖ 需要 w≠0。</text></g></svg>