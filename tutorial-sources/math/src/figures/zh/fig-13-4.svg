<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 380" role="img" aria-label="对角一一百的条件数一百，强方向目标零一百，弱方向扰动零点零一零，相对变化放大一百。"><title>正定逆的方向敏感性</title><desc>对角一一百的条件数一百，强方向目标零一百，弱方向扰动零点零一零，相对变化放大一百。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#2563eb"/></marker></defs><rect width="760" height="380" fill="white"/><g font-family="system-ui,Segoe UI,Microsoft YaHei,sans-serif"><text x="380" y="30" text-anchor="middle" font-size="20" fill="#1a2e4a">正定条件比：强目标方向与弱逆扰动方向</text><rect x="30" y="70" width="700" height="235" rx="10" fill="#f0f9ff" stroke="#0ea5e9"/><text x="380" y="113" text-anchor="middle" font-size="27" fill="#1a2e4a">A=diag(1,100);    κ₂=100</text><text x="225" y="169" text-anchor="middle" font-size="25" fill="#1a2e4a">b=(0,100)</text><text x="535" y="169" text-anchor="middle" font-size="25" fill="#1a2e4a">x=(0,1)</text><path d="M330,160L420,160" fill="none" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arrow)"/><text x="225" y="226" text-anchor="middle" font-size="25" fill="#1a2e4a">δb=(0.01,0)</text><text x="535" y="226" text-anchor="middle" font-size="25" fill="#1a2e4a">δx=(0.01,0)</text><path d="M330,217L420,217" fill="none" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arrow)"/><text x="380" y="282" text-anchor="middle" font-size="20" fill="#1a2e4a">相对变化 10⁻⁴ → 10⁻²：本方向达到最坏界。</text><text x="380" y="347" text-anchor="middle" font-size="18" fill="#1a2e4a">其他扰动方向未必同样放大；一般非对称矩阵需奇异值。</text></g></svg>