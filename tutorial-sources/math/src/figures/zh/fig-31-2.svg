<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 350" role="img" aria-label="就绪入度证明优先顺序，最早完成归纳使用无限工作者，最大父指针路径给达到总工期的证书。"><title>顺序工期证明链</title><desc>就绪入度证明优先顺序，最早完成归纳使用无限工作者，最大父指针路径给达到总工期的证书。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#2563eb"/></marker></defs><rect width="760" height="350" fill="white"/><g font-family="system-ui,Segoe UI,Microsoft YaHei,sans-serif"><text x="380" y="30" text-anchor="middle" font-size="23" fill="#1a2e4a">两条证明与一条证书</text><rect x="35" y="70" width="690" height="63" rx="10" fill="#f0f9ff" stroke="#0ea5e9"/><text x="380" y="109" text-anchor="middle" font-size="21" fill="#1a2e4a">剩余前驱计数=0 ⇒ 全前驱已输出</text><rect x="35" y="160" width="690" height="63" rx="10" fill="#f0f9ff" stroke="#0ea5e9"/><text x="380" y="199" text-anchor="middle" font-size="21" fill="#1a2e4a">F(v)=d(v)+max 前驱完成时间</text><rect x="35" y="250" width="690" height="63" rx="10" fill="#f0f9ff" stroke="#0ea5e9"/><text x="380" y="289" text-anchor="middle" font-size="21" fill="#1a2e4a">沿最大前驱追踪 ⇒ 路径和=T</text></g></svg>