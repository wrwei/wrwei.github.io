<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 380" role="img" aria-label="零到十四内模三余二集合与模五余三集合只有八相交。所有整数解八加十五整数倍。"><title>互素 CRT 的唯一类</title><desc>零到十四内模三余二集合与模五余三集合只有八相交。所有整数解八加十五整数倍。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#2563eb"/></marker></defs><rect width="760" height="380" fill="white"/><g font-family="system-ui,Segoe UI,Microsoft YaHei,sans-serif"><text x="380" y="35" text-anchor="middle" font-size="21" fill="#1a2e4a">先限定代表范围：0 到 14</text><rect x="35" y="80" width="320" height="110" rx="10" fill="#f0f9ff" stroke="#0ea5e9"/><rect x="405" y="80" width="320" height="110" rx="10" fill="#f0f9ff" stroke="#0ea5e9"/><text x="195" y="116" text-anchor="middle" font-size="23" fill="#1a2e4a">x ≡ 2 (mod 3)</text><text x="195" y="160" text-anchor="middle" font-size="23" fill="#1a2e4a">{2, 5, 8, 11, 14}</text><text x="565" y="116" text-anchor="middle" font-size="23" fill="#1a2e4a">x ≡ 3 (mod 5)</text><text x="565" y="160" text-anchor="middle" font-size="23" fill="#1a2e4a">{3, 8, 13}</text><path d="M245,200L340,239" fill="none" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M515,200L420,239" fill="none" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="290" y="250" width="180" height="55" rx="10" fill="#f0fdf4" stroke="#15803d"/><text x="380" y="286" text-anchor="middle" font-size="26" fill="#1a2e4a">x = 8</text><text x="380" y="350" text-anchor="middle" font-size="18" fill="#1a2e4a">无范围限制的全部解：8 + 15k，k 为整数。</text></g></svg>