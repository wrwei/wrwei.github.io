<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 350" role="img" aria-label="输入 X 到中间 Y 再到 Z，给 Y 后 X Z 条件独立，X Z 信息不高于 X Y；不能将它误读成输出熵必降。"><title>有限数据处理关系</title><desc>输入 X 到中间 Y 再到 Z，给 Y 后 X Z 条件独立，X Z 信息不高于 X Y；不能将它误读成输出熵必降。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#2563eb"/></marker></defs><rect width="760" height="350" fill="white"/><g font-family="system-ui,Segoe UI,Microsoft YaHei,sans-serif"><text x="380" y="30" text-anchor="middle" font-size="23" fill="#1a2e4a">处理链的条件必须成立</text><rect x="30" y="85" width="210" height="90" rx="10" fill="#f0f9ff" stroke="#0ea5e9"/><text x="135" y="141" text-anchor="middle" font-size="30" fill="#1a2e4a">X</text><rect x="275" y="85" width="210" height="90" rx="10" fill="#f0f9ff" stroke="#0ea5e9"/><text x="380" y="141" text-anchor="middle" font-size="30" fill="#1a2e4a">Y</text><rect x="520" y="85" width="210" height="90" rx="10" fill="#f0f9ff" stroke="#0ea5e9"/><text x="625" y="141" text-anchor="middle" font-size="30" fill="#1a2e4a">Z</text><path d="M245,130L265,130" fill="none" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M490,130L510,130" fill="none" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arrow)"/><text x="380" y="220" text-anchor="middle" font-size="21" fill="#1a2e4a">给定 Y 后，X 与 Z 条件独立。</text><text x="380" y="266" text-anchor="middle" font-size="25" fill="#1a2e4a">I(X;Z) ≤ I(X;Y)</text><text x="380" y="319" text-anchor="middle" font-size="18" fill="#1a2e4a">新随机噪声可增 H(Z)，却不增关于 X 的信息。</text></g></svg>