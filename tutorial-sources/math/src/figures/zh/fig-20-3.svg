<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 350" role="img" aria-label="有效乘子和可行点给q小于等于L小于等于f；极小x约束x平方非正虽零间隙，却只有乘子趋无穷时逼近对偶最优。"><title>弱对偶与零间隙取得</title><desc>有效乘子和可行点给q小于等于L小于等于f；极小x约束x平方非正虽零间隙，却只有乘子趋无穷时逼近对偶最优。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#2563eb"/></marker></defs><rect width="760" height="350" fill="white"/><g font-family="system-ui,Segoe UI,Microsoft YaHei,sans-serif"><text x="380" y="30" text-anchor="middle" font-size="23" fill="#1a2e4a">下界链与取得是不同问题</text><rect x="45" y="65" width="190" height="90" rx="10" fill="#f0f9ff" stroke="#0ea5e9"/><rect x="285" y="65" width="190" height="90" rx="10" fill="#f0f9ff" stroke="#0ea5e9"/><rect x="525" y="65" width="190" height="90" rx="10" fill="#f0f9ff" stroke="#0ea5e9"/><text x="140" y="118" text-anchor="middle" font-size="25" fill="#1a2e4a">q(λ,ν)</text><text x="380" y="118" text-anchor="middle" font-size="25" fill="#1a2e4a">L(x,λ,ν)</text><text x="620" y="118" text-anchor="middle" font-size="25" fill="#1a2e4a">f(x)</text><text x="260" y="120" text-anchor="middle" font-size="28" fill="#1a2e4a">≤</text><text x="500" y="120" text-anchor="middle" font-size="28" fill="#1a2e4a">≤</text><text x="380" y="193" text-anchor="middle" font-size="21" fill="#1a2e4a">x可行且λ≥0 ⇒ 弱对偶</text><text x="380" y="240" text-anchor="middle" font-size="22" fill="#1a2e4a">min x; x²≤0: p*=d*=0</text><text x="380" y="284" text-anchor="middle" font-size="22" fill="#1a2e4a">q(λ)=−1/(4λ), λ&gt;0</text><text x="380" y="327" text-anchor="middle" font-size="19" fill="#1a2e4a">零间隙，但有限λ不取得对偶最优。</text></g></svg>