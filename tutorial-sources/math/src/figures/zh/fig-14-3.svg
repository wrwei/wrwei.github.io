<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 390" role="img" aria-label="训练拟合并保存中心尺度方向，留出记录应用同一参数，不将测试信息用于重拟合。"><title>训练拟合的PCA流程</title><desc>训练拟合并保存中心尺度方向，留出记录应用同一参数，不将测试信息用于重拟合。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#2563eb"/></marker></defs><rect width="760" height="390" fill="white"/><g font-family="system-ui,Segoe UI,Microsoft YaHei,sans-serif"><text x="380" y="30" text-anchor="middle" font-size="22" fill="#1a2e4a">先分数据，再拟合；保存同一个变换</text><rect x="25" y="75" width="270" height="90" rx="10" fill="#f0f9ff" stroke="#0ea5e9"/><text x="160" y="113" text-anchor="middle" font-size="25" fill="#1a2e4a">训练记录 X</text><text x="160" y="147" text-anchor="middle" font-size="20" fill="#1a2e4a">拟合 μ 与 V_k</text><path d="M305,120L440,120" fill="none" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="450" y="75" width="285" height="90" rx="10" fill="#f0fdf4" stroke="#15803d"/><text x="592" y="115" text-anchor="middle" font-size="20" fill="#1a2e4a">保存中心、尺度、方向</text><rect x="25" y="220" width="270" height="90" rx="10" fill="#f0f9ff" stroke="#0ea5e9"/><text x="160" y="260" text-anchor="middle" font-size="24" fill="#1a2e4a">留出记录 X_new</text><path d="M305,265L440,265" fill="none" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="450" y="220" width="285" height="90" rx="10" fill="#f0f9ff" stroke="#0ea5e9"/><text x="592" y="260" text-anchor="middle" font-size="25" fill="#1a2e4a">(X_new − μ)V_k</text><path d="M592,165V210" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arrow)"/><text x="380" y="354" text-anchor="middle" font-size="21" fill="#1a2e4a">留出得分均值不必零；不重新拟合。</text></g></svg>