<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 370" role="img" aria-label="精确δ为十的负十二次非零，秩二；实验浮点阈值十负十四与十负十分别给数值秩二与一。"><title>精确秩与数值分辨率</title><desc>精确δ为十的负十二次非零，秩二；实验浮点阈值十负十四与十负十分别给数值秩二与一。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#2563eb"/></marker></defs><rect width="760" height="370" fill="white"/><g font-family="system-ui,Segoe UI,Microsoft YaHei,sans-serif"><text x="380" y="30" text-anchor="middle" font-size="21" fill="#1a2e4a">非零差异与解析阈值是两种主张</text><rect x="35" y="75" width="330" height="225" rx="10" fill="#f0f9ff" stroke="#0ea5e9"/><rect x="395" y="75" width="330" height="225" rx="10" fill="#fff7ed" stroke="#c2410c"/><text x="200" y="115" text-anchor="middle" font-size="22" fill="#1a2e4a">精确有理模型</text><text x="200" y="167" text-anchor="middle" font-size="21" fill="#1a2e4a">A = [[1,1],[1,1+δ]]</text><text x="200" y="216" text-anchor="middle" font-size="25" fill="#1a2e4a">δ = 10⁻¹² ≠ 0</text><text x="200" y="268" text-anchor="middle" font-size="23" fill="#1a2e4a">detA = δ；秩二</text><text x="560" y="115" text-anchor="middle" font-size="21" fill="#1a2e4a">浮点分辨率策略</text><text x="560" y="167" text-anchor="middle" font-size="18" fill="#1a2e4a">容差 10⁻¹⁴ → 数值秩二</text><text x="560" y="218" text-anchor="middle" font-size="18" fill="#1a2e4a">容差 10⁻¹⁰ → 数值秩一</text><text x="560" y="268" text-anchor="middle" font-size="21" fill="#1a2e4a">记录尺度与 dtype</text><text x="380" y="342" text-anchor="middle" font-size="20" fill="#1a2e4a">阈值判定不会把精确非零量改成零。</text></g></svg>