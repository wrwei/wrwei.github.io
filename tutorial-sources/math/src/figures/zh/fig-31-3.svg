<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 350" role="img" aria-label="原 A一B二余数一三二，单改 A二得一三三，再改 B一恢复一三二而记录不同。"><title>补偿字节修改的碰撞</title><desc>原 A一B二余数一三二，单改 A二得一三三，再改 B一恢复一三二而记录不同。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#2563eb"/></marker></defs><rect width="760" height="350" fill="white"/><g font-family="system-ui,Segoe UI,Microsoft YaHei,sans-serif"><text x="380" y="30" text-anchor="middle" font-size="23" fill="#1a2e4a">有限模和不能保证完整性</text><rect x="35" y="65" width="690" height="63" rx="10" fill="#f0f9ff" stroke="#0ea5e9"/><text x="55" y="105" text-anchor="start" font-size="24" fill="#1a2e4a">A:1,B:2</text><text x="700" y="105" text-anchor="end" font-size="22" fill="#1a2e4a">sum(bytes) mod257 = 132</text><rect x="35" y="150" width="690" height="63" rx="10" fill="#f0f9ff" stroke="#0ea5e9"/><text x="55" y="190" text-anchor="start" font-size="24" fill="#1a2e4a">A:2,B:2</text><text x="700" y="190" text-anchor="end" font-size="22" fill="#1a2e4a">sum(bytes) mod257 = 133</text><rect x="35" y="235" width="690" height="63" rx="10" fill="#f0f9ff" stroke="#0ea5e9"/><text x="55" y="275" text-anchor="start" font-size="24" fill="#1a2e4a">A:2,B:1</text><text x="700" y="275" text-anchor="end" font-size="22" fill="#1a2e4a">sum(bytes) mod257 = 132</text><text x="380" y="333" text-anchor="middle" font-size="19" fill="#1a2e4a">首行末行记录不同，校验和相同。</text></g></svg>