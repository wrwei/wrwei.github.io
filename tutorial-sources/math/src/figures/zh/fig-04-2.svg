<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 340" role="img" aria-label="证明 P0 并通过逐项后继步覆盖全部自然数。错误奇数和的基础失败，尽管步一致。"><title>归纳链与缺失基础</title><desc>证明 P0 并通过逐项后继步覆盖全部自然数。错误奇数和的基础失败，尽管步一致。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#2563eb"/></marker></defs><rect width="760" height="340" fill="white"/><g font-family="system-ui,Segoe UI,Microsoft YaHei,sans-serif"><text x="380" y="42" text-anchor="middle" font-size="20" fill="#1a2e4a">基础与后继步缺一不可</text><rect x="30" y="95" width="115" height="70" rx="10" fill="#f0fdf4" stroke="#15803d"/><text x="87" y="138" text-anchor="middle" font-size="24" fill="#1a2e4a">P(0)</text><path d="M147,130L169,130" fill="none" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="175" y="95" width="115" height="70" rx="10" fill="#f0f9ff" stroke="#0ea5e9"/><text x="232" y="138" text-anchor="middle" font-size="24" fill="#1a2e4a">P(1)</text><path d="M292,130L314,130" fill="none" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="320" y="95" width="115" height="70" rx="10" fill="#f0f9ff" stroke="#0ea5e9"/><text x="377" y="138" text-anchor="middle" font-size="24" fill="#1a2e4a">P(2)</text><path d="M437,130L459,130" fill="none" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="465" y="95" width="115" height="70" rx="10" fill="#f0f9ff" stroke="#0ea5e9"/><text x="522" y="138" text-anchor="middle" font-size="24" fill="#1a2e4a">P(3)</text><path d="M582,130L604,130" fill="none" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="610" y="95" width="115" height="70" rx="10" fill="#f0f9ff" stroke="#0ea5e9"/><text x="667" y="138" text-anchor="middle" font-size="24" fill="#1a2e4a">…</text><text x="90" y="203" text-anchor="middle" font-size="15" fill="#1a2e4a">基础已证明</text><text x="395" y="203" text-anchor="middle" font-size="16" fill="#1a2e4a">每步：假设 P(k)，推出 P(k+1)</text><text x="380" y="285" text-anchor="middle" font-size="19" fill="#1a2e4a">错误 n²+1：步能延续，但基础 0 ≠ 1</text></g></svg>