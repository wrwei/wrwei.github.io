<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 340" role="img" aria-label="O 先存在一个正常数；小 o 为每个正 epsilon 选阈值，两者都覆盖全部后续 n。"><title>O 与小 o 的量词</title><desc>O 先存在一个正常数；小 o 为每个正 epsilon 选阈值，两者都覆盖全部后续 n。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#2563eb"/></marker></defs><rect width="760" height="340" fill="white"/><g font-family="system-ui,Segoe UI,Microsoft YaHei,sans-serif"><text x="380" y="30" text-anchor="middle" font-size="21" fill="#1a2e4a">量词顺序控制界的强度</text><rect x="35" y="65" width="690" height="100" rx="10" fill="#f0f9ff" stroke="#0ea5e9"/><text x="60" y="98" text-anchor="start" font-size="23" fill="#1a2e4a">O(g):  ∃c &gt; 0   ∃n₀   ∀n ≥ n₀</text><text x="60" y="138" text-anchor="start" font-size="18" fill="#1a2e4a">固定一个比例，覆盖全部后续输入</text><rect x="35" y="195" width="690" height="100" rx="10" fill="#f0fdf4" stroke="#15803d"/><text x="60" y="228" text-anchor="start" font-size="23" fill="#1a2e4a">o(g):  ∀ε &gt; 0   ∃n₀(ε)   ∀n ≥ n₀(ε)</text><text x="60" y="268" text-anchor="start" font-size="18" fill="#1a2e4a">任意小比例，都能选后续范围</text></g></svg>