<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 350" role="img" aria-label="四点在y=x除二上，主方向方差三点一二五，垂直方向零；协方差半正定而奇异。"><title>奇异协方差几何</title><desc>四点在y=x除二上，主方向方差三点一二五，垂直方向零；协方差半正定而奇异。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#2563eb"/></marker></defs><rect width="760" height="350" fill="white"/><g font-family="system-ui,Segoe UI,Microsoft YaHei,sans-serif"><text x="380" y="30" text-anchor="middle" font-size="24" fill="#1a2e4a">PSD允许零投影方差</text><path d="M70,205H420M245,60V300" stroke="#94a3b8"/><path d="M84,285.5L406,124.5" stroke="#15803d" stroke-width="3"/><circle cx="105" cy="275" r="6" fill="#15803d"/><circle cx="175" cy="240" r="6" fill="#15803d"/><circle cx="315" cy="170" r="6" fill="#15803d"/><circle cx="385" cy="135" r="6" fill="#15803d"/><path d="M245,205L175,65" fill="none" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arrow)"/><text x="472" y="100" text-anchor="start" font-size="18" fill="#1a2e4a">经验Cov，分母N</text><text x="472" y="145" text-anchor="start" font-size="21" fill="#1a2e4a">[[2.5,1.25],</text><text x="472" y="176" text-anchor="start" font-size="21" fill="#1a2e4a"> [1.25,.625]]</text><text x="472" y="225" text-anchor="start" font-size="19" fill="#1a2e4a">线方向Var=3.125</text><text x="472" y="267" text-anchor="start" font-size="19" fill="#1a2e4a">垂直方向Var=0</text><text x="380" y="327" text-anchor="middle" font-size="17" fill="#1a2e4a">每方向非负，仍可奇异；几何方差不认证预测。</text></g></svg>