<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 350" role="img" aria-label="训练拟合变换和参数，验证选择模型及停止，最终测试仅在流程冻结后作独立评估；每折重新拟合预处理。"><title>评估拆分与选择角色</title><desc>训练拟合变换和参数，验证选择模型及停止，最终测试仅在流程冻结后作独立评估；每折重新拟合预处理。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#2563eb"/></marker></defs><rect width="760" height="350" fill="white"/><g font-family="system-ui,Segoe UI,Microsoft YaHei,sans-serif"><text x="380" y="30" text-anchor="middle" font-size="23" fill="#1a2e4a">拟合、选择、冻结后评估</text><rect x="30" y="85" width="210" height="145" rx="10" fill="#f0f9ff" stroke="#0ea5e9"/><text x="135" y="133" text-anchor="middle" font-size="22" fill="#1a2e4a">训练</text><text x="135" y="175" text-anchor="middle" font-size="16" fill="#1a2e4a">拟合变换与参数</text><rect x="275" y="85" width="210" height="145" rx="10" fill="#f0f9ff" stroke="#0ea5e9"/><text x="380" y="133" text-anchor="middle" font-size="22" fill="#1a2e4a">验证</text><text x="380" y="175" text-anchor="middle" font-size="16" fill="#1a2e4a">选择模型和停止</text><rect x="520" y="85" width="210" height="145" rx="10" fill="#f0f9ff" stroke="#0ea5e9"/><text x="625" y="133" text-anchor="middle" font-size="22" fill="#1a2e4a">最终测试</text><text x="625" y="175" text-anchor="middle" font-size="16" fill="#1a2e4a">冻结后独立评估</text><path d="M244,155L265,155" fill="none" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M489,155L510,155" fill="none" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arrow)"/><text x="380" y="280" text-anchor="middle" font-size="20" fill="#1a2e4a">交叉验证：每个训练折重新拟合预处理。</text><text x="380" y="327" text-anchor="middle" font-size="19" fill="#1a2e4a">测试结果指导选择后，不再是未触碰测试。</text></g></svg>