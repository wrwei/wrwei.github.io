<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 350" role="img" aria-label="先声明目标尺度，再声明抽样协方差，接着步长与状态，最后预算验证和冻结测试。训练下降本身不是泛化保证。"><title>随机训练报告的数学链</title><desc>先声明目标尺度，再声明抽样协方差，接着步长与状态，最后预算验证和冻结测试。训练下降本身不是泛化保证。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#2563eb"/></marker></defs><rect width="760" height="350" fill="white"/><g font-family="system-ui,Segoe UI,Microsoft YaHei,sans-serif"><text x="380" y="30" text-anchor="middle" font-size="23" fill="#1a2e4a">审计一次更新与一次报告</text><rect x="45" y="55" width="670" height="47" rx="10" fill="#f0f9ff" stroke="#0ea5e9"/><text x="380" y="85" text-anchor="middle" font-size="21" fill="#1a2e4a">目标及正则化尺度</text><path d="M380,105L380,114" fill="none" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="45" y="119" width="670" height="47" rx="10" fill="#f0f9ff" stroke="#0ea5e9"/><text x="380" y="149" text-anchor="middle" font-size="21" fill="#1a2e4a">抽样及条件协方差</text><path d="M380,169L380,178" fill="none" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="45" y="183" width="670" height="47" rx="10" fill="#f0f9ff" stroke="#0ea5e9"/><text x="380" y="213" text-anchor="middle" font-size="21" fill="#1a2e4a">步长与状态递推</text><path d="M380,233L380,242" fill="none" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="45" y="247" width="670" height="47" rx="10" fill="#f0f9ff" stroke="#0ea5e9"/><text x="380" y="277" text-anchor="middle" font-size="21" fill="#1a2e4a">预算、验证与最终测试</text><text x="380" y="333" text-anchor="middle" font-size="19" fill="#1a2e4a">训练下降本身不证明总体泛化。</text></g></svg>