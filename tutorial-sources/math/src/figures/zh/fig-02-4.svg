<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 340" role="img" aria-label="四行布尔表可穷尽两个命题字母的赋值；有限整数区间不穷尽所有整数。"><title>穷尽与抽查的区别</title><desc>四行布尔表可穷尽两个命题字母的赋值；有限整数区间不穷尽所有整数。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#2563eb"/></marker></defs><rect width="760" height="340" fill="white"/><g font-family="system-ui,Segoe UI,Microsoft YaHei,sans-serif"><rect x="35" y="40" width="320" height="245" rx="10" fill="#f0f9ff" stroke="#0ea5e9"/><text x="195" y="76" text-anchor="middle" font-size="20" fill="#1a2e4a">有限布尔论域</text><text x="195" y="115" text-anchor="middle" font-size="21" fill="#1a2e4a">FF, FT, TF, TT</text><text x="195" y="165" text-anchor="middle" font-size="18" fill="#1a2e4a">检查全部四行</text><text x="195" y="211" text-anchor="middle" font-size="17" fill="#1a2e4a">可确立命题有效性</text><rect x="405" y="40" width="320" height="245" rx="10" fill="#fff7ed" stroke="#c2410c"/><text x="565" y="76" text-anchor="middle" font-size="20" fill="#1a2e4a">无限整数论域</text><text x="565" y="115" text-anchor="middle" font-size="18" fill="#1a2e4a">…, −2, −1, 0, 1, 2, …</text><text x="565" y="165" text-anchor="middle" font-size="18" fill="#1a2e4a">只检查有限区间</text><text x="565" y="211" text-anchor="middle" font-size="17" fill="#1a2e4a">其余输入仍未解决</text></g></svg>