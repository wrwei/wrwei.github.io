l="#1a2e4a">1</text><text x="470" y="212" text-anchor="middle" font-size="21" fill="#1a2e4a">0</text><text x="650" y="212" text-anchor="middle" font-size="21" fill="#1a2e4a">1</text><rect x="30" y="229" width="700" height="38" rx="10" fill="#f0f9ff" stroke="#0ea5e9"/><text x="110" y="255" text-anchor="middle" font-size="21" fill="#1a2e4a">(1,1)</text><text x="290" y="255" text-anchor="middle" font-size="21" fill="#1a2e4a">1</text><text x="470" y="255" text-anchor="middle" font-size="21" fill="#1a2e4a">1</text><text x="650" y="255" text-anchor="middle" font-size="21" fill="#1a2e4a">0</text><text x="380" y="305" text-anchor="middle" font-size="19" fill="#1a2e4a">各边缘1/2；每对交1/4；三重交0≠1/8。</text><text x="380" y="337" text-anchor="middle" font-size="18" fill="#1a2e4a">四个结果各质量1/4。</text></g></svg>