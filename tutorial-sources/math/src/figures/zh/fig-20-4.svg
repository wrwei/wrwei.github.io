<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 350" role="img" aria-label="精确投影每步在可行集；标量平方罚问题的极小点二除以一加权重在有限权重下非零，仍违反原等式。"><title>投影与有限平方罚比较</title><desc>精确投影每步在可行集；标量平方罚问题的极小点二除以一加权重在有限权重下非零，仍违反原等式。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#2563eb"/></marker></defs><rect width="760" height="350" fill="white"/><g font-family="system-ui,Segoe UI,Microsoft YaHei,sans-serif"><text x="380" y="30" text-anchor="middle" font-size="22" fill="#1a2e4a">投影强制可行；罚项改变目标</text><rect x="35" y="65" width="330" height="220" rx="10" fill="#f0f9ff" stroke="#0ea5e9"/><rect x="395" y="65" width="330" height="220" rx="10" fill="#f0f9ff" stroke="#0ea5e9"/><text x="200" y="109" text-anchor="middle" font-size="23" fill="#1a2e4a">投影</text><text x="560" y="109" text-anchor="middle" font-size="23" fill="#1a2e4a">平方罚</text><text x="200" y="155" text-anchor="middle" font-size="23" fill="#1a2e4a">x⁺=P_C(x−αg)</text><text x="560" y="155" text-anchor="middle" font-size="23" fill="#1a2e4a">fρ=f+ρx²/2</text><text x="200" y="202" text-anchor="middle" font-size="19" fill="#1a2e4a">精确投影 ⇒ x⁺∈C</text><text x="560" y="202" text-anchor="middle" font-size="23" fill="#1a2e4a">xρ=2/(1+ρ)&gt;0</text><text x="200" y="248" text-anchor="middle" font-size="17" fill="#1a2e4a">边界普通g可非零</text><text x="560" y="248" text-anchor="middle" font-size="17" fill="#1a2e4a">原等式 x=0仍违反</text><text x="380" y="327" text-anchor="middle" font-size="17" fill="#1a2e4a">例 f=(x−2)²/2、约束 x=0；任意有限平方罚权仍不可行。</text></g></svg>