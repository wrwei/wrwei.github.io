<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 360" role="img" aria-label="表区分二项固定尝试，几何首次成功，Poisson率计数，指数连续等待及Gaussian全实支持，提醒参数约定。"><title>分布机制与支持表</title><desc>表区分二项固定尝试，几何首次成功，Poisson率计数，指数连续等待及Gaussian全实支持，提醒参数约定。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#2563eb"/></marker></defs><rect width="760" height="360" fill="white"/><g font-family="system-ui,Segoe UI,Microsoft YaHei,sans-serif"><text x="380" y="30" text-anchor="middle" font-size="24" fill="#1a2e4a">从机制与支持选择分布</text><rect x="25" y="60" width="710" height="42" rx="10" fill="#f0f9ff" stroke="#0ea5e9"/><text x="42" y="88" text-anchor="start" font-size="18" fill="#1a2e4a">二项</text><text x="245" y="88" text-anchor="start" font-size="16" fill="#1a2e4a">固定n、独立同p</text><text x="670" y="88" text-anchor="middle" font-size="18" fill="#1a2e4a">0,…,n</text><rect x="25" y="107" width="710" height="42" rx="10" fill="#f0f9ff" stroke="#0ea5e9"/><text x="42" y="135" text-anchor="start" font-size="18" fill="#1a2e4a">几何试验</text><text x="245" y="135" text-anchor="start" font-size="16" fill="#1a2e4a">稳定尝试首次成功</text><text x="670" y="135" text-anchor="middle" font-size="18" fill="#1a2e4a">1,2,…</text><rect x="25" y="154" width="710" height="42" rx="10" fill="#f0f9ff" stroke="#0ea5e9"/><text x="42" y="182" text-anchor="start" font-size="18" fill="#1a2e4a">Poisson</text><text x="245" y="182" text-anchor="start" font-size="16" fill="#1a2e4a">固定区间率机制</text><text x="670" y="182" text-anchor="middle" font-size="18" fill="#1a2e4a">0,1,…</text><rect x="25" y="201" width="710" height="42" rx="10" fill="#f0f9ff" stroke="#0ea5e9"/><text x="42" y="229" text-anchor="start" font-size="18" fill="#1a2e4a">指数（AI）</text><text x="245" y="229" text-anchor="start" font-size="16" fill="#1a2e4a">连续恒率等待</text><text x="670" y="229" text-anchor="middle" font-size="18" fill="#1a2e4a">[0,∞)</text><rect x="25" y="248" width="710" height="42" rx="10" fill="#f0f9ff" stroke="#0ea5e9"/><text x="42" y="276" text-anchor="start" font-size="18" fill="#1a2e4a">Gaussian（AI）</text><text x="245" y="276" text-anchor="start" font-size="16" fill="#1a2e4a">位置与正尺度误差</text><text x="670" y="276" text-anchor="middle" font-size="18" fill="#1a2e4a">R</text><text x="380" y="333" text-anchor="middle" font-size="18" fill="#1a2e4a">几何失败数从0；率≠尺度，方差≠标准差。</text></g></svg>