<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 360" role="img" aria-label="三个模型的均值方差分别为 sigma 平方除 N、除独立簇数 m、以及 sigma 平方；复制行不会增加独立信息。"><title>独立与复制均值方差</title><desc>三个模型的均值方差分别为 sigma 平方除 N、除独立簇数 m、以及 sigma 平方；复制行不会增加独立信息。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#2563eb"/></marker></defs><rect width="760" height="360" fill="white"/><g font-family="system-ui,Segoe UI,Microsoft YaHei,sans-serif"><text x="380" y="30" text-anchor="middle" font-size="23" fill="#1a2e4a">行数与独立抽样数不同</text><rect x="30" y="62" width="700" height="65" rx="10" fill="#f0fdf4" stroke="#0ea5e9"/><text x="55" y="89" text-anchor="start" font-size="21" fill="#1a2e4a">N 个 IID 抽样</text><text x="700" y="113" text-anchor="end" font-size="21" fill="#1a2e4a">Var(M) = σ²/N</text><rect x="30" y="144" width="700" height="65" rx="10" fill="#fff7ed" stroke="#0ea5e9"/><text x="55" y="171" text-anchor="start" font-size="21" fill="#1a2e4a">m 个独立簇，各复制 b 次</text><text x="700" y="195" text-anchor="end" font-size="21" fill="#1a2e4a">Var(M) = σ²/m = bσ²/N</text><rect x="30" y="226" width="700" height="65" rx="10" fill="#fff7ed" stroke="#0ea5e9"/><text x="55" y="253" text-anchor="start" font-size="21" fill="#1a2e4a">一个抽样复制 N 次</text><text x="700" y="277" text-anchor="end" font-size="21" fill="#1a2e4a">Var(M) = σ²</text><text x="380" y="334" text-anchor="middle" font-size="19" fill="#1a2e4a">协方差不能因增加副本而忽略。</text></g></svg>