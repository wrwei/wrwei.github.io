<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 340" role="img" aria-label="a 只有 python，b 有 python 和 ai，c 只有 ai。aRb 与 bRc 真而 aRc 假。"><title>关键词关系的反例</title><desc>a 只有 python，b 有 python 和 ai，c 只有 ai。aRb 与 bRc 真而 aRc 假。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#2563eb"/></marker></defs><rect width="760" height="340" fill="white"/><g font-family="system-ui,Segoe UI,Microsoft YaHei,sans-serif"><text x="380" y="35" text-anchor="middle" font-size="20" fill="#1a2e4a">共享关键词不是传递关系</text><rect x="20" y="95" width="180" height="115" rx="10" fill="#f0f9ff" stroke="#0ea5e9"/><text x="110" y="133" text-anchor="middle" font-size="26" fill="#1a2e4a">a</text><text x="110" y="172" text-anchor="middle" font-size="17" fill="#1a2e4a">python</text><rect x="290" y="95" width="180" height="115" rx="10" fill="#f0f9ff" stroke="#0ea5e9"/><text x="380" y="133" text-anchor="middle" font-size="26" fill="#1a2e4a">b</text><text x="380" y="172" text-anchor="middle" font-size="17" fill="#1a2e4a">python, ai</text><rect x="560" y="95" width="180" height="115" rx="10" fill="#f0f9ff" stroke="#0ea5e9"/><text x="650" y="133" text-anchor="middle" font-size="26" fill="#1a2e4a">c</text><text x="650" y="172" text-anchor="middle" font-size="17" fill="#1a2e4a">ai</text><path d="M205,151H285M475,151H555" stroke="#15803d" stroke-width="4"/><text x="245" y="127" text-anchor="middle" font-size="19" fill="#1a2e4a">T</text><text x="515" y="127" text-anchor="middle" font-size="19" fill="#1a2e4a">T</text><path d="M110,226Q380,326 650,226" fill="none" stroke="#be123c" stroke-width="3" stroke-dasharray="7 5"/><text x="380" y="300" text-anchor="middle" font-size="18" fill="#1a2e4a">a 与 c 不匹配</text></g></svg>